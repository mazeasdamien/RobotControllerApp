<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Scene Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: rgb(10, 10, 12);
      overflow: hidden;
      font-family: -apple-system, 'Segoe UI Variable', 'Segoe UI', system-ui, BlinkMacSystemFont, sans-serif;
    }

    canvas {
      display: block;
    }

    /* ���� Design Tokens ���������������������������������������������������������������������� */
    :root {
      --glass-bg: rgba(12, 12, 22, 0.82);
      --glass-border: rgba(255, 255, 255, 0.07);
      --blur: blur(18px);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --accent: #5599ff;
      --accent-glow: rgba(85, 153, 255, 0.25);
      --accent2: #ff8c42;
      --green: #00cc6a;
      --red-soft: rgba(255, 80, 80, 0.85);
      --text-muted: rgba(255, 255, 255, 0.38);
      --text-dim: rgba(255, 255, 255, 0.62);
      --text: rgba(255, 255, 255, 0.92);
    }

    /* ���� HUD (top-left) ������������������������������������������������������������������ */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: var(--text);
      font-size: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 12px 16px 10px;
      backdrop-filter: var(--blur);
      width: 200px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 20;
    }

    #hud .hud-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    #hud .hud-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1a2a4a 0%, #0d1a35 100%);
      border: 1px solid rgba(85, 153, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    #hud .hud-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    #hud .hud-subtitle {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    #hud .hud-stats {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    #hud .hud-stat {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 5px 10px;
      flex: 1;
      text-align: center;
    }

    #hud .hud-stat-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 2px;
    }

    #hud .hud-stat-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #hud .hint {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
    }

    #hud .hint::before {
      content: '·';
      font-size: 14px;
      color: rgba(255, 255, 255, 0.25);
      line-height: 1;
    }

    #legend-items {
      margin-top: 0;
    }

    #legend .lt {
      color: var(--text-muted);
      font-weight: 600;
      margin: 6px 0 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .li {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .ld {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px currentColor;
    }

    /* ���� Empty state ������������������������������������������������������������������������ */
    #no-objects {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.18);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    #no-objects svg {
      display: block;
      margin: 0 auto 12px;
      opacity: 0.15;
    }

    /* ���� WS Badge ���������������������������������������������������������������������������� */
    #ws-badge {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      backdrop-filter: var(--blur);
      pointer-events: none;
      transition: border-color 0.4s, box-shadow 0.4s;
      z-index: 10;
    }

    #ws-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #444;
      transition: background 0.4s, box-shadow 0.4s;
      flex-shrink: 0;
    }

    #ws-badge.live .dot {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 204, 106, 0.2);
      animation: pulse-dot 2s infinite;
    }

    #ws-badge.live {
      border-color: rgba(0, 204, 106, 0.3);
      box-shadow: 0 0 20px rgba(0, 204, 106, 0.08);
      color: var(--text-dim);
    }

    #ws-badge.error .dot {
      background: #ff4444;
      box-shadow: 0 0 0 3px rgba(255, 68, 68, 0.2);
    }

    @keyframes pulse-dot {

      0%,
      100% {
        box-shadow: 0 0 0 3px rgba(0, 204, 106, 0.2);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(0, 204, 106, 0.08);
      }
    }

    /* FK / Control Panel � left side, fixed */
    #fk-panel {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      background: var(--glass-bg);
      border: 1px solid rgba(85, 153, 255, 0.18);
      border-radius: var(--radius-lg);
      backdrop-filter: var(--blur);
      color: var(--text);
      font-size: 12px;
      width: 230px;
      overflow: hidden;
      resize: none;
      transition: max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 92vh;
      opacity: 1;
      user-select: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(85, 153, 255, 0.06);
      z-index: 30;
    }

    #fk-panel.collapsed {
      max-height: 44px;
      overflow: hidden;
    }

    #fk-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      height: 44px;
      flex-shrink: 0;
      cursor: pointer;
      background: linear-gradient(90deg, rgba(85, 153, 255, 0.08) 0%, transparent 100%);
      border-bottom: 1px solid rgba(85, 153, 255, 0.10);
      gap: 8px;
      transition: background 0.2s;
    }

    #fk-header:hover {
      background: linear-gradient(90deg, rgba(85, 153, 255, 0.14) 0%, rgba(85, 153, 255, 0.03) 100%);
    }

    #fk-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #fk-header-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, rgba(85, 153, 255, 0.25), rgba(85, 153, 255, 0.08));
      border: 1px solid rgba(85, 153, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    #fk-header-text {
      font-size: 12px;
      font-weight: 600;
      color: #88bbff;
      letter-spacing: 0.02em;
    }

    #fk-live-pill {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0, 204, 106, 0.12);
      border: 1px solid rgba(0, 204, 106, 0.3);
      color: #00cc6a;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: none;
    }

    #fk-live-pill.visible {
      display: block;
    }

    #fk-collapse-btn {
      font-size: 18px;
      color: rgba(85, 153, 255, 0.7);
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
      padding: 2px 4px;
      line-height: 1;
    }

    #fk-panel.collapsed #fk-collapse-btn {
      transform: rotate(-90deg);
    }

    #fk-body {
      padding: 12px 14px 14px;
    }

    .fk-robot-selector {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 3px;
    }

    .fk-robot-btn {
      flex: 1;
      padding: 5px 0;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fk-robot-btn.active {
      background: linear-gradient(135deg, rgba(85, 153, 255, 0.28), rgba(85, 153, 255, 0.12));
      color: #aaccff;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    #fk-sliders {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fk-axis-row {
      display: grid;
      grid-template-columns: 38px 1fr 46px;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
    }

    .fk-axis-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .fk-slider-wrap {
      position: relative;
    }

    .fk-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: rgba(85, 153, 255, 0.12);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .fk-slider:hover {
      background: rgba(85, 153, 255, 0.2);
    }

    .fk-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #88bbff, #3366cc);
      box-shadow: 0 0 6px rgba(85, 153, 255, 0.55), 0 2px 4px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.15);
      transition: box-shadow 0.15s, transform 0.15s;
    }

    .fk-slider:active::-webkit-slider-thumb {
      box-shadow: 0 0 12px rgba(85, 153, 255, 0.8);
      transform: scale(1.15);
    }

    .fk-val {
      font-size: 11px;
      font-weight: 600;
      color: #aaccff;
      text-align: right;
      font-variant-numeric: tabular-nums;
      background: rgba(85, 153, 255, 0.08);
      border: 1px solid rgba(85, 153, 255, 0.14);
      border-radius: 5px;
      padding: 2px 6px;
    }

    .fk-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
      margin: 8px 0;
    }

    #fk-reset-btn {
      width: 100%;
      margin-top: 8px;
      padding: 7px 0;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 100, 100, 0.2);
      background: rgba(255, 60, 60, 0.06);
      color: rgba(255, 150, 150, 0.75);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      letter-spacing: 0.03em;
    }

    #fk-reset-btn:hover {
      background: rgba(255, 60, 60, 0.14);
      border-color: rgba(255, 100, 100, 0.35);
      color: rgba(255, 180, 180, 0.9);
    }

    /* ���� IK Panel �������������������������������������������������������������������������������������������� */
    #ik-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 8px;
    }

    #ik-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
      background: rgba(255, 165, 0, 0.06);
      border-bottom: 1px solid rgba(255, 165, 0, 0.12);
      user-select: none;
    }

    #ik-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      color: #ffaa44;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    #ik-collapse-btn {
      font-size: 18px;
      color: rgba(255, 165, 0, 0.7);
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
      padding: 2px 4px;
      line-height: 1;
    }

    #ik-panel.collapsed #ik-body {
      display: none;
    }

    #ik-panel.collapsed #ik-collapse-btn {
      transform: rotate(-90deg);
    }

    #ik-body {
      padding: 10px 13px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ik-robot-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .ik-robot-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 7px;
      padding: 8px 10px;
    }

    .ik-robot-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .ik-r1-title {
      color: #5599ff;
    }

    .ik-r2-title {
      color: #FFD279;
    }

    .ik-toggle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .ik-toggle {
      width: 28px;
      height: 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }

    .ik-toggle.active {
      background: rgba(255, 140, 0, 0.4);
      border-color: rgba(255, 140, 0, 0.6);
    }

    .ik-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: left 0.2s, background 0.2s;
    }

    .ik-toggle.active::after {
      left: 15px;
      background: #ffaa44;
    }

    .ik-toggle-label {
      font-size: 10px;
      color: var(--text-muted);
    }

    .ik-pos-display {
      font-size: 10px;
      font-family: 'Consolas', monospace;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 6px;
      line-height: 1.6;
    }

    #cp-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    .cp-action-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      white-space: nowrap;
    }

    .cp-action-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--text);
    }

    #sb-vr-btn {
      border-color: rgba(120, 80, 255, 0.35);
      background: rgba(90, 50, 220, 0.10);
      color: rgba(200, 180, 255, 0.85);
    }

    #sb-vr-btn:hover {
      background: rgba(90, 50, 220, 0.22);
    }

    #sb-vr-btn.active {
      background: rgba(80, 40, 200, 0.3);
      border-color: rgba(150, 110, 255, 0.8);
    }

    #sb-vr-btn.unsupported {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ���� Context / Scene Panel ������������������������������������������������������������������������ */
    #ctx-panel {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-bg);
      border: 1px solid rgba(0, 204, 106, 0.18);
      border-radius: var(--radius-lg);
      backdrop-filter: var(--blur);
      color: var(--text);
      font-size: 12px;
      width: 320px;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 400px;
      user-select: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 204, 106, 0.06);
      z-index: 30;
    }

    #ctx-panel.collapsed {
      max-height: 46px;
      overflow: hidden;
    }

    #ctx-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      height: 44px;
      flex-shrink: 0;
      cursor: pointer;
      background: linear-gradient(90deg, rgba(0, 204, 106, 0.08) 0%, transparent 100%);
      border-bottom: 1px solid rgba(0, 204, 106, 0.10);
      gap: 8px;
      transition: background 0.2s;
    }

    #ctx-header:hover {
      background: linear-gradient(90deg, rgba(0, 204, 106, 0.15) 0%, rgba(0, 204, 106, 0.03) 100%);
    }

    #ctx-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #ctx-header-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, rgba(0, 204, 106, 0.25), rgba(0, 180, 90, 0.08));
      border: 1px solid rgba(0, 204, 106, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #ctx-header-text {
      font-size: 12px;
      font-weight: 600;
      color: #55ddaa;
      letter-spacing: 0.02em;
    }

    #ctx-collapse-btn {
      font-size: 18px;
      color: rgba(0, 204, 106, 0.7);
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
      padding: 2px 4px;
      line-height: 1;
    }

    #ctx-panel.collapsed #ctx-collapse-btn {
      transform: rotate(-90deg);
    }

    #ctx-body {
      padding: 12px 14px 14px;
    }

    .ctx-scan-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    #ctx-scan-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(0, 204, 106, 0.35);
      background: rgba(0, 204, 106, 0.08);
      color: #55ddaa;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
    }

    #ctx-scan-btn:hover {
      background: rgba(0, 204, 106, 0.16);
      border-color: rgba(0, 204, 106, 0.55);
    }

    #ctx-scan-btn.scanning {
      background: rgba(0, 204, 106, 0.22);
      border-color: rgba(0, 204, 106, 0.7);
      animation: scan-pulse 1.1s infinite;
    }

    @keyframes scan-pulse {

      0%,
      100% {
        box-shadow: 0 0 0 rgba(0, 204, 106, 0);
      }

      50% {
        box-shadow: 0 0 12px rgba(0, 204, 106, 0.4);
      }
    }

    #ctx-autoscan-btn {
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 160, 50, 0.3);
      background: rgba(255, 140, 30, 0.07);
      color: rgba(255, 200, 120, 0.85);
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      white-space: nowrap;
    }

    #ctx-autoscan-btn:hover {
      background: rgba(255, 140, 30, 0.16);
    }

    #ctx-autoscan-btn.active {
      background: rgba(255, 140, 30, 0.22);
      border-color: rgba(255, 180, 80, 0.65);
      color: #ffc864;
      animation: scan-pulse 1.3s infinite;
    }

    #ctx-status {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      min-height: 14px;

    function findJoints(root) {
      const joints = [];
      for (let i = 0; i < 6; i++) {
        let found = null;
        root.traverse((node) => {
          if (found) return;
          const n = node.name.toLowerCase();
          for (const pat of JOINT_PATTERNS[i]) {
            if (n === pat.toLowerCase() || n.startsWith(pat.toLowerCase())) { found = node; return; }
          }

        if (!found) {
          let count = 0;
          root.traverse((node) => {
            if (found) return;

      });

      const IK_HANDLE_OUTER = new THREE.SphereGeometry(0.040, 16, 16);

      FK_ROBOTS.forEach((fkR, idx) => {
        const group = new THREE.Group();
        group.add(new THREE.Mesh(IK_HANDLE_GEO, new THREE.MeshBasicMaterial({ color: IK_GHOST_COLORS[idx], transparent: true, opacity: 0.9 })));
        group.add(new THREE.Mesh(IK_HANDLE_OUTER, new THREE.MeshBasicMaterial({ color: IK_GHOST_COLORS[idx], transparent: true, opacity: 0.18, depthWrite: false })));

          fkR.root.updateWorldMatrix(true, true);
          if (tip.getWorldPosition) tip.getWorldPosition(wp); else wp.setFromMatrixPosition(tip.matrixWorld);
          group.position.copy(wp);
        } else {

        }

        IK_TARGET_POS[idx].copy(group.position);
        group.visible = false;
        scene.add(group);
        IK_HANDLES.push(group);
      });

      // CORRECTION CRITIQUE DE SYNTAXE (Fermeture du load)
    }, undefined, (e) => {
      console.warn("Fichier ned.glb introuvable. Simulation sans les meshes 3D du bras.", e);
    });

    // ���� IK Logic Methods ����
    function applyGhostFk(robotIdx) {
      const ghost = IK_GHOSTS[robotIdx];
      if (!ghost) return;
      const angles = IK_ANGLES_R[robotIdx];
      for (let i = 0; i < 6; i++) {
        const joint = ghost.joints[i];
        if (!joint) continue;
        const rad = angles[i] * Math.PI / 180;
        joint.quaternion.copy(joint.userData.restQ || new THREE.Quaternion()).multiply(new THREE.Quaternion().setFromAxisAngle(JOINT_AXES[i], rad));
      }
      ghost.root.updateWorldMatrix(true, true);
    }

    function solveLinear3(A, b) {
      const M = A.map(r => [...r]), x = [...b];
      for (let k = 0; k < 2; k++)
        for (let i = k + 1; i < 3; i++) {
          if (Math.abs(M[k][k]) < 1e-12) continue;
          const f = M[i][k] / M[k][k];
          for (let j = k; j < 3; j++) M[i][j] -= f * M[k][j];
          x[i] -= f * x[k];
        }
      const res = [0, 0, 0];
      for (let i = 2; i >= 0; i--) {
        let s = 0; for (let j = i + 1; j < 3; j++) s += M[i][j] * res[j];
        res[i] = Math.abs(M[i][i]) < 1e-12 ? 0 : (x[i] - s) / M[i][i];
      }
      return res;
    }

    window.solveIkStep = function (robotIdx) {
      const ghost = IK_GHOSTS[robotIdx], tip = ghost?.tip;
      if (!ghost || !tip || !IK_ENABLED[robotIdx]) return;

      const angles = IK_ANGLES_R[robotIdx], target = IK_TARGET_POS[robotIdx], DELTA_RAD = IK_DELTA_DEG * Math.PI / 180;

      applyGhostFk(robotIdx);
      tip.getWorldPosition(_ee0);
      _posErr.subVectors(target, _ee0);
      if (_posErr.length() < IK_STOP_THRESH) return;

      for (let i = 0; i < 6; i++) {
        const saved = angles[i]; angles[i] += IK_DELTA_DEG;
        applyGhostFk(robotIdx);
        tip.getWorldPosition(_ee1);
        _J[0][i] = (_ee1.x - _ee0.x) / DELTA_RAD; _J[1][i] = (_ee1.y - _ee0.y) / DELTA_RAD; _J[2][i] = (_ee1.z - _ee0.z) / DELTA_RAD;
        angles[i] = saved;
      }
      applyGhostFk(robotIdx);

      for (let r = 0; r < 3; r++)
        for (let c = 0; c < 3; c++) { let s = 0; for (let k = 0; k < 6; k++) s += _J[r][k] * _J[c][k]; JJT[r][c] = s + (r === c ? lam2 : 0); }

      const x = solveLinear3(JJT, [_posErr.x, _posErr.y, _posErr.z]);
      for (let i = 0; i < 6; i++) {
        let dang = 0; for (let j = 0; j < 3; j++) dang += _J[j][i] * x[j];
        dang *= IK_LEARNING_RATE * 180 / Math.PI;

    // ���� IK TransformControls Dragging ������������

    let _ikDragIdx = -1;

    function updateIkMouse(e) {
      const rect = renderer.domElement.getBoundingClientRect();

      _ikMouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      _ikRaycaster.setFromCamera(_ikMouse, camera);

      if (ikTransformControl.object && _ikRaycaster.intersectObject(ikTransformControl, true).length > 0) return;

      let found = null, minDist = Infinity;
      for (let i = 0; i < IK_HANDLES.length; i++) {
        if (!IK_ENABLED[i]) continue;
        const hits = _ikRaycaster.intersectObjects(IK_HANDLES[i].children, false);
        if (hits.length && hits[0].distance < minDist) { minDist = hits[0].distance; found = IK_HANDLES[i]; }
      }
      if (found) { ikTransformControl.attach(found); e.stopPropagation(); return; }

      if (!IK_HANDLES.length) return;
      updateIkMouse(e); _ikRaycaster.setFromCamera(_ikMouse, camera);
      for (let i = 0; i < IK_HANDLES.length; i++) {
        if (!IK_ENABLED[i]) continue;
        const hits = _ikRaycaster.intersectObjects(IK_HANDLES[i].children, false);
        if (hits.length) {
          _ikDragIdx = i; controls.enabled = false;
          const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
          _ikDragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), hits[0].point);
          _ikDragOffset.subVectors(IK_HANDLES[i].position, hits[0].point);

    }, { capture: true });

      return;

      updateIkMouse(e); _ikRaycaster.setFromCamera(_ikMouse, camera);

      if (_ikRaycaster.ray.intersectPlane(_ikDragPlane, pt)) {
        const newPos = pt.clone().add(_ikDragOffset);
        IK_HANDLES[_ikDragIdx].position.copy(newPos); IK_TARGET_POS[_ikDragIdx].copy(newPos);
        const el = document.getElementById(`ik-r${_ikDragIdx + 1}-pos`);

      }
    }, { capture: true });

    // Pointer up handler removed

    // ���� IK UI callbacks ����������������������������������������������������������������������������������
    window.toggleIkPanel = function () {

    window.toggleIk = function (robotIdx) {

      if (IK_ENABLED[robotIdx]) {
        const realRobot = FK_ROBOTS[robotIdx];
        if (realRobot) {
          realRobot.root.updateWorldMatrix(true, true);
          IK_ANGLES_R[robotIdx] = [...FK_ANGLES_R[robotIdx]]; applyGhostFk(robotIdx);

          const tip = IK_GHOSTS[robotIdx].tip;
          if (tip) {
            const wp = new THREE.Vector3(); tip.getWorldPosition(wp);
            IK_HANDLES[robotIdx].position.copy(wp); IK_TARGET_POS[robotIdx].copy(wp);
          }
        }
      }
    };

    let _ikLastSendMs = [0, 0];
    window._ikSendContinuous = function (robotIdx) {
      // intentionally empty: IK applies only to ghost robots
    };

    // ���� Marker Board Representation (Real scale ~ 30cm x 18.9cm) ����
    const boardMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const boardMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.30, 0.189), boardMat);
    boardMesh.rotation.x = -Math.PI / 2; boardMesh.position.set(0, 0.002, 0); scene.add(boardMesh);

    const axesHelper = new THREE.AxesHelper(0.10); axesHelper.position.y = 0.005; scene.add(axesHelper);

    window._guidesVisible = false; boardMesh.visible = false; axesHelper.visible = false;

    window.toggleCalibrationPlane = function () {
      window._guidesVisible = !window._guidesVisible;
      const btn = document.getElementById('sb-calib-guides-btn'), lbl = document.getElementById('sb-calib-guides-label');
      if (btn) btn.style.opacity = window._guidesVisible ? '1' : '0.55';
      if (lbl) lbl.textContent = window._guidesVisible ? '\u00a0Hide Target' : '\u00a0Show Target';
      boardMesh.visible = axesHelper.visible = window._guidesVisible;
      if (camCone) camCone.visible = window._guidesVisible;
      if (camFrustumLines) camFrustumLines.visible = window._guidesVisible;
    };

    // ���� Object group ����
    const objGroup = new THREE.Group(); scene.add(objGroup);

    // ���� Camera Cone ����
    let camCone = null, camFrustumLines = null, camVideoPlane = null, camVideoTexture = null;
    let _camImage = new Image(), _camImageLoading = false;

    function buildCameraViz(tx, ty, tz, poseObj) {
      try {
        if (camCone) { scene.remove(camCone); camCone.geometry.dispose(); camCone.material.dispose(); }
        if (camFrustumLines) { scene.remove(camFrustumLines); camFrustumLines.geometry.dispose(); camFrustumLines.material.dispose(); }
        if (camVideoPlane) { scene.remove(camVideoPlane); camVideoPlane.geometry.dispose(); camVideoPlane.material.dispose(); camVideoPlane = null; }

        const coneGeo = new THREE.ConeGeometry(0.06, 0.14, 4, 1, false, Math.PI / 4);
        coneGeo.translate(0, -0.07, 0); coneGeo.rotateX(Math.PI / 2);

        camCone = new THREE.Mesh(coneGeo, new THREE.MeshStandardMaterial({ color: 0xffc300, emissive: 0xffc300, emissiveIntensity: 0.12, roughness: 0.4 }));
        const camX = tx || 0, camY = Math.max(0.05, Math.abs(tz || 0)), camZ = -(ty || 0);
        camCone.position.set(camX, camY, camZ);

        if (poseObj && poseObj.Rx !== undefined) {
          const ax = poseObj.Rx || 0, ay = poseObj.Ry || 0, az = poseObj.Rz || 0;
          const angle = Math.sqrt(ax * ax + ay * ay + az * az);
          const qCv = new THREE.Quaternion();
          if (angle > 0.0001) qCv.setFromAxisAngle(new THREE.Vector3(ax / angle, ay / angle, az / angle), -angle);

          const qWorld = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
          const qRot180 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI);
          const qFinal = new THREE.Quaternion().copy(qWorld).multiply(qCv).multiply(qRot180);

          camCone.quaternion.copy(qFinal);
          camCone.castShadow = false; camCone.visible = window._guidesVisible !== false; scene.add(camCone);

          const apex = new THREE.Vector3(camX, camY, camZ);
          const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(qFinal), trueUp = new THREE.Vector3(0, -1, 0).applyQuaternion(qFinal), right = new THREE.Vector3(1, 0, 0).applyQuaternion(qFinal);

          let dist = 2.0; if (forward.y < -0.05) dist = Math.abs(camY / forward.y);

          const aspect = (camVideoTexture?.image?.width > 0) ? (camVideoTexture.image.width / camVideoTexture.image.height) : (16 / 9);
          const fovScale = window.currentFovScale !== undefined ? window.currentFovScale : 0.45;
          const halfH = dist * fovScale, halfW = halfH * aspect;
          const centerFocus = apex.clone().addScaledVector(forward, dist);

          function getIntercept(point) {
            const ray = point.clone().sub(apex);
            if (ray.y >= -0.001) return apex.clone().add(ray.normalize().multiplyScalar(15));
            return apex.clone().add(ray.multiplyScalar((0.002 - apex.y) / ray.y));
          }

          const corners = [
            getIntercept(centerFocus.clone().addScaledVector(right, -halfW).addScaledVector(trueUp, halfH)),
            getIntercept(centerFocus.clone().addScaledVector(right, halfW).addScaledVector(trueUp, halfH)),
            getIntercept(centerFocus.clone().addScaledVector(right, halfW).addScaledVector(trueUp, -halfH)),
            getIntercept(centerFocus.clone().addScaledVector(right, -halfW).addScaledVector(trueUp, -halfH))
          ];

          if (camVideoTexture) {
            const rectGeo = new THREE.PlaneGeometry(1, 1, 32, 32);
            const posAttr = rectGeo.attributes.position, uvAttr = rectGeo.attributes.uv;

            for (let i = 0; i < posAttr.count; i++) {
              const u = uvAttr.getX(i), v = uvAttr.getY(i);
              const wX = ((1.0 - u) - 0.5) * 2.0 * halfW, wY = ((1.0 - v) - 0.5) * 2.0 * halfH;
              posAttr.setXYZ(i, ...getIntercept(centerFocus.clone().addScaledVector(right, wX).addScaledVector(trueUp, wY)).toArray());
            }
            rectGeo.computeVertexNormals();
            camVideoPlane = new THREE.Mesh(rectGeo, new THREE.MeshBasicMaterial({ map: camVideoTexture, side: THREE.DoubleSide, transparent: true, opacity: window.currentCamOpacity !== undefined ? window.currentCamOpacity : 0.85 }));
            scene.add(camVideoPlane);
          }

          const lines = []; corners.forEach(c => { lines.push(apex); lines.push(c); });
          for (let i = 0; i < 4; i++) { lines.push(corners[i]); lines.push(corners[(i + 1) % 4]); }

          camFrustumLines = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lines), new THREE.LineBasicMaterial({ color: 0xffc300, opacity: 0.45, transparent: true }));
          camFrustumLines.visible = window._guidesVisible !== false; scene.add(camFrustumLines);
        }
      } catch (err) { console.error('[setCameraPose error]', err); }
    }

    function colorFromLabel(label) {
      if (!label) return 0xffffff;
      const map = { red: 0xff3333, blue: 0x3366ff, green: 0x33cc66, yellow: 0xffdd00, orange: 0xff7700, purple: 0xaa44ff, pink: 0xff66aa, white: 0xeeeeff, black: 0x222233, grey: 0x778899, brown: 0xaa6633, cyan: 0x00ddff, magenta: 0xff00aa };
      const lo = label.toLowerCase();
      for (const [k, v] of Object.entries(map)) if (lo.includes(k)) return v;

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.10, 10), bodyMat); body.rotation.x = -Math.PI / 8;
        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 6, 0, Math.PI * 2, 0, Math.PI * 0.5), bodyMat); cap.position.y = 0.05;
        grip.add(body, cap); _gripRoot.add(grip);
      });
    })();

    function syncCtrlRoots() { _ctrlRoot.position.copy(scene.position).negate(); _gripRoot.position.copy(scene.position).negate(); }
    function tickWorldGrab() {
      syncCtrlRoots(); if (!_grabbing || !_gripState[0] || !_gripState[1]) return;
      _p0.setFromMatrixPosition(_xrCtrls[0].matrixWorld); _p1.setFromMatrixPosition(_xrCtrls[1].matrixWorld);
      _mid.addVectors(_p0, _p1).multiplyScalar(0.5); _rawDelta.subVectors(_mid, _grabMid);
      if (_rawDelta.lengthSq() > 0.25) _rawDelta.setLength(0.5);
      scene.position.copy(_grabScenePos).add(_rawDelta);
      const dist = _p0.distanceTo(_p1);
      if (_grabDist > 0.01) scene.scale.setScalar(THREE.MathUtils.clamp(_grabScaleBase * (dist / _grabDist), 0.05, 6));
    }

    function saveAnchorPosition() {
      const { x, y, z } = scene.position, s = scene.scale.x; localStorage.setItem(ANCHOR_KEY, JSON.stringify({ x, y, z, s }));
      if (_xrSession && _xrRefSpace) {
        try { renderer.xr.getFrame()?.createAnchor(new XRRigidTransform({ x, y, z, w: 1 }, { x: 0, y: 0, z: 0, w: 1 }), _xrRefSpace).then(a => { _xrAnchor = a; a.requestPersistentHandle?.().then(uuid => localStorage.setItem(ANCHOR_KEY + '_uuid', uuid)).catch(() => { }); }).catch(() => { }); } catch (_) { }
      }
    }

    async function restoreAnchorPosition(session) {
      const uuid = localStorage.getItem(ANCHOR_KEY + '_uuid');
      if (uuid && session.restorePersistentAnchor) { try { _xrAnchor = await session.restorePersistentAnchor(uuid); return; } catch (e) { } }
      try { const s = JSON.parse(localStorage.getItem(ANCHOR_KEY)); if (s) { scene.position.set(s.x ?? 0, s.y ?? 0.75, s.z ?? -0.5); scene.scale.setScalar(s.s ?? 1); return; } } catch (_) { }
      scene.position.set(0, 0.75, -0.5);
    }

    function showXrToast(msg, ms) {
      const t = document.getElementById('xr-toast'); if (!t) return;
      t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), ms || 6000);
    }

    window.toggleVR = async function () {
      if (_xrSession) { await _xrSession.end(); return; }
      if (!window.isSecureContext) { showXrToast('WebXR needs HTTPS.'); return; }
      if (!navigator.xr) { showXrToast('navigator.xr not available.'); return; }

      const arOk = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      const vrOk = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
      if (!arOk && !vrOk) { showXrToast('Neither AR nor VR is supported on this device.'); return; }
      _xrMode = arOk ? 'immersive-ar' : 'immersive-vr';

      try {
        const session = await navigator.xr.requestSession(_xrMode, {
          optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'dom-overlay', 'layers', 'anchors'],
          domOverlay: { root: document.body }
        });
        _xrSession = session;

        const btn = document.getElementById('sb-vr-btn'), icon = document.getElementById('sb-vr-icon'), label = document.getElementById('sb-vr-label');
        if (btn) btn.classList.add('active'); if (icon) icon.textContent = '\u23f9\ufe0f'; if (label) label.textContent = _xrMode === 'immersive-ar' ? '\u00a0Exit MR' : '\u00a0Exit VR';

        _savedBg = scene.background; _savedFog = scene.fog;
        if (_xrMode === 'immersive-ar') { scene.background = null; scene.fog = null; renderer.setClearColor(0x000000, 0); }

        scene.scale.setScalar(1); renderer.xr.setFramebufferScaleFactor(1.5);
        await renderer.xr.setSession(session); renderer.xr.setReferenceSpaceType('local-floor'); _xrRefSpace = renderer.xr.getReferenceSpace();
        try { const l = session.renderState.layers?.[0]; if (l && 'fixedFoveation' in l) l.fixedFoveation = 0; } catch (_) { }

        await restoreAnchorPosition(session);

        session.addEventListener('end', () => {
          _xrSession = null; scene.background = _savedBg; scene.fog = _savedFog; scene.position.set(0, 0, 0); scene.scale.setScalar(1); renderer.setClearColor(0x000000, 1);
          _gripState[0] = _gripState[1] = false; _grabbing = false;
          if (btn) btn.classList.remove('active'); if (icon) icon.textContent = '�x��'; if (label) label.textContent = _xrMode === 'immersive-ar' ? '\u00a0Enter MR' : '\u00a0Enter VR';
        });
      } catch (err) { showXrToast('XR failed: ' + (err.message || err)); }
    };

    (async () => {
      const btn = document.getElementById('sb-vr-btn'), lbl = document.getElementById('sb-vr-label');
      if (!navigator.xr) { if (btn) { btn.classList.add('unsupported'); btn.title = 'WebXR not available'; } return; }
      const arOk = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      const vrOk = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
      if (!arOk && !vrOk && btn) { btn.classList.add('unsupported'); btn.title = 'XR not supported - HTTPS required?'; }
      else if (lbl) lbl.textContent = arOk ? '\u00a0Enter MR' : '\u00a0Enter VR';
    })();

    // ���� Render loop ����
    renderer.setAnimationLoop(() => {
      tickWorldGrab();
      if (typeof window.solveIkStep === 'function') {
        for (let i = 0; i < 2; i++) {
          if (IK_ENABLED[i]) { window.solveIkStep(i); if (window._ikSendContinuous) window._ikSendContinuous(i); }
        }
      }
      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

    // ���� Remote WebSocket client ����������������������������
    (function initRemoteWS() {
      const badge = document.getElementById('ws-badge'), label = document.getElementById('ws-label');
      const isRemote = location.hostname !== 'app.local' && location.hostname !== '';
      if (!isRemote) { if (badge) badge.style.display = 'none'; return; }

      let retryDelay = 1500, ws = null;

      async function serverReachable() { try { const r = await fetch(`${location.origin}/ping`, { signal: AbortSignal.timeout(3000) }); return r.ok; } catch { return false; } }

      async function connect() {
        if (label) label.textContent = 'Checking⬦'; if (badge) badge.classList.remove('live', 'error');

        const reachable = await serverReachable();
        if (!reachable) {
          if (label) label.textContent = 'Hub offline'; if (badge) badge.classList.add('error');
          setTimeout(connect, Math.min(retryDelay * 2, 15000)); retryDelay = Math.min(retryDelay * 1.5, 15000); return;
        }

        const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${wsProto}://${location.host}/scene3d-ws`); window._remoteWs = ws;

        ws.onopen = () => { retryDelay = 1500; if (badge) badge.classList.add('live'); if (label) label.textContent = 'Live'; };

        ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            switch (msg.type) {
              case 'setCameraPose': if (window.setCameraPose) window.setCameraPose(JSON.stringify(msg.payload)); break;
              case 'setDetectedObjects': if (window.setDetectedObjects) window.setDetectedObjects(JSON.stringify(msg.payload)); break;
              case 'updateCameraFeed': if (window.updateCameraFeed) window.updateCameraFeed(msg.payload); break;
              case 'setRobotJoints': {
                const { angles, robotIdx } = msg.payload;
                if (Array.isArray(angles) && window.setRobotJoints) {
                  window.setRobotJoints(JSON.stringify(angles), robotIdx ?? 0);
                  const panel = document.getElementById('fk-panel');
                  if (panel && panel.classList.contains('collapsed') && angles.some(a => Math.abs(a) > 0.5)) panel.classList.remove('collapsed');
                }
                break;
              }
              case 'voiceTranscription': {
                const text = typeof msg.payload === 'string' ? msg.payload : JSON.stringify(msg.payload);
                const voiceOut = document.getElementById('voice-output'), voiceStatus = document.getElementById('voice-status');
                const alreadyComplete = voiceStatus && voiceStatus.textContent === 'Transcription complete';
                if (voiceOut && !alreadyComplete) { voiceOut.textContent = text; voiceOut.classList.add('has-text'); }
                if (voiceStatus && !alreadyComplete) { voiceStatus.textContent = 'Transcription received'; voiceStatus.className = 'success'; }
                document.getElementById('voice-panel')?.classList.remove('collapsed');
                break;
              }
              
            }
          } catch (e) { console.warn('WS parse error', e); }
        };

        ws.onerror = () => { if (badge) badge.classList.remove('live', 'error'); if (badge) badge.classList.add('error'); if (label) label.textContent = 'Error'; };
        ws.onclose = () => { if (badge) badge.classList.remove('live'); if (label) label.textContent = 'Reconnecting⬦'; setTimeout(connect, retryDelay); retryDelay = Math.min(retryDelay * 1.5, 15000); };
      }
      connect();
    })();

    // ���� Voice-to-Text Panel ������������������������������������������������������������������������������������������������������
    (function initVoicePanel() {
      let _mediaRecorder = null, _audioChunks = [], _isRecording = false;
      const pttBtn = document.getElementById('ptt-btn'), pttLabel = document.getElementById('ptt-label'), voiceOutput = document.getElementById('voice-output'), voiceStatus = document.getElementById('voice-status');

      window.toggleVoicePanel = function () {
        const p = document.getElementById('voice-panel'); if (p && p.dataset.dragged !== 'true') p.classList.toggle('collapsed');
      };

      window.startHoldRecord = async function (e) { if (e) e.preventDefault(); if (_isRecording) return; await startRecording(); };
      window.stopHoldRecord = function (e) { if (e) e.preventDefault(); if (!_isRecording) return; stopRecording(); };

      async function startRecording() {
        try {
          const micSelect = document.getElementById('mic-select'), deviceId = micSelect ? micSelect.value : '';
          const stream = await navigator.mediaDevices.getUserMedia({ audio: deviceId ? { deviceId: { exact: deviceId } } : true, video: false });
          const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
          _mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
          _audioChunks = []; _isRecording = true;
          _mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) _audioChunks.push(e.data); };
          _mediaRecorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); uploadAudio(); };
          _mediaRecorder.start();
          pttBtn.classList.add('recording'); pttLabel.textContent = 'Release to send⬦'; setStatus('Recording � release to send', '');
        } catch (err) { setStatus('Microphone access denied: ' + err.message, 'error'); _isRecording = false; }
      }

      function stopRecording() {
        if (_mediaRecorder && _mediaRecorder.state !== 'inactive') _mediaRecorder.stop();
        _isRecording = false; pttBtn.classList.remove('recording'); pttBtn.classList.add('loading'); pttLabel.textContent = 'Processing⬦'; setStatus('Sending to Whisper⬦', '');
      }

      async function uploadAudio() {
        if (_audioChunks.length === 0) { resetBtn(); setStatus('No audio captured.', 'error'); return; }
        const blob = new Blob(_audioChunks, { type: _mediaRecorder.mimeType || 'audio/webm' }), formData = new FormData(); formData.append('file', blob, 'voice.webm');
        const baseUrl = (location.hostname === 'app.local' || location.hostname === '') ? 'http://localhost:8181' : `${location.protocol}//${location.host}`;
        try {
          const resp = await fetch(`${baseUrl}/transcribe`, { method: 'POST', body: formData });
          if (!resp.ok) {
            const raw = await resp.text();
            // Strip HTML tags so a Cloudflare error page doesn't flood the UI
            const plain = raw.replace(/<[^>]+>/g, ' ').replace(/\s{2,}/g, ' ').trim().slice(0, 120);
            setStatus(`Error ${resp.status}${plain ? ': ' + plain : ''}`, 'error');
          }
          else {
            const data = await resp.json(), text = data.text || '';
            if (text.trim()) { voiceOutput.textContent = text.trim(); voiceOutput.classList.add('has-text'); setStatus('Transcription complete', 'success'); if (window.sendCommandToHost) window.sendCommandToHost('voiceTranscription', text.trim()); }
            else { setStatus('No speech detected.', 'error'); }
          }
        } catch (err) { setStatus('Network error: ' + err.message, 'error'); } finally { resetBtn(); }
      }

      function setStatus(msg, cls) { if (voiceStatus) { voiceStatus.textContent = msg; voiceStatus.className = cls ? `${cls}` : ''; } }
      function resetBtn() { pttBtn.classList.remove('loading', 'recording'); pttLabel.textContent = 'Hold to Record'; _isRecording = false; }

      setTimeout(async () => {
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true }); tempStream.getTracks().forEach(t => t.stop());
          const devices = await navigator.mediaDevices.enumerateDevices(), select = document.getElementById('mic-select');
          if (select) {
            select.innerHTML = '<option value="">Default Microphone</option>';
            devices.filter(d => d.kind === 'audioinput').forEach(device => {
              const option = document.createElement('option'); option.value = device.deviceId; option.text = device.label || `Microphone ${select.options.length}`; select.appendChild(option);
            });
            const intelOption = Array.from(select.options).find(o => o.text.toLowerCase().includes('intel')); if (intelOption) select.value = intelOption.value;
          }
        } catch (e) { console.error("Failed to list microphones", e); }
      }, 1000);
    })();
  </script>
