<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <title>3D Scene Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: rgb(10, 10, 12);
      overflow: hidden;
      font-family: -apple-system, 'Segoe UI Variable', 'Segoe UI', system-ui, BlinkMacSystemFont, sans-serif;
    }

    canvas {
      display: block;
    }

    /* ── Design Tokens ─────────────────────────────────── */
    :root {
      --glass-bg: rgba(12, 12, 22, 0.82);
      --glass-border: rgba(255, 255, 255, 0.07);
      --blur: blur(18px);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --accent: #5599ff;
      --accent-glow: rgba(85, 153, 255, 0.25);
      --accent2: #ff8c42;
      --green: #00cc6a;
      --red-soft: rgba(255, 80, 80, 0.85);
      --text-muted: rgba(255, 255, 255, 0.38);
      --text-dim: rgba(255, 255, 255, 0.62);
      --text: rgba(255, 255, 255, 0.92);
    }

    /* ── HUD (top-left) ───────────────────────────────── */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: var(--text);
      font-size: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 12px 16px 10px;
      backdrop-filter: var(--blur);
      width: 200px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 20;
    }

    #hud .hud-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    #hud .hud-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1a2a4a 0%, #0d1a35 100%);
      border: 1px solid rgba(85, 153, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    #hud .hud-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    #hud .hud-subtitle {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    #hud .hud-stats {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    #hud .hud-stat {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 5px 10px;
      flex: 1;
      text-align: center;
    }

    #hud .hud-stat-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 2px;
    }

    #hud .hud-stat-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #hud .hint {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
    }

    #hud .hint::before {
      content: 'Â·';
      font-size: 14px;
      color: rgba(255, 255, 255, 0.25);
      line-height: 1;
    }

    #legend-items {
      margin-top: 0;
    }

    #legend .lt {
      color: var(--text-muted);
      font-weight: 600;
      margin: 6px 0 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .li {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .ld {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px currentColor;
    }

    /* ── Empty state ──────────────────────────────────── */
    #no-objects {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.18);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    #no-objects svg {
      display: block;
      margin: 0 auto 12px;
      opacity: 0.15;
    }

    /* ── WS Badge ────────────────────────────────────── */
    #ws-badge {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      backdrop-filter: var(--blur);
      pointer-events: none;
      transition: border-color 0.4s, box-shadow 0.4s;
      z-index: 10;
    }

    #ws-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #444;
      transition: background 0.4s, box-shadow 0.4s;
      flex-shrink: 0;
    }

    #ws-badge.live .dot {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 204, 106, 0.2);
      animation: pulse-dot 2s infinite;
    }

    #ws-badge.live {
      border-color: rgba(0, 204, 106, 0.3);
      box-shadow: 0 0 20px rgba(0, 204, 106, 0.08);
      color: var(--text-dim);
    }

    #ws-badge.error .dot {
      background: #ff4444;
      box-shadow: 0 0 0 3px rgba(255, 68, 68, 0.2);
    }

    @keyframes pulse-dot {

      0%,
      100% {
        box-shadow: 0 0 0 3px rgba(0, 204, 106, 0.2);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(0, 204, 106, 0.08);
      }
    }

    /* FK / Control Panel â€” left side, fixed */
    #fk-panel {
      position: absolute;
      top: 50%;
      left: 370px;
      transform: translateY(-50%);
      background: var(--glass-bg);
      border: 1px solid rgba(85, 153, 255, 0.18);
      border-radius: var(--radius-lg);
      backdrop-filter: var(--blur);
      color: var(--text);
      font-size: 12px;
      width: 230px;
      overflow: hidden;
      resize: none;
      transition: max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 92vh;
      opacity: 1;
      user-select: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(85, 153, 255, 0.06);
      z-index: 30;
    }

    #fk-panel.collapsed {
      max-height: 44px;
      overflow: hidden;
    }

    /* Hide Forward-Kinematics sub-section — kept functional in JS but not needed in UI */
    .fk-robot-selector, #fk-sliders, #fk-reset-btn, .fk-divider {
      display: none !important;
    }

    #fk-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      height: 44px;
      flex-shrink: 0;
      cursor: pointer;
      background: linear-gradient(90deg, rgba(85, 153, 255, 0.08) 0%, transparent 100%);
      border-bottom: 1px solid rgba(85, 153, 255, 0.10);
      gap: 8px;
      transition: background 0.2s;
    }

    #fk-header:hover {
      background: linear-gradient(90deg, rgba(85, 153, 255, 0.14) 0%, rgba(85, 153, 255, 0.03) 100%);
    }

    #fk-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #fk-header-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, rgba(85, 153, 255, 0.25), rgba(85, 153, 255, 0.08));
      border: 1px solid rgba(85, 153, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    #fk-header-text {
      font-size: 12px;
      font-weight: 600;
      color: #88bbff;
      letter-spacing: 0.02em;
    }

    #fk-live-pill {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0, 204, 106, 0.12);
      border: 1px solid rgba(0, 204, 106, 0.3);
      color: #00cc6a;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: none;
    }

    #fk-live-pill.visible {
      display: block;
    }

    #fk-collapse-btn {
      font-size: 18px;
      color: rgba(85, 153, 255, 0.7);
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
      padding: 2px 4px;
      line-height: 1;
    }

    #fk-panel.collapsed #fk-collapse-btn {
      transform: rotate(-90deg);
    }

    #fk-body {
      padding: 12px 14px 14px;
    }

    .fk-robot-selector {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 3px;
    }

    .fk-robot-btn {
      flex: 1;
      padding: 5px 0;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fk-robot-btn.active {
      background: linear-gradient(135deg, rgba(85, 153, 255, 0.28), rgba(85, 153, 255, 0.12));
      color: #aaccff;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    #fk-sliders {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fk-axis-row {
      display: grid;
      grid-template-columns: 38px 1fr 46px;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
    }

    .fk-axis-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .fk-slider-wrap {
      position: relative;
    }

    .fk-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: rgba(85, 153, 255, 0.12);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .fk-slider:hover {
      background: rgba(85, 153, 255, 0.2);
    }

    .fk-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #88bbff, #3366cc);
      box-shadow: 0 0 6px rgba(85, 153, 255, 0.55), 0 2px 4px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.15);
      transition: box-shadow 0.15s, transform 0.15s;
    }

    .fk-slider:active::-webkit-slider-thumb {
      box-shadow: 0 0 12px rgba(85, 153, 255, 0.8);
      transform: scale(1.15);
    }

    .fk-val {
      font-size: 11px;
      font-weight: 600;
      color: #aaccff;
      text-align: right;
      font-variant-numeric: tabular-nums;
      background: rgba(85, 153, 255, 0.08);
      border: 1px solid rgba(85, 153, 255, 0.14);
      border-radius: 5px;
      padding: 2px 6px;
    }

    .fk-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
      margin: 8px 0;
    }

    #fk-reset-btn {
      width: 100%;
      margin-top: 8px;
      padding: 7px 0;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 100, 100, 0.2);
      background: rgba(255, 60, 60, 0.06);
      color: rgba(255, 150, 150, 0.75);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      letter-spacing: 0.03em;
    }

    #fk-reset-btn:hover {
      background: rgba(255, 60, 60, 0.14);
      border-color: rgba(255, 100, 100, 0.35);
      color: rgba(255, 180, 180, 0.9);
    }

    /* ── IK Panel ────────────────────────────────────────────── */
    #ik-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 8px;
    }

    #ik-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
      background: rgba(255, 165, 0, 0.06);
      border-bottom: 1px solid rgba(255, 165, 0, 0.12);
      user-select: none;
    }

    #ik-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      color: #ffaa44;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    #ik-collapse-btn {
      font-size: 18px;
      color: rgba(255, 165, 0, 0.7);
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
      padding: 2px 4px;
      line-height: 1;
    }

    #ik-panel.collapsed #ik-body {
      display: none;
    }

    #ik-panel.collapsed #ik-collapse-btn {
      transform: rotate(-90deg);
    }

    #ik-body {
      padding: 10px 13px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ik-robot-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .ik-robot-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 7px;
      padding: 8px 10px;
    }

    .ik-robot-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .ik-r1-title {
      color: #5599ff;
    }

    .ik-r2-title {
      color: #FFD279;
    }

    .ik-toggle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .ik-toggle {
      width: 28px;
      height: 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }

    .ik-toggle.active {
      background: rgba(255, 140, 0, 0.4);
      border-color: rgba(255, 140, 0, 0.6);
    }

    .ik-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: left 0.2s, background 0.2s;
    }

    .ik-toggle.active::after {
      left: 15px;
      background: #ffaa44;
    }

    .ik-toggle-label {
      font-size: 10px;
      color: var(--text-muted);
    }

    .ik-pos-display {
      font-size: 10px;
      font-family: 'Consolas', monospace;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 6px;
      line-height: 1.6;
    }

    #cp-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    .cp-action-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      white-space: nowrap;
    }

    .cp-action-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--text);
    }

    #sb-vr-btn {
      border-color: rgba(120, 80, 255, 0.35);
      background: rgba(90, 50, 220, 0.10);
      color: rgba(200, 180, 255, 0.85);
    }

    #sb-vr-btn:hover {
      background: rgba(90, 50, 220, 0.22);
    }

    #sb-vr-btn.active {
      background: rgba(80, 40, 200, 0.3);
      border-color: rgba(150, 110, 255, 0.8);
    }

    #sb-vr-btn.unsupported {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Context / Scene Panel ──────────────────────────────────── */
    #ctx-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--glass-bg);
      border: 1px solid rgba(0, 204, 106, 0.18);
      border-radius: var(--radius-lg);
      backdrop-filter: var(--blur);
      color: var(--text);
      font-size: 12px;
      width: 340px;
      overflow: hidden;
      /* Use a JS-driven CSS variable so we can adapt height to content */
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: var(--ctx-max-height, 200px);
      user-select: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 204, 106, 0.06);
      z-index: 30;
    }

    #ctx-panel.collapsed {
      max-height: 46px;
      overflow: hidden;
    }

    #ctx-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      height: 44px;
      flex-shrink: 0;
      cursor: pointer;
      background: linear-gradient(90deg, rgba(0, 204, 106, 0.08) 0%, transparent 100%);
      border-bottom: 1px solid rgba(0, 204, 106, 0.10);
      gap: 8px;
      transition: background 0.2s;
    }

    #ctx-header:hover {
      background: linear-gradient(90deg, rgba(0, 204, 106, 0.15) 0%, rgba(0, 204, 106, 0.03) 100%);
    }

    #ctx-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #ctx-header-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, rgba(0, 204, 106, 0.25), rgba(0, 180, 90, 0.08));
      border: 1px solid rgba(0, 204, 106, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #ctx-header-text {
      font-size: 12px;
      font-weight: 600;
      color: #55ddaa;
      letter-spacing: 0.02em;
    }

    #ctx-collapse-btn {
      font-size: 18px;
      color: rgba(0, 204, 106, 0.7);
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
      padding: 2px 4px;
      line-height: 1;
    }

    #ctx-panel.collapsed #ctx-collapse-btn {
      transform: rotate(-90deg);
    }

    #ctx-body {
      padding: 12px 14px 14px;
    }

    .ctx-scan-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    #ctx-scan-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(0, 204, 106, 0.35);
      background: rgba(0, 204, 106, 0.08);
      color: #55ddaa;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
    }

    #ctx-scan-btn:hover {
      background: rgba(0, 204, 106, 0.16);
      border-color: rgba(0, 204, 106, 0.55);
    }

    #ctx-scan-btn.scanning {
      background: rgba(0, 204, 106, 0.22);
      border-color: rgba(0, 204, 106, 0.7);
      animation: scan-pulse 1.1s infinite;
    }

    @keyframes scan-pulse {

      0%,
      100% {
        box-shadow: 0 0 0 rgba(0, 204, 106, 0);
      }

      50% {
        box-shadow: 0 0 12px rgba(0, 204, 106, 0.4);
      }
    }

    #ctx-autoscan-btn {
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 160, 50, 0.3);
      background: rgba(255, 140, 30, 0.07);
      color: rgba(255, 200, 120, 0.85);
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      white-space: nowrap;
    }

    #ctx-autoscan-btn:hover {
      background: rgba(255, 140, 30, 0.16);
    }

    #ctx-autoscan-btn.active {
      background: rgba(255, 140, 30, 0.22);
      border-color: rgba(255, 180, 80, 0.65);
      color: #ffc864;
      animation: scan-pulse 1.3s infinite;
    }

    #ctx-status {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      min-height: 14px;
      letter-spacing: 0.02em;
      margin-top: 4px;
    }

    #ctx-status.scanning {
      color: var(--green);
    }

    #ctx-status.error {
      color: #ff6666;
    }

    /* Photo strip */
    #ctx-photos {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0 4px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 204, 106, 0.3) transparent;
      margin-top: 6px;
    }

    #ctx-photos:empty {
      display: none;
    }

    .ctx-photo-card {
      flex-shrink: 0;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;

    // ── Lighting ──

    function findJoints(root) {
      const joints = [];
      for (let i = 0; i < 6; i++) {
        let found = null;
        root.traverse((node) => {
          if (found) return;
          const n = node.name.toLowerCase();
          for (const pat of JOINT_PATTERNS[i]) {
            if (n === pat.toLowerCase() || n.startsWith(pat.toLowerCase())) { found = node; return; }
          }

        if (!found) {

      root.traverse((node) => { node.userData.restQ = node.quaternion.clone(); });

    function polishNedMaterials(root) {
      const maxAniso = renderer.capabilities.getMaxAnisotropy();
      root.traverse((node) => {
        if (!node.isMesh) return;
        node.castShadow = true; node.receiveShadow = true;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        mats.forEach((mat) => {
          if (!mat || !mat.isMeshStandardMaterial) return;
          if (mat.normalMap) mat.normalScale.set(0.65, 0.65);
          [mat.map, mat.normalMap, mat.roughnessMap, mat.metalnessMap, mat.aoMap].forEach((t) => {
            if (t) { t.anisotropy = maxAniso; t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true; }
          });
          const col = mat.color;
          // Detect teal/cyan robot body colour and upgrade to MeshPhysicalMaterial
          const isTeal = col.r < 0.5 && col.g > 0.4 && col.b > 0.5;
          const isDark = col.r < 0.15 && col.g < 0.15 && col.b < 0.15;
          if (isTeal || isDark) {
            node.material = new THREE.MeshPhysicalMaterial({
              color: mat.color, roughness: Math.min(mat.roughness ?? 0.5, 0.45),
              metalness: Math.max(mat.metalness ?? 0.1, 0.1),

    }

    // ── Logic d'initialisation 3D ──
    gltfLoader.load('ned.glb', (gltf) => {
      const nedModel = gltf.scene;
      polishNedMaterials(nedModel);

      const BASE_OFFSET = 0.095, MARGIN = 0.017, FORWARD_SHIFT = 0.05, OFFSET = BASE_OFFSET + MARGIN;

      // Robot 1
      const r1 = nedModel.clone();
      r1.position.set(TABLE_CX + 0.40 - OFFSET - FORWARD_SHIFT, 0, TABLE_CZ - 0.40 + OFFSET);
      r1.rotation.y = Math.PI;
      scene.add(r1); storeRestPose(r1); FK_ROBOTS.push({ root: r1, joints: findJoints(r1) });

      // Robot 2
      const r2 = nedModel.clone();
      r2.position.set(TABLE_CX + 0.40 - OFFSET - FORWARD_SHIFT, 0, TABLE_CZ + 0.40 - OFFSET);
      r2.rotation.y = Math.PI;
      scene.add(r2); storeRestPose(r2); FK_ROBOTS.push({ root: r2, joints: findJoints(r2) });

      buildFkSliders();

      FK_ANGLES.fill(0);
      for (let rIdx = 0; rIdx < FK_ROBOTS.length; rIdx++) { fkTarget = rIdx; applyFk(); }
      fkTarget = 0;

      // ── Build ghost for each FK robot ──
      FK_ROBOTS.forEach((fkR, idx) => {
        const ghost = fkR.root.clone();
        ghost.traverse(n => { n.userData.restQ = n.quaternion.clone(); });
        const ghostMat = new THREE.MeshStandardMaterial({
          color: IK_GHOST_COLORS[idx], transparent: true, opacity: 0.28,
          depthWrite: false, side: THREE.DoubleSide, roughness: 0.6, metalness: 0.1

        scene.add(ghost);
        const ghostJoints = findJoints(ghost);
        let ghostTip = null;
        ghost.traverse(n => { if (n.name === 'Tip' || n.name === 'tip' || n.name === 'hand_link') ghostTip = n; });
        if (!ghostTip) ghostTip = ghostJoints[5];
        IK_GHOSTS.push({ root: ghost, joints: ghostJoints, tip: ghostTip });
      });

      // ── IK handle spheres (visible target markers) ──
      const IK_HANDLE_GEO   = new THREE.SphereGeometry(0.020, 14, 14);
      const IK_HANDLE_OUTER = new THREE.SphereGeometry(0.034, 14, 14);
      FK_ROBOTS.forEach((fkR, idx) => {
        const group = new THREE.Group();
        group.add(new THREE.Mesh(IK_HANDLE_GEO,   new THREE.MeshBasicMaterial({ color: IK_GHOST_COLORS[idx], transparent: true, opacity: 0.9 })));
        group.add(new THREE.Mesh(IK_HANDLE_OUTER, new THREE.MeshBasicMaterial({ color: IK_GHOST_COLORS[idx], transparent: true, opacity: 0.15, depthWrite: false })));
        const tip = IK_GHOSTS[idx].tip;

        IK_TARGET_POS[idx].copy(group.position);
        group.visible = false;
        scene.add(group);

      // CORRECTION CRITIQUE DE SYNTAXE (Fermeture du load)
    }, undefined, (e) => {

    });

    // ── IK solver functions ───────────────────────────────────────────────
    function applyGhostFk(robotIdx) {
      const ghost = IK_GHOSTS[robotIdx]; if (!ghost) return;
      const angles = IK_ANGLES_R[robotIdx];
      for (let i = 0; i < 6; i++) {
        const joint = ghost.joints[i]; if (!joint) continue;
        const rad = angles[i] * Math.PI / 180;
        joint.quaternion.copy(joint.userData.restQ || new THREE.Quaternion())
          .multiply(new THREE.Quaternion().setFromAxisAngle(JOINT_AXES[i], rad));
      }
      ghost.root.updateWorldMatrix(true, true);
    }

    function solveLinear3(A, b) {
      const M = A.map(r => [...r]), x = [...b];
      for (let k = 0; k < 2; k++)
        for (let i = k + 1; i < 3; i++) {
          if (Math.abs(M[k][k]) < 1e-12) continue;
          const f = M[i][k] / M[k][k];
          for (let j = k; j < 3; j++) M[i][j] -= f * M[k][j];
          x[i] -= f * x[k];
        }
      const res = [0, 0, 0];
      for (let i = 2; i >= 0; i--) {
        let s = 0; for (let j = i + 1; j < 3; j++) s += M[i][j] * res[j];
        res[i] = Math.abs(M[i][i]) < 1e-12 ? 0 : (x[i] - s) / M[i][i];
      }
      return res;
    }

    window.solveIkStep = function (robotIdx) {
      const ghost = IK_GHOSTS[robotIdx], tip = ghost?.tip;
      if (!ghost || !tip || !IK_ENABLED[robotIdx]) return;
      const angles = IK_ANGLES_R[robotIdx], target = IK_TARGET_POS[robotIdx];
      const DELTA_RAD = IK_DELTA_DEG * Math.PI / 180;
      applyGhostFk(robotIdx);
      tip.getWorldPosition(_ee0);
      _posErr.subVectors(target, _ee0);
      if (_posErr.length() < IK_STOP_THRESH) return;
      for (let i = 0; i < 6; i++) {
        const saved = angles[i]; angles[i] += IK_DELTA_DEG;
        applyGhostFk(robotIdx); tip.getWorldPosition(_ee1);
        _J[0][i] = (_ee1.x - _ee0.x) / DELTA_RAD;
        _J[1][i] = (_ee1.y - _ee0.y) / DELTA_RAD;
        _J[2][i] = (_ee1.z - _ee0.z) / DELTA_RAD;

      applyGhostFk(robotIdx);

      const x = solveLinear3(JJT, [_posErr.x, _posErr.y, _posErr.z]);
      for (let i = 0; i < 6; i++) {
        let dang = 0; for (let j = 0; j < 3; j++) dang += _J[j][i]*x[j];
        dang *= IK_LEARNING_RATE * 180 / Math.PI;
        angles[i] = Math.max(JOINT_LIMITS[i][0], Math.min(JOINT_LIMITS[i][1], angles[i]+dang));
      }
      applyGhostFk(robotIdx);
    };

    window._ikSendContinuous = function (robotIdx) {
      if (!IK_ENABLED[robotIdx]) return;

      _ikLastSendMs[robotIdx] = now;
      const angles = IK_ANGLES_R[robotIdx];

    };

    // ── Activate IK for a robot (e.g. called from VR) ────────────────────
    window.enableIk = function (robotIdx) {

    const boardMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.30, 0.189), boardMat);
    boardMesh.rotation.x = -Math.PI / 2; boardMesh.position.set(0, 0.002, 0); scene.add(boardMesh);

    const axesHelper = new THREE.AxesHelper(0.10); axesHelper.position.y = 0.005; scene.add(axesHelper);

    window._guidesVisible = false; boardMesh.visible = false; axesHelper.visible = false;

    window.toggleCalibrationPlane = function () {
      window._guidesVisible = !window._guidesVisible;

      if (lbl) lbl.textContent = window._guidesVisible ? '\u00a0Hide Target' : '\u00a0Show Target';

    // ── Object group ──

    // ── Camera Cone ──
    let camCone = null, camFrustumLines = null, camVideoPlane = null, camVideoTexture = null;
    let _camImage = new Image(), _camImageLoading = false;

    function buildCameraViz(tx, ty, tz, poseObj) {
      try {
        if (camCone) { scene.remove(camCone); camCone.geometry.dispose(); camCone.material.dispose(); }
        if (camFrustumLines) { scene.remove(camFrustumLines); camFrustumLines.geometry.dispose(); camFrustumLines.material.dispose(); }
        if (camVideoPlane) { scene.remove(camVideoPlane); camVideoPlane.geometry.dispose(); camVideoPlane.material.dispose(); camVideoPlane = null; }

        const coneGeo = new THREE.ConeGeometry(0.06, 0.14, 4, 1, false, Math.PI / 4);
        coneGeo.translate(0, -0.07, 0); coneGeo.rotateX(Math.PI / 2);

        camCone = new THREE.Mesh(coneGeo, new THREE.MeshStandardMaterial({ color: 0xffc300, emissive: 0xffc300, emissiveIntensity: 0.12, roughness: 0.4 }));
        const camX = tx || 0, camY = Math.max(0.05, Math.abs(tz || 0)), camZ = -(ty || 0);
        camCone.position.set(camX, camY, camZ);

        if (poseObj && poseObj.Rx !== undefined) {
          const ax = poseObj.Rx || 0, ay = poseObj.Ry || 0, az = poseObj.Rz || 0;
          const angle = Math.sqrt(ax * ax + ay * ay + az * az);
          const qCv = new THREE.Quaternion();
          if (angle > 0.0001) qCv.setFromAxisAngle(new THREE.Vector3(ax / angle, ay / angle, az / angle), -angle);

          const qWorld = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
          const qRot180 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI);
          const qFinal = new THREE.Quaternion().copy(qWorld).multiply(qCv).multiply(qRot180);

          camCone.quaternion.copy(qFinal);
          camCone.castShadow = false; camCone.visible = window._guidesVisible !== false; scene.add(camCone);

          const apex = new THREE.Vector3(camX, camY, camZ);
          const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(qFinal), trueUp = new THREE.Vector3(0, -1, 0).applyQuaternion(qFinal), right = new THREE.Vector3(1, 0, 0).applyQuaternion(qFinal);

          let dist = 2.0; if (forward.y < -0.05) dist = Math.abs(camY / forward.y);

          const aspect = (camVideoTexture?.image?.width > 0) ? (camVideoTexture.image.width / camVideoTexture.image.height) : (16 / 9);
          const fovScale = window.currentFovScale !== undefined ? window.currentFovScale : 0.45;
          const halfH = dist * fovScale, halfW = halfH * aspect;
          const centerFocus = apex.clone().addScaledVector(forward, dist);

          function getIntercept(point) {
            const ray = point.clone().sub(apex);
            if (ray.y >= -0.001) return apex.clone().add(ray.normalize().multiplyScalar(15));
            return apex.clone().add(ray.multiplyScalar((0.002 - apex.y) / ray.y));
          }

          const corners = [
            getIntercept(centerFocus.clone().addScaledVector(right, -halfW).addScaledVector(trueUp, halfH)),
            getIntercept(centerFocus.clone().addScaledVector(right, halfW).addScaledVector(trueUp, halfH)),
            getIntercept(centerFocus.clone().addScaledVector(right, halfW).addScaledVector(trueUp, -halfH)),
            getIntercept(centerFocus.clone().addScaledVector(right, -halfW).addScaledVector(trueUp, -halfH))
          ];

          if (camVideoTexture) {
            const rectGeo = new THREE.PlaneGeometry(1, 1, 32, 32);
            const posAttr = rectGeo.attributes.position, uvAttr = rectGeo.attributes.uv;

            for (let i = 0; i < posAttr.count; i++) {
              const u = uvAttr.getX(i), v = uvAttr.getY(i);
              const wX = ((1.0 - u) - 0.5) * 2.0 * halfW, wY = ((1.0 - v) - 0.5) * 2.0 * halfH;
              posAttr.setXYZ(i, ...getIntercept(centerFocus.clone().addScaledVector(right, wX).addScaledVector(trueUp, wY)).toArray());
            }
            rectGeo.computeVertexNormals();
            camVideoPlane = new THREE.Mesh(rectGeo, new THREE.MeshBasicMaterial({ map: camVideoTexture, side: THREE.DoubleSide, transparent: true, opacity: window.currentCamOpacity !== undefined ? window.currentCamOpacity : 0.85 }));
            scene.add(camVideoPlane);
          }

          const lines = []; corners.forEach(c => { lines.push(apex); lines.push(c); });
          for (let i = 0; i < 4; i++) { lines.push(corners[i]); lines.push(corners[(i + 1) % 4]); }

          camFrustumLines = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lines), new THREE.LineBasicMaterial({ color: 0xffc300, opacity: 0.45, transparent: true }));
          camFrustumLines.visible = window._guidesVisible !== false; scene.add(camFrustumLines);
        }
      } catch (err) { console.error('[setCameraPose error]', err); }
    }

    function colorFromLabel(label) {
      if (!label) return 0xffffff;
      const map = { red: 0xff3333, blue: 0x3366ff, green: 0x33cc66, yellow: 0xffdd00, orange: 0xff7700, purple: 0xaa44ff, pink: 0xff66aa, white: 0xeeeeff, black: 0x222233, grey: 0x778899, brown: 0xaa6633, cyan: 0x00ddff, magenta: 0xff00aa };
      const lo = label.toLowerCase();
      for (const [k, v] of Object.entries(map)) if (lo.includes(k)) return v;
      let h = 0; for (const c of label) h = (c.charCodeAt(0) + ((h << 5) - h)) | 0;
      return Math.abs(h) % 0xffffff;
    }

    // ── Draggable panels ──────────────────────────────────────────────────
    const PANEL_POS_KEY = 'scene3d_panel_pos';

    function savePanelPositions() {
      const data = {};
      ['hud', 'fk-panel', 'voice-panel', 'ctx-panel'].forEach(id => {
        const el = document.getElementById(id);
        if (el) data[id] = { left: el.style.left, top: el.style.top, right: el.style.right, bottom: el.style.bottom, width: el.style.width, height: el.classList.contains('collapsed') ? '' : el.style.height };
      });
      localStorage.setItem(PANEL_POS_KEY, JSON.stringify(data));
    }

    function restorePanelPositions() {
      try {
        const data = JSON.parse(localStorage.getItem(PANEL_POS_KEY));
        if (!data) return;
        ['hud', 'fk-panel', 'voice-panel', 'ctx-panel'].forEach(id => {
          const el = document.getElementById(id), d = data[id];
          if (!el || !d) return;
          if (d.left) { el.style.left = d.left; el.style.transform = 'none'; el.style.right = ''; el.style.bottom = d.bottom || ''; }
          if (d.top) el.style.top = d.top;
          if (d.width && id !== 'hud') el.style.width = d.width;
          if (d.height && id !== 'hud' && parseInt(d.height) > 100) el.style.height = d.height;
        });
      } catch (_) { }
    }

    function makeDraggable(panel, handle) {
      if (!panel || !handle) return;
      let startX = 0, startY = 0, startLeft = 0, startTop = 0, dragging = false, hasMoved = false;

      function getXY(e) { return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }

      function onStart(e) {
        if (e.target.closest('button,input,select,a')) return;
        e.preventDefault(); dragging = true; hasMoved = false;
        const rect = panel.getBoundingClientRect(); startLeft = rect.left; startTop = rect.top;
        panel.style.right = ''; panel.style.bottom = '';
        const currentWidth = panel.offsetWidth, currentHeight = panel.offsetHeight;
        panel.style.transform = 'none'; panel.style.left = startLeft + 'px'; panel.style.top = startTop + 'px'; panel.style.width = currentWidth + 'px';

    function clearObjects() {
      while (objGroup.children.length > 0) {

    function renderObjects(items) {
      clearObjects();

      if (noObjEl) noObjEl.style.display = items.length ? 'none' : 'block';
      if (countEl) countEl.textContent = items.length;

      items.forEach(item => {
        const raw = colorFromLabel(item.label), col = new THREE.Color(raw);
        const px = item.worldX || 0, pz = -(item.worldY || 0);
        const bw = Math.max(0.025, Math.min(0.35, item.sizeW || 0.1)), bd = Math.max(0.025, Math.min(0.35, item.sizeH || 0.1));

        function makeTextSprite(message, color) {
          const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
          canvas.width = 512; canvas.height = 128; ctx.fillStyle = '#' + color.getHexString(); ctx.font = 'bold 48px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(message, 256, 64);
          const texture = new THREE.CanvasTexture(canvas); texture.minFilter = THREE.LinearFilter;
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false })); sprite.scale.set(0.15, 0.0375, 1); return sprite;
        }

        const labelSprite = makeTextSprite(item.label, col);

        function addSphere() {
          const radius = Math.min(bw, bd) / 2.5;
          const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 16), new THREE.MeshStandardMaterial({ color: col, roughness: 0.35, metalness: 0.15, emissive: col, emissiveIntensity: 0.08 }));
          mesh.castShadow = true; mesh.receiveShadow = true; mesh.position.set(px, radius, pz);
          if (item.angleRad !== undefined) mesh.rotation.y = -item.angleRad;
          mesh.add(new THREE.AxesHelper(0.08)); objGroup.add(mesh);
          labelSprite.position.set(px, radius * 2 + 0.03, pz); objGroup.add(labelSprite);
        }

        if (item.modelUrl && item.modelUrl.trim() !== '') {
          const resolvedUrl = (item.modelUrlRemote && item.modelUrlRemote.trim() !== '') ? item.modelUrlRemote : item.modelUrl;

          gltfLoader.load(resolvedUrl, (gltf) => {
            const rawModel = gltf.scene;
            rawModel.traverse((node) => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; } });

            // ── 1. PIVOT CORRECTION — centre X/Z, bottom sits exactly on Y=0 ──
            const box0 = new THREE.Box3().setFromObject(rawModel);
            const center0 = new THREE.Vector3(); box0.getCenter(center0);
            rawModel.position.set(-center0.x, -box0.min.y, -center0.z);

            // ── 2. AI CORRECTION OFFSETS — compensate for Tripo's imperfect orientation ──
            const correctionGroup = new THREE.Group();
            correctionGroup.add(rawModel);
            if (item.offsetRx) correctionGroup.rotation.x = item.offsetRx;
            if (item.offsetRy) correctionGroup.rotation.y = item.offsetRy;
            if (item.offsetRz) correctionGroup.rotation.z = item.offsetRz;

            // ── 3. SCALE — computed AFTER corrections so the bounding box is accurate ──
            const scaleGroup = new THREE.Group();
            scaleGroup.add(correctionGroup);

            const correctedBox = new THREE.Box3().setFromObject(scaleGroup);
            const modelW = correctedBox.max.x - correctedBox.min.x;
            const modelD = correctedBox.max.z - correctedBox.min.z;
            const maxDim  = Math.max(modelW, modelD, 0.0001);
            const targetW = Math.max(0.01, item.sizeW || 0.05);
            let scaleFactor = targetW / maxDim;
            if (item.offsetScale && item.offsetScale !== 1.0) scaleFactor *= item.offsetScale;
            scaleGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);

            // ── 4. WORLD PLACEMENT — position + Yaw from Gemini angle estimation ──
            const worldGroup = new THREE.Group();
            worldGroup.add(scaleGroup);
            worldGroup.position.set(px, 0, pz);

            worldGroup.add(new THREE.AxesHelper(0.08 / scaleFactor));
            objGroup.add(worldGroup);

            // Label above the final bounding box top
            const finalBox = new THREE.Box3().setFromObject(worldGroup);

            objGroup.add(labelSprite);

          }, undefined, () => addSphere());

        if (legendEl) {

        }

    // ──────────────────────────────────────────────────────────────────────
    let _xrSession = null, _xrMode = null, _savedBg = null, _savedFog = null;

    // Controllers + grips (live under the XR camera group — never moved by scene)
    const _xrCtrls = [renderer.xr.getController(0), renderer.xr.getController(1)];
    const _xrGrips = [renderer.xr.getControllerGrip(0), renderer.xr.getControllerGrip(1)];

    _xrGrips[1].add(_ctrlModelFactory.createControllerModel(_xrGrips[1]));

    // ── Hand tracking: OculusHandModel + OculusHandPointerModel ───────────
    const _xrHands  = [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    const _handPtrs = []; // OculusHandPointerModel instances
    _xrHands.forEach((hand, i) => {
      hand.add(new OculusHandModel(hand));
      const ptr = new OculusHandPointerModel(hand, _xrCtrls[i]);
      hand.add(ptr);
      _handPtrs.push(ptr);

    // ── Two-grip translate + rotate (squeeze both grips) ─────────────────
    const _gripState = [false, false];
    let   _grabbing  = false;
    const _grabMid   = new THREE.Vector3();

    });

    function tickWorldGrab() {

      _g0.setFromMatrixPosition(_xrGrips[0].matrixWorld);
      _g1.setFromMatrixPosition(_xrGrips[1].matrixWorld);
      const mid = _g0.clone().add(_g1).multiplyScalar(0.5);
      const delta = mid.clone().sub(_grabMid); delta.y = 0;
      const fwdNow = _g1.clone().sub(_g0).setY(0).normalize();
      const angleNow = Math.atan2(fwdNow.x, fwdNow.z);
      scene.position.copy(_grabScenePos).add(delta);
      scene.rotation.y = (scene.rotation.y || 0) + (angleNow - _grabAngleBase) * 0.15;
      _grabMid.copy(mid);
      _grabAngleBase = angleNow;
    }

    function saveAnchorPosition() {
      const { x, y, z } = scene.position, ry = scene.rotation.y;
      localStorage.setItem(ANCHOR_KEY, JSON.stringify({ x, y, z, ry }));
    }

    async function restoreAnchorPosition() {
      try {
        const s = JSON.parse(localStorage.getItem(ANCHOR_KEY));
        if (s) { scene.position.set(s.x ?? 0, s.y ?? 0, s.z ?? -0.8); scene.rotation.y = s.ry ?? 0; return; }
      } catch (_) { }
      scene.position.set(0, 0, -0.8); scene.rotation.y = 0;
    }

    // ── VR Pinch IK Dragging (OculusHandPointerModel pattern) ────────────
    // Pinch on an IK handle sphere → it attaches to pointer → follows hand.
    // Mirrors the three.js point-and-drag example DraggableSystem.
    const _ikDragState = []; // populated once IK_HANDLES are built

    function ensureIkDragStates() {
      while (_ikDragState.length < IK_HANDLES.length)
        _ikDragState.push({ state: 'detached', attachedPointer: null, originalParent: null });
    }

    function tickVrIk() {
      if (!_xrSession) return;
      // Update hand pointer rays every frame (required by OculusHandPointerModel)
      _handPtrs.forEach(hp => hp.update());
      if (_handPtrs.length === 0) return;
      ensureIkDragStates();

      _handPtrs.forEach(hp => {
        let closestIdx = -1, closestDist = Infinity;
        IK_HANDLES.forEach((handle, idx) => {
          const hits = hp.intersectObject(handle, true);
          if (hits && hits.length > 0 && hits[0].distance < closestDist) {
            closestDist = hits[0].distance; closestIdx = idx;
          }
        });

        if (closestIdx >= 0) {
          hp.setCursor(closestDist);
          const drag = _ikDragState[closestIdx];
          IK_HANDLES[closestIdx].scale.setScalar(1.2); // hover scale

          if (hp.isPinched()) {
            if (!hp.isAttached() && drag.state !== 'attached') {
              if (!IK_ENABLED[closestIdx]) window.enableIk(closestIdx);
              drag.originalParent = IK_HANDLES[closestIdx].parent;
              drag.state = 'to-be-attached';
              drag.attachedPointer = hp;
              hp.setAttached(true);
            }
          } else {
            if (hp.isAttached() && drag.state === 'attached') {
              drag.state = 'to-be-detached';
              drag.attachedPointer = null;
              hp.setAttached(false);
            }
          }
        } else {
          hp.setCursor(1.5);
        }
      });

      // State transitions (same pattern as DraggableSystem in the example)
      IK_HANDLES.forEach((handle, idx) => {
        const drag = _ikDragState[idx];
        switch (drag.state) {
          case 'to-be-attached':
            drag.attachedPointer.children[0].attach(handle);
            drag.state = 'attached';
            break;
          case 'to-be-detached':
            if (drag.originalParent) drag.originalParent.attach(handle);
            IK_TARGET_POS[idx].copy(handle.position);
            drag.state = 'detached';
            break;
          case 'attached': {
            const worldPos = handle.getWorldPosition(new THREE.Vector3());
            IK_TARGET_POS[idx].copy(scene.worldToLocal(worldPos.clone()));
            break;
          }
          default:
            handle.scale.setScalar(1.0); // reset hover scale
        }
      });
    }

    function showXrToast(msg, ms) {
      const t = document.getElementById('xr-toast'); if (!t) return;
      t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), ms || 6000);
    }

    window.toggleVR = async function () {
      if (_xrSession) { await _xrSession.end(); return; }
      if (!window.isSecureContext) { showXrToast('WebXR needs HTTPS.'); return; }
      if (!navigator.xr) { showXrToast('navigator.xr not available.'); return; }

      const arOk = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      const vrOk = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
      if (!arOk && !vrOk) { showXrToast('Neither AR nor VR is supported on this device.'); return; }
      _xrMode = arOk ? 'immersive-ar' : 'immersive-vr';

      try {
        const session = await navigator.xr.requestSession(_xrMode, {
          optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'anchors'],
        });
        _xrSession = session;

        const btn   = document.getElementById('sb-vr-btn');
        const icon  = document.getElementById('sb-vr-icon');
        const lbl   = document.getElementById('sb-vr-label');
        if (btn) btn.classList.add('active');
        if (icon) icon.textContent = '⏹️';
        if (lbl)  lbl.textContent  = arOk ? '\u00a0Exit MR' : '\u00a0Exit VR';

        // Save & clear background for MR passthrough
        _savedBg = scene.background; _savedFog = scene.fog;
        if (_xrMode === 'immersive-ar') { scene.background = null; scene.fog = null; renderer.setClearColor(0x000000, 0); }

        // Perf: disable shadows + expensive tone-mapping while in XR
        renderer.shadowMap.enabled = false;
        renderer.toneMapping = THREE.NoToneMapping;
        scene.scale.setScalar(1);
        renderer.xr.setFramebufferScaleFactor(1.0);
        await renderer.xr.setSession(session);
        renderer.xr.setReferenceSpaceType('local-floor');

        // Place scene 1 m in front of user, at floor level
        await restoreAnchorPosition();

        session.addEventListener('end', () => {
          _xrSession = null;
          // Restore perf-critical settings
          renderer.shadowMap.enabled = true;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          scene.background = _savedBg; scene.fog = _savedFog;
          scene.position.set(0, 0, 0); scene.rotation.y = 0; scene.scale.setScalar(1);
          renderer.setClearColor(0x000000, 1);
          _gripState[0] = _gripState[1] = false; _grabbing = false;
          if (btn)  btn.classList.remove('active');
          if (icon) icon.textContent = '🥽';
          if (lbl)  lbl.textContent  = arOk ? '\u00a0Enter MR' : '\u00a0Enter VR';
        });
      } catch (err) { showXrToast('XR failed: ' + (err.message || err)); }
    };

    (async () => {
      const btn = document.getElementById('sb-vr-btn'), lbl = document.getElementById('sb-vr-label');
      if (!navigator.xr) { if (btn) { btn.classList.add('unsupported'); btn.title = 'WebXR not available'; } return; }
      const arOk = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      const vrOk = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
      if (!arOk && !vrOk && btn) { btn.classList.add('unsupported'); btn.title = 'XR not supported — HTTPS required?'; }
      else if (lbl) lbl.textContent = arOk ? '\u00a0Enter MR' : '\u00a0Enter VR';
    })();

    // ── Render loop ──
    let _xrFrameCount = 0;
    renderer.setAnimationLoop(() => {
      if (_xrSession) renderer.xr.updateCamera(camera);
      tickWorldGrab();
      tickVrIk();
      for (let i = 0; i < 2; i++) {
        if (IK_ENABLED[i]) {
          if (window.solveIkStep)       window.solveIkStep(i);
          if (window._ikSendContinuous) window._ikSendContinuous(i);
        }
      }
      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Remote WebSocket client ──────────────
    (function initRemoteWS() {
      const badge = document.getElementById('ws-badge'), label = document.getElementById('ws-label');
      const isRemote = location.hostname !== 'app.local' && location.hostname !== '';
      if (!isRemote) { if (badge) badge.style.display = 'none'; return; }

      let retryDelay = 1500, ws = null;

      async function serverReachable() { try { const r = await fetch(`${location.origin}/ping`, { signal: AbortSignal.timeout(3000) }); return r.ok; } catch { return false; } }

      async function connect() {
        if (label) label.textContent = 'Checking…'; if (badge) badge.classList.remove('live', 'error');

        const reachable = await serverReachable();
        if (!reachable) {
          if (label) label.textContent = 'Hub offline'; if (badge) badge.classList.add('error');
          setTimeout(connect, Math.min(retryDelay * 2, 15000)); retryDelay = Math.min(retryDelay * 1.5, 15000); return;
        }

        const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${wsProto}://${location.host}/scene3d-ws`); window._remoteWs = ws;

        ws.onopen = () => { retryDelay = 1500; if (badge) badge.classList.add('live'); if (label) label.textContent = 'Live'; };

        ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            switch (msg.type) {
              case 'setCameraPose': if (window.setCameraPose) window.setCameraPose(JSON.stringify(msg.payload)); break;
              case 'setDetectedObjects': if (window.setDetectedObjects) window.setDetectedObjects(JSON.stringify(msg.payload)); break;
              case 'updateCameraFeed': if (window.updateCameraFeed) window.updateCameraFeed(msg.payload); break;
              case 'setGen3DProgress': {
                // Live progress update for a 3D generation (Banana → Tripo pipeline)
                if (window.setGen3DProgress) window.setGen3DProgress(JSON.stringify(msg.payload));
                break;
              }
              case 'setModelGlb': {
                // GLB ready — update badge + load model into scene
                const { label, glbUrl } = msg.payload;
                // Make URL absolute using the WS host
                const absUrl = glbUrl.startsWith('http') ? glbUrl : `${location.protocol}//${location.host}${glbUrl}`;
                if (window.setModelGlb) window.setModelGlb(JSON.stringify({ label, glbUrl: absUrl }));
                break;
              }
              case 'setBananaImage': {
                // Show the Banana-enhanced image thumbnail in the ctx strip
                const { label: lbl, imageUrl } = msg.payload;
                const absImgUrl = imageUrl.startsWith('http') ? imageUrl : `${location.protocol}//${location.host}${imageUrl}`;
                document.querySelectorAll('.ctx-photo-card').forEach(card => {
                  if (card.querySelector('.ctx-photo-label')?.textContent === lbl) {
                    const img = card.querySelector('img');
                    if (img) { img.src = absImgUrl; img.title = '🍌 Banana enhanced'; }
                  }
                });
                break;
              }
              case 'refreshLibrary': {
                // Re-request the library list from the server so the asset table updates
                if (window.loadLibrary) window.loadLibrary();
                break;
              }
              case 'setRobotJoints': {
                const { angles, robotIdx } = msg.payload;
                if (Array.isArray(angles) && window.setRobotJoints) {
                  window.setRobotJoints(JSON.stringify(angles), robotIdx ?? 0);
                  const panel = document.getElementById('fk-panel');
                  if (panel && panel.classList.contains('collapsed') && angles.some(a => Math.abs(a) > 0.5)) panel.classList.remove('collapsed');
                }
                break;
              }
              case 'voiceTranscription': {
                const text = typeof msg.payload === 'string' ? msg.payload : JSON.stringify(msg.payload);
                const voiceOut = document.getElementById('voice-output'), voiceStatus = document.getElementById('voice-status');
                const alreadyComplete = voiceStatus && voiceStatus.textContent === 'Transcription complete';
                if (voiceOut && !alreadyComplete) { voiceOut.textContent = text; voiceOut.classList.add('has-text'); }
                if (voiceStatus && !alreadyComplete) { voiceStatus.textContent = 'Transcription received'; voiceStatus.className = 'success'; }
                document.getElementById('voice-panel')?.classList.remove('collapsed');
                break;
              }

            }
          } catch (e) { console.warn('WS parse error', e); }
        };

        ws.onerror = () => { if (badge) badge.classList.remove('live', 'error'); if (badge) badge.classList.add('error'); if (label) label.textContent = 'Error'; };
        ws.onclose = () => { if (badge) badge.classList.remove('live'); if (label) label.textContent = 'Reconnecting…'; setTimeout(connect, retryDelay); retryDelay = Math.min(retryDelay * 1.5, 15000); };
      }
      connect();
    })();

    // ── Voice-to-Text Panel ───────────────────────────────────────────────────
    (function initVoicePanel() {
      let _mediaRecorder = null, _audioChunks = [], _isRecording = false;
      const pttBtn = document.getElementById('ptt-btn'), pttLabel = document.getElementById('ptt-label'), voiceOutput = document.getElementById('voice-output'), voiceStatus = document.getElementById('voice-status');

      window.toggleVoicePanel = function () {
        const p = document.getElementById('voice-panel'); if (p && p.dataset.dragged !== 'true') p.classList.toggle('collapsed');
      };

      window.startHoldRecord = async function (e) { if (e) e.preventDefault(); if (_isRecording) return; await startRecording(); };
      window.stopHoldRecord = function (e) { if (e) e.preventDefault(); if (!_isRecording) return; stopRecording(); };

      async function startRecording() {
        try {
          const micSelect = document.getElementById('mic-select'), deviceId = micSelect ? micSelect.value : '';
          const stream = await navigator.mediaDevices.getUserMedia({ audio: deviceId ? { deviceId: { exact: deviceId } } : true, video: false });
          const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
          _mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
          _audioChunks = []; _isRecording = true;
          _mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) _audioChunks.push(e.data); };
          _mediaRecorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); uploadAudio(); };
          _mediaRecorder.start();
          pttBtn.classList.add('recording'); pttLabel.textContent = 'Release to send…'; setStatus('Recording â€” release to send', '');
        } catch (err) { setStatus('Microphone access denied: ' + err.message, 'error'); _isRecording = false; }
      }

      function stopRecording() {
        if (_mediaRecorder && _mediaRecorder.state !== 'inactive') _mediaRecorder.stop();
        _isRecording = false; pttBtn.classList.remove('recording'); pttBtn.classList.add('loading'); pttLabel.textContent = 'Processing…'; setStatus('Sending to Whisper…', '');
      }

      async function uploadAudio() {
        if (_audioChunks.length === 0) { resetBtn(); setStatus('No audio captured.', 'error'); return; }
        const blob = new Blob(_audioChunks, { type: _mediaRecorder.mimeType || 'audio/webm' }), formData = new FormData(); formData.append('file', blob, 'voice.webm');
        const baseUrl = (location.hostname === 'app.local' || location.hostname === '') ? 'http://localhost:8181' : `${location.protocol}//${location.host}`;
        try {
          const resp = await fetch(`${baseUrl}/transcribe`, { method: 'POST', body: formData });
          if (!resp.ok) {
            const raw = await resp.text();
            // Strip HTML tags so a Cloudflare error page doesn't flood the UI
            const plain = raw.replace(/<[^>]+>/g, ' ').replace(/\s{2,}/g, ' ').trim().slice(0, 120);
            setStatus(`Error ${resp.status}${plain ? ': ' + plain : ''}`, 'error');
          }
          else {
            const data = await resp.json(), text = data.text || '';
            if (text.trim()) { voiceOutput.textContent = text.trim(); voiceOutput.classList.add('has-text'); setStatus('Transcription complete', 'success'); if (window.sendCommandToHost) window.sendCommandToHost('voiceTranscription', text.trim()); }
            else { setStatus('No speech detected.', 'error'); }
          }
        } catch (err) { setStatus('Network error: ' + err.message, 'error'); } finally { resetBtn(); }
      }

      function setStatus(msg, cls) { if (voiceStatus) { voiceStatus.textContent = msg; voiceStatus.className = cls ? `${cls}` : ''; } }
      function resetBtn() { pttBtn.classList.remove('loading', 'recording'); pttLabel.textContent = 'Hold to Record'; _isRecording = false; }

      setTimeout(async () => {
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true }); tempStream.getTracks().forEach(t => t.stop());
          const devices = await navigator.mediaDevices.enumerateDevices(), select = document.getElementById('mic-select');
          if (select) {
            select.innerHTML = '<option value="">Default Microphone</option>';
            devices.filter(d => d.kind === 'audioinput').forEach(device => {
              const option = document.createElement('option'); option.value = device.deviceId; option.text = device.label || `Microphone ${select.options.length}`; select.appendChild(option);
            });
            const intelOption = Array.from(select.options).find(o => o.text.toLowerCase().includes('intel')); if (intelOption) select.value = intelOption.value;
          }
        } catch (e) { console.error("Failed to list microphones", e); }
      }, 1000);
    })();
  </script>
