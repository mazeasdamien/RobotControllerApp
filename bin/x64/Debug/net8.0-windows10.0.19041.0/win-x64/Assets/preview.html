        // Clamp to joint limits and store per-robot
        const clamped = angles.map((a, i) => Math.max(JOINT_LIMITS[i][0], Math.min(JOINT_LIMITS[i][1], a ?? 0)));
        FK_ANGLES_R[robotIdx] = clamped;

        // Also keep IK ghost angles in sync so they start from the real pose
        if (IK_ANGLES_R[robotIdx]) IK_ANGLES_R[robotIdx] = [...clamped];

        // Apply to the 3D model for this robot directly (works for both robots)
        const robot = FK_ROBOTS[robotIdx];
        if (robot) {
          robot.joints.forEach((joint, i) => {
            if (!joint) return;
            joint.quaternion.copy(joint.userData.restQ);
            let renderAngle = clamped[i];
            if (i === 1) renderAngle -= 33;
            if (i === 2) renderAngle += 75;
            // Reuse pre-allocated scratch — no GC on every joint update
            _fkQuat.setFromAxisAngle(JOINT_AXES[i], THREE.MathUtils.degToRad(renderAngle));
            joint.quaternion.multiply(_fkQuat);
          });
        }

        // If this robot is selected in the panel, sync sliders too
        if (robotIdx === fkTarget) {
          for (let i = 0; i < 6; i++) FK_ANGLES[i] = clamped[i];
          syncSlidersFromAngles(clamped);
        }
      } catch (e) { console.warn('[setRobotJoints] parse error', e); }
    };


    // =========================================================================================
    // ── WebXR Mixed Reality (Safely Overlaid Without Breaking 2D Logic) ──────────────────────
    // =========================================================================================
    let _xrSession = null, _xrMode = null, _savedBg = null, _savedFog = null;

    // Attach controllers securely to the XR Rig so the player can be translated safely
    const _xrCtrls = [renderer.xr.getController(0), renderer.xr.getController(1)];
    const _xrGrips = [renderer.xr.getControllerGrip(0), renderer.xr.getControllerGrip(1)];
    xrRig.add(_xrCtrls[0], _xrCtrls[1], _xrGrips[0], _xrGrips[1]);

    const _ctrlModelFactory = new XRControllerModelFactory();
    _xrGrips[0].add(_ctrlModelFactory.createControllerModel(_xrGrips[0]));
    _xrGrips[1].add(_ctrlModelFactory.createControllerModel(_xrGrips[1]));

    // Controller ray pointer lines (visual targeting beam)
    const _rayGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)
    ]);
    const _rayMat = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.6, transparent: true });

    // VR FIX: Adding laser pointer trigger-dragging logic
    const _raycaster = new THREE.Raycaster();
    const _tempMatrix = new THREE.Matrix4();
    const _ctrlState = [{ attached: null, dist: 0 }, { attached: null, dist: 0 }];

    function onSelectStart(event) {
      const ctrl = event.target, idx = _xrCtrls.indexOf(ctrl);
      _tempMatrix.identity().extractRotation(ctrl.matrixWorld);
      _raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
      _raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_tempMatrix);

      // Prevent IK grabbing if pointing at the VR UI panel
      if (window._vrPanelGroup && _raycaster.intersectObjects(window._vrPanelGroup.children, true).length > 0) return;

      const hits = _raycaster.intersectObjects(IK_HANDLES, true);
      if (hits.length > 0) {
        let handle = hits[0].object;
        while (handle.parent && !IK_HANDLES.includes(handle)) handle = handle.parent;
        if (IK_HANDLES.includes(handle)) {
          const handleIdx = IK_HANDLES.indexOf(handle);
          if (!IK_ENABLED[handleIdx]) window.enableIk(handleIdx);
          _ctrlState[idx].attached = handle;
          _ctrlState[idx].dist = hits[0].distance;
          const r = ctrl.children.find(c => c.name === 'ctrl-ray');
          if (r) r.material.color.setHex(0x00ff00);
        }
      }
    }

    function onSelectEnd(event) {
      const ctrl = event.target, idx = _xrCtrls.indexOf(ctrl);
      if (_ctrlState[idx].attached) {
        const handleIdx = IK_HANDLES.indexOf(_ctrlState[idx].attached);
        // Correctly save local scene coordinates on release
        IK_TARGET_POS[handleIdx].copy(scene.worldToLocal(_ctrlState[idx].attached.getWorldPosition(new THREE.Vector3())));
        _ctrlState[idx].attached = null;
        const r = ctrl.children.find(c => c.name === 'ctrl-ray');
        if (r) r.material.color.setHex(0xffffff);
      }
    }

    _xrCtrls.forEach(ctrl => {
      const ray = new THREE.Line(_rayGeo, _rayMat.clone());
      ray.name = 'ctrl-ray'; ray.scale.z = 5;
      ctrl.add(ray);
      ctrl.addEventListener('selectstart', onSelectStart);
      ctrl.addEventListener('selectend', onSelectEnd);
    });

    // ── VR floating HTMLMesh panels – one per DOM panel ─────────
    // Each panel is independently grabbable with a single grip button.
    // Data tracked per VR panel:
    //   { domId, group (InteractiveGroup), mesh (HTMLMesh), grabbed: false, grabCtrl: null, grabOffset: Vector3 }
    const _vrPanels = [];
    window._vrPanelGroup = null; // kept for compat (points to first group)
    window._vrPanelMesh  = null; // kept for compat
    // Legacy gui null (lil-gui removed)
    let _vrGui = null;
    let _vrCtxStatusCtrl = null;
    let _vrVoiceStatusCtrl = null;

    // ── HTMLMesh dirty-flag via MutationObserver ──────────────────────────
    // Instead of re-uploading panel textures every N frames regardless,
    // we watch the actual DOM for changes and only mark dirty when content
    // truly mutates. Cost on a static frame = 0 GPU uploads.
    let _vrPanelsDirty = true; // start true so first VR frame renders correctly
    let _vrMutObs = null;

    function _startVrPanelObserver() {
      if (_vrMutObs) return;
      // ctx-panel covers orient content since it is integrated there.
      // vr-action-bar watched for feed/leave button active-state class changes.
      const watched = ['ctx-panel', 'voice-panel', 'vr-action-bar'];
      _vrMutObs = new MutationObserver(() => { _vrPanelsDirty = true; });
      watched.forEach(id => {
        const el = document.getElementById(id);
        if (el) _vrMutObs.observe(el, { subtree: true, childList: true, characterData: true, attributes: true });
      });
    }

    function _stopVrPanelObserver() {
      if (_vrMutObs) { _vrMutObs.disconnect(); _vrMutObs = null; }
      _vrPanelsDirty = true; // reset so next VR session starts fresh
    }

    // Config: which panels to show in VR and where to spawn them.
    // fk-panel retired → replaced by top-bar (2D) / vr-action-bar (VR 3D mesh).
    const VR_PANEL_CFG = [
      { domId: 'ctx-panel',      pos: [-0.30, 1.35, -0.65], rotY:  Math.PI / 16, scale: 0.82 },
      { domId: 'voice-panel',    pos: [ 0.40, 1.45, -0.60], rotY: -Math.PI / 8,  scale: 0.82 },
      { domId: 'vr-action-bar',  pos: [ 0.05, 1.05, -0.55], rotY:  0,            scale: 0.70 },
    ];

    function buildVrPanel() {
      if (_vrPanels.length > 0) return;
      document.body.classList.add('vr-mode');

      // CRITICAL: Force synchronous layout reflow so HTMLMesh gets the correct 
      // width/height bounds for drawing textures and UI hit-testing.
      // Failing to do this causes hit tests to miss and UI canvas to clip.
      void document.body.offsetHeight;
      _vrPanelsDirty = true; // ensure first frame uploads
      _startVrPanelObserver();

      VR_PANEL_CFG.forEach((cfg) => {
        const domEl = document.getElementById(cfg.domId);
        if (!domEl) return;

        // Keep the panel visible so an external 2D observer (second screen / mirror)
        // can read all state changes in real time. We let it keep pointer events
        // so HTMLMesh event dispatching doesn't fail internally in the browser.
        domEl.dataset.vrHidden = '1';

        // Ensure it isn't collapsed so the mesh looks full
        domEl.classList.remove('collapsed');

        const group = new InteractiveGroup();
        group.listenToPointerEvents(renderer, camera);
        group.listenToXRControllerEvents(_xrCtrls[0]);
        group.listenToXRControllerEvents(_xrCtrls[1]);
        xrRig.add(group);

        const mesh = new HTMLMesh(domEl);
        mesh.position.set(...cfg.pos);
        mesh.rotation.y = cfg.rotY;
        mesh.scale.setScalar(cfg.scale);
        mesh.userData.baseScale = mesh.scale.clone(); // MUST preserve to avoid matrix decomposition shrink bugs
        group.add(mesh);

        _vrPanels.push({ domId: cfg.domId, domEl, group, mesh, grabbed: false, grabCtrl: null, localOffsetMatrix: new THREE.Matrix4() });
      });

      // Convenience aliases for compat
      if (_vrPanels.length > 0) {
        window._vrPanelGroup = _vrPanels[0].group;
        window._vrPanelMesh  = _vrPanels[0].mesh;
      }

      // Hide IK ghost robots + target handles in VR — not needed in passthrough
      IK_GHOSTS.forEach(g => {
        if (g?.root) { g.root.userData._vrWasVisible = g.root.visible; g.root.visible = false; }
      });
      IK_HANDLES.forEach(h => {
        if (h) { h.userData._vrWasVisible = h.visible; h.visible = false; }
      });
    }

    function destroyVrPanel() {
      _stopVrPanelObserver();
      document.body.classList.remove('vr-mode');
      _vrPanels.forEach(vp => {
        vp.group.remove(vp.mesh);
        vp.mesh.material?.map?.dispose();
        vp.mesh.geometry?.dispose();
        xrRig.remove(vp.group);
        // Restore 2D panel
        if (vp.domEl && vp.domEl.dataset.vrHidden) {
          delete vp.domEl.dataset.vrHidden;
        }
      });
      _vrPanels.length = 0;
      window._vrPanelGroup = null;
      window._vrPanelMesh  = null;
      if (_vrGui) { _vrGui.destroy(); _vrGui = null; }

      // Restore IK visuals to their pre-VR state
      IK_GHOSTS.forEach(g => {
        if (g?.root) g.root.visible = g.root.userData._vrWasVisible ?? false;
      });
      IK_HANDLES.forEach(h => {
        if (h) h.visible = h.userData._vrWasVisible ?? false;
      });
    }

    // ── Hand tracking: OculusHandModel + OculusHandPointerModel ───────────
    const _xrHands = [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    const _handPtrs = [];
    xrRig.add(_xrHands[0], _xrHands[1]);

    _xrHands.forEach((hand, i) => {
      hand.add(new OculusHandModel(hand));
      const ptr = new OculusHandPointerModel(hand, _xrCtrls[i]);
      hand.add(ptr);
      _handPtrs.push(ptr);
    });

    // ── Single-grip: grab/move a VR panel ────────────────────────
    // Per-controller state for panel grabbing
    const _panelGrabState = [
      { panelIdx: -1 },
      { panelIdx: -1 }
    ];

    function _tryGrabPanel(ctrlIdx) {
      if (_vrPanels.length === 0) return false;
      const ctrl = _xrCtrls[ctrlIdx];
      _tempMatrix.identity().extractRotation(ctrl.matrixWorld);
      _raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
      _raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_tempMatrix);

      let bestDist = Infinity, bestIdx = -1;
      _vrPanels.forEach((vp, idx) => {
        const hits = _raycaster.intersectObject(vp.mesh, false);
        // Only allow grab on the top ~15-20% (header) of the panel (v > 0.82)
        if (hits.length > 0 && hits[0].distance < bestDist) { 
          if (hits[0].uv && hits[0].uv.y > 0.82) {
            bestDist = hits[0].distance; bestIdx = idx; 
          }
        }
      });

      if (bestIdx < 0) return false;

      const vp = _vrPanels[bestIdx];
      const gs = _panelGrabState[ctrlIdx];
      gs.panelIdx = bestIdx;
      
      // Rigid 6-DOF attach: compute panel's matrix in controller space
      const ctrlInv = new THREE.Matrix4().copy(ctrl.matrixWorld).invert();
      vp.localOffsetMatrix.multiplyMatrices(ctrlInv, vp.mesh.matrixWorld);

      vp.grabbed = true;
      vp.grabCtrl = ctrlIdx;
      return true;
    }

    function _releasePanel(ctrlIdx) {
      const gs = _panelGrabState[ctrlIdx];
      if (gs.panelIdx >= 0 && gs.panelIdx < _vrPanels.length) {
        _vrPanels[gs.panelIdx].grabbed = false;
        _vrPanels[gs.panelIdx].grabCtrl = null;
      }
      gs.panelIdx = -1;
    }

    function _tickPanelGrabs() {
      if (_vrPanels.length === 0) return;
      [0, 1].forEach(ctrlIdx => {
        const gs = _panelGrabState[ctrlIdx];
        if (gs.panelIdx < 0) return;
        const vp = _vrPanels[gs.panelIdx];
        const ctrl = _xrCtrls[ctrlIdx];

        // Apply controller matrix + local offset rigidly
        const newWorldMat = new THREE.Matrix4().multiplyMatrices(ctrl.matrixWorld, vp.localOffsetMatrix);
        const parentInv = new THREE.Matrix4().copy(vp.mesh.parent.matrixWorld).invert();
        const newLocalMat = new THREE.Matrix4().multiplyMatrices(parentInv, newWorldMat);
        newLocalMat.decompose(vp.mesh.position, vp.mesh.quaternion, new THREE.Vector3());
        vp.mesh.scale.copy(vp.mesh.userData.baseScale); // RESTORE SCALE rigidly!
      });
    }

    // ── Two-grip: translate + rotate + LIFT (squeeze both grips, no panel grabbed) ─
    const _gripState = [false, false];
    let _grabbing = false;
    const _grabStartMid = new THREE.Vector3();
    let _grabStartAngle = 0;
    let _grabStartMidY = 0;   // NEW: track vertical midpoint at grab start

    // VR FIX: We offset the user's Rig position instead of shifting the Scene
    const _grabRigPos = new THREE.Vector3();
    let _grabRigRot = 0;

    _xrCtrls.forEach((ctrl, i) => {
      ctrl.addEventListener('squeezestart', () => {
        _gripState[i] = true;

        // Single-grip: try to grab a VR panel first
        if (!_grabbing) {
          _tryGrabPanel(i);
        }

        // Two-grip: world navigation only if neither grip is panel-grabbing
        if (_gripState[0] && _gripState[1] &&
            _panelGrabState[0].panelIdx < 0 && _panelGrabState[1].panelIdx < 0) {
          const p0 = _xrGrips[0].position;
          const p1 = _xrGrips[1].position;
          _grabStartMid.addVectors(p0, p1).multiplyScalar(0.5);
          _grabStartAngle = Math.atan2(p1.x - p0.x, p1.z - p0.z);
          _grabStartMidY = _grabStartMid.y;  // capture Y for lift

          _grabRigPos.copy(xrRig.position);
          _grabRigRot = xrRig.rotation.y;
          _grabbing = true;
        }
      });
      ctrl.addEventListener('squeezeend', () => {
        _releasePanel(i);
        _gripState[i] = false;
        if (_grabbing) { _grabbing = false; }
      });
    });

    // Pre-allocated scratch for tickWorldGrab — avoids per-frame heap allocation in VR
    const _wg_mid    = new THREE.Vector3();
    const _wg_delta  = new THREE.Vector3();
    const _wg_deltaXZ = new THREE.Vector3();
    const _wg_upAxis  = new THREE.Vector3(0, 1, 0);

    function tickWorldGrab() {
      if (!_grabbing || !_gripState[0] || !_gripState[1]) return;
      // Don't world-navigate while a panel is being grabbed
      if (_panelGrabState[0].panelIdx >= 0 || _panelGrabState[1].panelIdx >= 0) return;

      const p0 = _xrGrips[0].position;
      const p1 = _xrGrips[1].position;
      // PERF FIX: reuse scratch vectors — no allocation per frame
      _wg_mid.addVectors(p0, p1).multiplyScalar(0.5);
      const currentAngle = Math.atan2(p1.x - p0.x, p1.z - p0.z);

      const angleDelta = currentAngle - _grabStartAngle;
      xrRig.rotation.y = _grabRigRot - angleDelta;

      _wg_delta.copy(_wg_mid).sub(_grabStartMid);

      // Horizontal movement (XZ plane)
      _wg_deltaXZ.set(_wg_delta.x, 0, _wg_delta.z);
      _wg_deltaXZ.applyAxisAngle(_wg_upAxis, _grabRigRot);

      // Vertical lift: moving both grips up/down raises/lowers the virtual scene
      const deltaY = _wg_delta.y;

      // Moving the VR user in the opposite direction moves the scene
      xrRig.position.set(
        _grabRigPos.x - _wg_deltaXZ.x,
        _grabRigPos.y - deltaY,   // lift: rig goes down when grips go up (scene goes up)
        _grabRigPos.z - _wg_deltaXZ.z
      );
    }

    // ── Bimanual hand-tracking scene grab ─────────────────────────────────────
    // When both hands pinch simultaneously and NEITHER is dragging an IK handle,
    // treat the midpoint + angle between them as a two-grip world-nav gesture
    // (rotate, translate XZ, lift Y) — same physics as controller squeezestart /
    // tickWorldGrab but sourced from OculusHandPointerModel local space.
    const _handGrab = {
      active: false,
      startMid: new THREE.Vector3(),
      startAngle: 0,
      rigPos: new THREE.Vector3(),
      rigRot: 0,
    };

    function getPinchLocalPos(hp) {
      // hp.children[0] is pointerObject. Its pos is updated to pinch location.
      // Convert world pos to rig-local space to prevent feedback loops when rig moves
      const pointerTarget = hp.children.length > 0 ? hp.children[0] : hp;
      const wp = pointerTarget.getWorldPosition(new THREE.Vector3());
      return xrRig.worldToLocal(wp);
    }

    function tickHandSceneGrab() {
      if (!_xrSession || _handPtrs.length < 2) return;
      const [hp0, hp1] = _handPtrs;

      const h0Pinched = hp0.isPinched();
      const h1Pinched = hp1.isPinched();
      const h0IkBusy  = _pinchDrag[0].handleIdx >= 0;
      const h1IkBusy  = _pinchDrag[1].handleIdx >= 0;

      if (h0Pinched && h1Pinched && !h0IkBusy && !h1IkBusy) {
        const p0 = getPinchLocalPos(hp0);
        const p1 = getPinchLocalPos(hp1);
        if (isNaN(p0.x) || isNaN(p1.x)) return;

        if (!_handGrab.active) {
          // ── Grab start ────────────────────────────────────────────────────────
          _handGrab.active = true;
          _handGrab.startMid.addVectors(p0, p1).multiplyScalar(0.5);
          _handGrab.startAngle = Math.atan2(p1.x - p0.x, p1.z - p0.z);
          _handGrab.rigPos.copy(xrRig.position);
          _handGrab.rigRot = xrRig.rotation.y;
        } else {
          // ── Drag frame ────────────────────────────────────────────────────────
          // PERF FIX: reuse scratch vectors — no allocation per frame
          _wg_mid.addVectors(p0, p1).multiplyScalar(0.5);
          const currentAngle = Math.atan2(p1.x - p0.x, p1.z - p0.z);
          const angleDelta   = currentAngle - _handGrab.startAngle;
          xrRig.rotation.y   = _handGrab.rigRot - angleDelta;

          _wg_delta.copy(_wg_mid).sub(_handGrab.startMid);
          _wg_deltaXZ.set(_wg_delta.x, 0, _wg_delta.z)
            .applyAxisAngle(_wg_upAxis, _handGrab.rigRot);
          // Lift: moving both hands up raises the scene (rig goes down)
          xrRig.position.set(
            _handGrab.rigPos.x - _wg_deltaXZ.x,
            _handGrab.rigPos.y - _wg_delta.y,
            _handGrab.rigPos.z - _wg_deltaXZ.z
          );
        }
      } else {
        _handGrab.active = false; // release when either hand opens or goes to IK
      }
    }

    // ── VR Pinch IK Dragging — offset-based, NO re-parenting ──────────────
    // Root cause of fly-away: the old code called `children[0].attach(handle)`
    // which re-parents the IK sphere to an internal child of OculusHandPointerModel.
    // When hand tracking loses confidence, that child matrix goes NaN/infinite
    // and the sphere teleports away, feeding garbage into the IK solver.
    //
    // New approach: never re-parent anything.  On pinch-start we record the
    // world-space offset (handlePos – pointerPos) and each frame we compute
    // the new handle world position as (currentPointerPos + offset), validate
    // it, clamp it, and write directly to IK_TARGET_POS.  Clean and robust.

    // Per hand-pointer drag state (indexed by hand)
    const _pinchDrag = _handPtrs.map(() => ({
      handleIdx: -1,
      panelIdx: -1,
      grabOffset: new THREE.Vector3()
    }));

    // Helper to get exact pinch point rather than the wrist
    function getPinchWorldPos(hp, out) {
      // out defaults to _vrik_pwp — no allocation ever
      const target = hp.children.length > 0 ? hp.children[0] : hp;
      return target.getWorldPosition(out || _vrik_pwp);
    }

    function tickVrIk() {
      if (!_xrSession) return;
      IK_HANDLES.forEach(h => h.scale.setScalar(1.0)); // hover-size reset

      // ── Controller ray-cast dragging ──────────────────────────────────────
      _xrCtrls.forEach((ctrl, idx) => {
        if (_ctrlState[idx].attached) {
          _ctrlState[idx].attached.scale.setScalar(1.2);
          const handleIdx = IK_HANDLES.indexOf(_ctrlState[idx].attached);

          _tempMatrix.identity().extractRotation(ctrl.matrixWorld);
          _vrik_dir.set(0, 0, -1).applyMatrix4(_tempMatrix);
          _vrik_wp.setFromMatrixPosition(ctrl.matrixWorld);
          _vrik_wp.addScaledVector(_vrik_dir, _ctrlState[idx].dist);
          _vrik_lpos.copy(_vrik_wp);
          scene.worldToLocal(_vrik_lpos);
          _ctrlState[idx].attached.position.copy(_vrik_lpos);
          IK_TARGET_POS[handleIdx].copy(_vrik_lpos);
        }
      });

      // ── Hand pointer update + offset-based pinch dragging ─────────────────
      _handPtrs.forEach((hp, hpIdx) => {
        if (typeof hp.update === 'function') hp.update();

        const drag = _pinchDrag[hpIdx];

        if (hp.isPinched()) {
          if (drag.handleIdx < 0 && drag.panelIdx < 0) {
            // ── Grab start: find closest visible IK handle OR VR Panel ────────────────
            getPinchWorldPos(hp, _vrik_pwp);
            if (isNaN(_vrik_pwp.x)) return;

            let bestDist = Infinity, bestIdx = -1;
            IK_HANDLES.forEach((handle, idx) => {
              if (!handle.visible) return;
              const hits = hp.intersectObject(handle, true);
              if (hits && hits.length > 0 && hits[0].distance < bestDist) {
                bestDist = hits[0].distance; bestIdx = idx;
              }
            });

            if (bestIdx >= 0) {
              if (!IK_ENABLED[bestIdx]) window.enableIk(bestIdx);
              IK_HANDLES[bestIdx].getWorldPosition(_vrik_hwp);
              drag.grabOffset.subVectors(_vrik_hwp, _vrik_pwp);
              drag.handleIdx = bestIdx;
            } else {
              // Try grabbing a VR Panel if no IK handle hit
              let bestPnlDist = Infinity, bestPnlIdx = -1;
              _vrPanels.forEach((vp, idx) => {
                const hits = hp.intersectObject(vp.mesh, false);
                if (hits && hits.length > 0 && hits[0].distance < bestPnlDist) {
                  // Hand grab: Only header area (uv.y > 0.82) to avoid grabbing when tapping buttons!
                  if (hits[0].uv && hits[0].uv.y > 0.82) {
                    bestPnlDist = hits[0].distance; bestPnlIdx = idx;
                  }
                }
              });
              if (bestPnlIdx >= 0) {
                const vp = _vrPanels[bestPnlIdx];
                drag.panelIdx = bestPnlIdx;
                // Get rigid lock relative to pinch pointer tip (6-DOF) — reuse scratch matrices
                const pObj = hp.children.length > 0 ? hp.children[0] : hp;
                _vrik_m4a.copy(pObj.matrixWorld).invert();
                vp.localOffsetMatrix.multiplyMatrices(_vrik_m4a, vp.mesh.matrixWorld);
                vp.grabbed = true;
              }
            }
          } else if (drag.handleIdx >= 0) {
            // ── Drag frame: follow pointer + stored offset (IK Handle) ────────────────
            getPinchWorldPos(hp, _vrik_pwp);
            if (isNaN(_vrik_pwp.x) || _vrik_pwp.length() > 8) return;

            _vrik_newWp.copy(_vrik_pwp).add(drag.grabOffset);
            _vrik_lpos.copy(_vrik_newWp);
            scene.worldToLocal(_vrik_lpos);
            _vrik_lpos.x = Math.max(-1.5, Math.min(1.5, _vrik_lpos.x));
            _vrik_lpos.y = Math.max(-0.1, Math.min(1.5, _vrik_lpos.y));
            _vrik_lpos.z = Math.max(-1.5, Math.min(1.5, _vrik_lpos.z));

            IK_HANDLES[drag.handleIdx].position.copy(_vrik_lpos);
            IK_TARGET_POS[drag.handleIdx].copy(_vrik_lpos);
            IK_HANDLES[drag.handleIdx].scale.setScalar(1.2);

            IK_HANDLES[drag.handleIdx].getWorldPosition(_vrik_hwp);
            hp.setCursor(_vrik_pwp.distanceTo(_vrik_hwp));
          } else if (drag.panelIdx >= 0) {
            // ── Drag frame: VR Panel Hand Grab ────────────────
            const vp = _vrPanels[drag.panelIdx];
            const pObj = hp.children.length > 0 ? hp.children[0] : hp;
            if (isNaN(pObj.matrixWorld.elements[0])) return;

            // Reuse scratch Matrix4s — no allocation
            _vrik_m4b.multiplyMatrices(pObj.matrixWorld, vp.localOffsetMatrix);
            _vrik_m4c.copy(vp.mesh.parent.matrixWorld).invert();
            _vrik_m4a.multiplyMatrices(_vrik_m4c, _vrik_m4b);
            _vrik_m4a.decompose(vp.mesh.position, vp.mesh.quaternion, _vrik_sc);
            vp.mesh.scale.copy(vp.mesh.userData.baseScale); // RESTORE SCALE rigidly!
            hp.setCursor(0.01);
          }
        } else {
          // ── Release ───────────────────────────────────────────────────────
          if (drag.handleIdx >= 0) {
            IK_HANDLES[drag.handleIdx].scale.setScalar(1.0);
            drag.handleIdx = -1;
          }
          if (drag.panelIdx >= 0) {
            if (_vrPanels[drag.panelIdx]) _vrPanels[drag.panelIdx].grabbed = false;
            drag.panelIdx = -1;
          }
          hp.setCursor(1.5);
        }

        if (!hp.isPinched() && drag.handleIdx < 0 && drag.panelIdx < 0 && (_xrFrameCount % 3 === 0)) {

            const hits = hp.intersectObject(handle, true);
            if (hits && hits.length > 0 && hits[0].distance < 2.0) {
              handle.scale.setScalar(1.15);
              hp.setCursor(hits[0].distance);
            }
          });
        }
      });
    }

      // ── Spacebar shortcut ──────────────────────────────────────────────────
      let _spaceActive = false; // guard against key-repeat
      document.addEventListener('keydown', function (e) {
        if (e.code !== 'Space') return;
        // Don't steal space from text inputs
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        e.preventDefault();
        if (_spaceActive) return; // ignore key-repeat
        _spaceActive = true;
        if (!_isRecording) startRecording();
      });
      document.addEventListener('keyup', function (e) {
        if (e.code !== 'Space') return;
        _spaceActive = false;
        if (_isRecording) stopRecording();
      });
      // ────────────────────────────────────────────────────────────────────────

      async function startRecording() {
        try {
          const micSelect = document.getElementById('mic-select'), deviceId = micSelect ? micSelect.value : '';
          const stream = await navigator.mediaDevices.getUserMedia({ audio: deviceId ? { deviceId: { exact: deviceId } } : true, video: false });
          const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
          _mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
          _audioChunks = []; _isRecording = true;
          _mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) _audioChunks.push(e.data); };
          _mediaRecorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); uploadAudio(); };
          _mediaRecorder.start();
          pttBtn.classList.add('recording'); pttLabel.textContent = 'Recording… (Space or click to stop)'; setStatus('Recording — press Space or click to stop', '');
        } catch (err) { setStatus('Microphone access denied: ' + err.message, 'error'); _isRecording = false; }
      }

      function stopRecording() {
        if (_mediaRecorder && _mediaRecorder.state !== 'inactive') _mediaRecorder.stop();
        _isRecording = false; pttBtn.classList.remove('recording'); pttBtn.classList.add('loading'); pttLabel.textContent = 'Processing…'; setStatus('Sending to Whisper…', '');
      }

      async function uploadAudio() {
        if (_audioChunks.length === 0) { resetBtn(); setStatus('No audio captured.', 'error'); return; }
        const blob = new Blob(_audioChunks, { type: _mediaRecorder.mimeType || 'audio/webm' }), formData = new FormData(); formData.append('file', blob, 'voice.webm');
        const baseUrl = (location.hostname === 'app.local' || location.hostname === '') ? 'http://localhost:8181' : `${location.protocol}//${location.host}`;
        try {
          const resp = await fetch(`${baseUrl}/transcribe`, { method: 'POST', body: formData });
          if (!resp.ok) {
            const raw = await resp.text();
            // Strip HTML tags so a Cloudflare error page doesn't flood the UI
            const plain = raw.replace(/<[^>]+>/g, ' ').replace(/\s{2,}/g, ' ').trim().slice(0, 120);
            setStatus(`Error ${resp.status}${plain ? ': ' + plain : ''}`, 'error');
          }
          else {
            const data = await resp.json(), text = data.text || '';
            if (text.trim()) { voiceOutput.textContent = text.trim(); voiceOutput.classList.add('has-text'); setStatus('Transcription complete', 'success'); if (window.sendCommandToHost) window.sendCommandToHost('voiceTranscription', text.trim()); }
            else { setStatus('No speech detected.', 'error'); }
          }
        } catch (err) { setStatus('Network error: ' + err.message, 'error'); } finally { resetBtn(); }
      }

      function setStatus(msg, cls) { if (voiceStatus) { voiceStatus.textContent = msg; voiceStatus.className = cls ? `${cls}` : ''; } }
      function resetBtn() { pttBtn.classList.remove('loading', 'recording'); pttLabel.textContent = 'Press Space to Record'; _isRecording = false; }

      setTimeout(async () => {
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true }); tempStream.getTracks().forEach(t => t.stop());
          const devices = await navigator.mediaDevices.enumerateDevices(), select = document.getElementById('mic-select');
          if (select) {
            select.innerHTML = '<option value="">Default Microphone</option>';
            devices.filter(d => d.kind === 'audioinput').forEach(device => {
              const option = document.createElement('option'); option.value = device.deviceId; option.text = device.label || `Microphone ${select.options.length}`; select.appendChild(option);
            });
            const intelOption = Array.from(select.options).find(o => o.text.toLowerCase().includes('intel')); if (intelOption) select.value = intelOption.value;
          }
        } catch (e) { console.error("Failed to list microphones", e); }
      }, 1000);
    })();
  </script>
</body>

</html>
