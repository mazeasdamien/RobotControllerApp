<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Scene Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: rgb(10, 10, 10);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
      min-width: 200px;
    }

    #hud .title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
    }

    #hud .hint {
      opacity: 0.45;
      font-size: 10px;
      margin-top: 6px;
    }

    #pose-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 195, 0, 0.25);
      border-radius: 8px;
      padding: 10px 14px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      backdrop-filter: blur(8px);
      min-width: 190px;
      font-family: 'Courier New', monospace;
    }

    #pose-panel .pt {
      font-size: 12px;
      font-weight: 600;
      color: #ffc300;
      margin-bottom: 6px;
      font-family: 'Segoe UI', sans-serif;
    }

    #pose-panel .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 2px;
    }

    #pose-panel .label {
      color: rgba(255, 255, 255, 0.45);
    }

    #pose-panel .val {
      color: #fff;
    }

    #pose-panel.hidden {
      display: none;
    }

    #legend {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 14px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      max-width: 220px;
      backdrop-filter: blur(8px);
    }

    #legend .lt {
      color: #fff;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .li {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }

    .ld {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #no-objects {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.2);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    #no-objects svg {
      display: block;
      margin: 0 auto 10px;
      opacity: 0.2;
    }
  </style>
</head>

<body>

  <div id="hud">
    <div class="title">🔬 3D Scene Preview</div>
    <div>Objects: <span id="obj-count">0</span></div>
    <div class="hint">Drag · Scroll to zoom</div>
  </div>



  <div id="legend">
    <div class="lt">Detected Objects</div>
    <div id="legend-items"></div>
  </div>

  <div id="no-objects">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="white">
      <path
        d="M12 2l-5.5 9h11L12 2zm0 3.84L14.77 10H9.23L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5S15.01 22 17.5 22s4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zm0 7a2.5 2.5 0 010-5 2.5 2.5 0 010 5zM3 21.5h8v-8H3v8zm2-6h4v4H5v-4z" />
    </svg>
    Scan the scene to detect objects
  </div>

  <script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ── Renderer ──
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    document.body.appendChild(renderer.domElement);

    // ── Scene ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);
    scene.fog = new THREE.Fog(0x0a0a0a, 5, 16);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 50);
    camera.position.set(0.33 + 1.2, 1.2, 0.35 + 0.3); // Camera naturally on the right
    camera.lookAt(0.33, 0.05, 0.35);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.target.set(0.33, 0.05, 0.35);
    controls.maxPolarAngle = Math.PI / 2 + 0.15;
    controls.minDistance = 0.3; controls.maxDistance = 10;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.PAN,
      RIGHT: THREE.MOUSE.DOLLY
    };

    // ── Lighting ──
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dir = new THREE.DirectionalLight(0xffffff, 1.6);
    dir.position.set(1.5, 3, 2); dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    dir.shadow.camera.left = -2; dir.shadow.camera.right = 2;
    dir.shadow.camera.top = 2; dir.shadow.camera.bottom = -2;
    scene.add(dir);
    const fill = new THREE.PointLight(0x4444ff, 0.5, 5);
    fill.position.set(-1.5, 1.5, -1); scene.add(fill);

    // ── Table (Real world size 81cm x 81cm) ──
    const TABLE_W = 0.81, TABLE_D = 0.81;

    // We want the ArUco board (Real scale ~ 28cm x 20cm) to rest EXCACTLY in the top-left corner of the table.
    // The ArUco board's center is at OpenCV's (0,0).
    // In Three.js space, origin (0,0,0) is therefore the center of the board.
    // To align the Table's top-left corner with the board's top-left edge:
    // Board Top-Left from center is: (-0.14 in X, -0.10 in Z)
    // We want the Table's Top-Left edge (-TABLE_W/2, -TABLE_D/2 from surface center) to sit exactly at that (-0.14, -0.10).
    // So Table Center = (-0.14, -0.10) - (-TABLE_W/2, -TABLE_D/2);
    // Which means: Table Center = (TABLE_W/2 - 0.14, TABLE_D/2 - 0.10)

    const TABLE_CX = (TABLE_W / 2) - 0.14;
    const TABLE_CZ = (TABLE_D / 2) - 0.10;

    const tableMat = new THREE.MeshStandardMaterial({ color: 0x14142a, roughness: 0.55, metalness: 0.1 });
    const tableMesh = new THREE.Mesh(new THREE.BoxGeometry(TABLE_W, 0.012, TABLE_D), tableMat);
    tableMesh.receiveShadow = true;
    tableMesh.position.set(TABLE_CX, -0.006, TABLE_CZ);
    scene.add(tableMesh);

    const grid = new THREE.GridHelper(TABLE_W, 12, 0x252560, 0x252560);
    grid.position.set(TABLE_CX, 0.001, TABLE_CZ);
    scene.add(grid);

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(TABLE_W, 0.012, TABLE_D)),
      new THREE.LineBasicMaterial({ color: 0x3a3a8a })
    );
    edges.position.copy(tableMesh.position); scene.add(edges);

    // ── Load Niryo Ned 3D Models ──
    const gltfLoader = new GLTFLoader();
    gltfLoader.load('ned.glb', (gltf) => {
      const nedModel = gltf.scene;
      nedModel.traverse((node) => {
        if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }
      });

      const BASE_OFFSET = 0.095; // Assume 19cm x 19cm robot base -> 9.5cm distance to center
      const MARGIN = 0.017; // 1.7cm padding from edge
      const FORWARD_SHIFT = 0.05; // 5cm forward shift
      const OFFSET = BASE_OFFSET + MARGIN;

      // Robot 1: Top-Right corner 1.7cm from edges + shifted 5cm forward
      const r1 = nedModel.clone();
      r1.position.set(TABLE_CX + 0.405 - OFFSET - FORWARD_SHIFT, 0, TABLE_CZ - 0.405 + OFFSET);
      r1.rotation.y = Math.PI; // 90 deg clockwise from Left (-X) to Forward (-Z)
      scene.add(r1);

      // Robot 2: Bottom-Right corner 1.7cm from edges + shifted 5cm forward
      const r2 = nedModel.clone();
      r2.position.set(TABLE_CX + 0.405 - OFFSET - FORWARD_SHIFT, 0, TABLE_CZ + 0.405 - OFFSET);
      r2.rotation.y = Math.PI; // 90 deg clockwise from Left (-X) to Forward (-Z)
      scene.add(r2);

    }, undefined, (e) => console.error("Could not load ned.glb:", e));

    // Helper to draw text labels
    function makeTextSprite(message) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = 'Bold 32px "Segoe UI", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(message, 128, 64);
      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(0.15, 0.075, 1);
      return sprite;
    }

    // Add 81cm labels for width and length
    const labelX = makeTextSprite("X: 81 cm");
    labelX.position.set(TABLE_CX, 0.02, TABLE_CZ + TABLE_D / 2 + 0.02);
    scene.add(labelX);

    const labelZ = makeTextSprite("Y: 81 cm");
    labelZ.position.set(TABLE_CX + TABLE_W / 2 + 0.03, 0.02, TABLE_CZ);
    scene.add(labelZ);

    // ── Marker Board Representation (Real scale ~ 28cm x 20cm) ──
    const boardMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const boardMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.20), boardMat);
    boardMesh.rotation.x = -Math.PI / 2;
    boardMesh.position.set(0, 0.002, 0);
    scene.add(boardMesh);

    // Add tiny fake marker checkerboard pattern
    const boardGridMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide });
    const boardGridMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.17), boardGridMat);
    boardGridMesh.rotation.x = -Math.PI / 2;
    boardGridMesh.position.set(0, 0.003, 0);
    scene.add(boardGridMesh);

    // World axes precisely at the center of the Niryo paper
    const axesHelper = new THREE.AxesHelper(0.10);
    axesHelper.position.y = 0.005; scene.add(axesHelper);

    // Toggle for calibration guides
    window.toggleCalibrationPlane = function (show) {
      boardMesh.visible = show;
      boardGridMesh.visible = show;
      axesHelper.visible = show;
    };

    // ── Object group ──
    const objGroup = new THREE.Group();
    scene.add(objGroup);

    // ── Camera Cone (virtual camera visualisation) ──
    let camCone = null;
    let camFrustumLines = null;
    let camVideoPlane = null;
    let camVideoTexture = null;

    function buildCameraViz(tx, ty, tz, poseObj) {
      try {
        // Remove previous
        if (camCone) { scene.remove(camCone); camCone.geometry.dispose(); camCone.material.dispose(); }
        if (camFrustumLines) { scene.remove(camFrustumLines); camFrustumLines.geometry.dispose(); camFrustumLines.material.dispose(); }
        if (camVideoPlane) { scene.remove(camVideoPlane); camVideoPlane.geometry.dispose(); camVideoPlane.material.dispose(); camVideoPlane = null; }

        // Body of camera - use a 4 sided pyramid to match a camera body
        const coneGeo = new THREE.ConeGeometry(0.06, 0.14, 4, 1, false, Math.PI / 4);
        coneGeo.translate(0, -0.07, 0); // Shift origin to the tip (apex)
        coneGeo.rotateX(Math.PI / 2);   // Align cone's 'forward' (+Y) with OpenCV's 'forward' (+Z)

        const coneMat = new THREE.MeshStandardMaterial({ color: 0xffc300, emissive: 0xffc300, emissiveIntensity: 0.12, roughness: 0.4 });
        camCone = new THREE.Mesh(coneGeo, coneMat);

        // 2. Map OpenCV Object Space -> Three.js Space
        // OpenCV Space: X is Right, Y is Forward on table, Z is Up from table
        // Three Space: X is Right, Y is Up, Z is Backward
        const camX = tx;
        const camY = Math.max(0.05, Math.abs(tz)); // Guard minimum height
        const camZ = -ty;

        camCone.position.set(camX, camY, camZ);

        if (poseObj && poseObj.R11 !== undefined) {
          // Mathematical conversion to Three.js basis vectors.
          // In OpenCV, rvec is an axis-angle representing World -> Camera.
          // The inverse rotation is -angle, going Camera -> World.
          const ax = poseObj.Rx, ay = poseObj.Ry, az = poseObj.Rz;
          const angle = Math.sqrt(ax * ax + ay * ay + az * az);
          const qCv = new THREE.Quaternion();
          if (angle > 0.0001) {
            // OpenCV axis
            const axisCv = new THREE.Vector3(ax / angle, ay / angle, az / angle);
            // We want Camera -> World in OpenCV space, so inverse rotation
            qCv.setFromAxisAngle(axisCv, -angle);
          }

          // OpenCV World to ThreeJS World conversion
          // OpenCV World: X=right, Y=forward, Z=up
          // ThreeJS World: X=right, Y=up, Z=backward (-Z is forward)
          // Mapping: (x, y, z) -> (x, z, -y) is a -90 deg rotation around X
          const qWorld = new THREE.Quaternion();
          qWorld.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);

          // The camera requires a 180-degree rotation around its own axis to flip upside down
          const qRot180 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI);
          const qFinal = new THREE.Quaternion().copy(qWorld).multiply(qCv).multiply(qRot180);

          camCone.quaternion.copy(qFinal);

          camCone.castShadow = false;
          scene.add(camCone);

          // True Frustum lines
          const apex = new THREE.Vector3(camX, camY, camZ);

          // By mapping with qFinal, we extract the transformed axes directly:
          // OpenCV camera's local forward is +Z
          const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(qFinal);
          // OpenCV camera's local up is -Y (since +Y is visually down)
          const trueUp = new THREE.Vector3(0, -1, 0).applyQuaternion(qFinal);
          // OpenCV camera's local right is +X
          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(qFinal);

          // Project the rays exactly onto the table plane (Y=0)
          let dist = 2.0; // fallback
          if (forward.y < -0.05) {
            dist = Math.abs(camY / forward.y);
          }

          const aspect = (camVideoTexture && camVideoTexture.image && camVideoTexture.image.width > 0)
            ? (camVideoTexture.image.width / camVideoTexture.image.height)
            : (16 / 9); // Default HD webcam ratio

          const fovScale = window.currentFovScale !== undefined ? window.currentFovScale : 0.40;
          const halfH = dist * fovScale;
          const halfW = halfH * aspect;

          const centerFocus = apex.clone().addScaledVector(forward, dist);

          const virtualCorners = [
            centerFocus.clone().addScaledVector(right, -halfW).addScaledVector(trueUp, halfH),
            centerFocus.clone().addScaledVector(right, halfW).addScaledVector(trueUp, halfH),
            centerFocus.clone().addScaledVector(right, halfW).addScaledVector(trueUp, -halfH),
            centerFocus.clone().addScaledVector(right, -halfW).addScaledVector(trueUp, -halfH)
          ];

          // Math: Where do the 4 corner rays hit the physical table?
          function getIntercept(point) {
            const ray = point.clone().sub(apex);
            // If the camera is looking parallel or upward, prevent infinity by drawing far away
            if (ray.y >= -0.001) {
              ray.normalize();
              return apex.clone().add(ray.multiplyScalar(15));
            }
            const t = (0.002 - apex.y) / ray.y;
            return apex.clone().add(ray.multiplyScalar(t));
          }

          const corners = [
            getIntercept(virtualCorners[0]), // Top-Left
            getIntercept(virtualCorners[1]), // Top-Right
            getIntercept(virtualCorners[2]), // Bottom-Right
            getIntercept(virtualCorners[3])  // Bottom-Left
          ];

          // Render video projection perfectly flattened mathematically onto the table mesh
          if (camVideoTexture) {
            // Create a subdivided grid to fix WebGL affine texture distortion
            const rectGeo = new THREE.PlaneGeometry(1, 1, 32, 32);
            const posAttr = rectGeo.attributes.position;
            const uvAttr = rectGeo.attributes.uv;

            for (let i = 0; i < posAttr.count; i++) {
              const u = uvAttr.getX(i);
              const v = uvAttr.getY(i);

              // Optical pinhole inversion (flip UV mathematically before raycasting)
              const wX = ((1.0 - u) - 0.5) * 2.0 * halfW;
              const wY = ((1.0 - v) - 0.5) * 2.0 * halfH;

              const pt = centerFocus.clone()
                .addScaledVector(right, wX)
                .addScaledVector(trueUp, wY);

              const intercept = getIntercept(pt);
              posAttr.setXYZ(i, intercept.x, intercept.y, intercept.z);
            }
            rectGeo.computeVertexNormals();

            const pMat = new THREE.MeshBasicMaterial({
              map: camVideoTexture,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: window.currentCamOpacity !== undefined ? window.currentCamOpacity : 0.85
            });
            camVideoPlane = new THREE.Mesh(rectGeo, pMat);
            scene.add(camVideoPlane);
          }

          const lines = [];
          corners.forEach(c => { lines.push(apex); lines.push(c); });
          for (let i = 0; i < 4; i++) { lines.push(corners[i]); lines.push(corners[(i + 1) % 4]); }

          const fGeo = new THREE.BufferGeometry().setFromPoints(lines);
          const fMat = new THREE.LineBasicMaterial({ color: 0xffc300, opacity: 0.45, transparent: true });
          camFrustumLines = new THREE.LineSegments(fGeo, fMat);
          scene.add(camFrustumLines);
        }

      } catch (err) {
        document.getElementById('legend-items').innerHTML = `<div style="color:red; font-size:10px;">${err.message}<br/>${err.stack}</div>`;
      }
    }

    // ── Helpers ──
    function colorFromLabel(label) {
      const map = {
        red: 0xff3333, blue: 0x3366ff, green: 0x33cc66, yellow: 0xffdd00,
        orange: 0xff7700, purple: 0xaa44ff, pink: 0xff66aa, white: 0xeeeeff,
        black: 0x222233, grey: 0x778899, gray: 0x778899, brown: 0xaa6633,
        cyan: 0x00ddff, magenta: 0xff00aa,
      };
      const lo = label.toLowerCase();
      for (const [k, v] of Object.entries(map)) if (lo.includes(k)) return v;
      let h = 0; for (const c of label) h = (c.charCodeAt(0) + ((h << 5) - h)) | 0;
      return Math.abs(h) % 0xffffff;
    }

    // ── Public API (called from C#) ──
    window.setCameraFovScale = function (val) {
      window.currentFovScale = val;
    };

    window.setCameraFeedOpacity = function (val) {
      window.currentCamOpacity = val;
      if (camVideoPlane && camVideoPlane.material) {
        camVideoPlane.material.opacity = val;
      }
    };

    window.updateCameraFeed = function (base64Url) {
      let isFirstTime = false;
      if (!camVideoTexture) {
        camVideoTexture = new THREE.Texture();
        camVideoTexture.colorSpace = THREE.SRGBColorSpace;
        isFirstTime = true;
      }
      const img = new Image();
      img.onload = () => {
        camVideoTexture.image = img;
        camVideoTexture.needsUpdate = true;
        if (isFirstTime && window.lastPoseObj && !camVideoPlane) {
          window.setCameraPose(JSON.stringify(window.lastPoseObj));
        }
      };
      img.src = base64Url;
    };

    window.setDetectedObjects = function (jsonStr) {
      try { renderObjects(JSON.parse(jsonStr)); } catch (e) { console.error(e); }
    };

    window.setCameraPose = function (jsonStr) {
      try {
        const p = JSON.parse(jsonStr);
        window.lastPoseObj = p;
        // The raw UI panel was removed to favor the native WPF overlay
        // Update 3D camera cone
        buildCameraViz(p.X, p.Y, p.Z, p);
      } catch (e) { console.error(e); }
    };

    const legendEl = document.getElementById('legend-items');
    const noObjEl = document.getElementById('no-objects');
    const countEl = document.getElementById('obj-count');

    function clearObjects() {
      while (objGroup.children.length) {
        const c = objGroup.children[0];
        c.geometry?.dispose();
        (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m?.dispose());
        objGroup.remove(c);
      }
      legendEl.innerHTML = '';
    }

    function renderObjects(items) {
      clearObjects();
      noObjEl.style.display = items.length ? 'none' : 'block';
      countEl.textContent = items.length;

      items.forEach(item => {
        const raw = colorFromLabel(item.label);
        const col = new THREE.Color(raw);

        // worldX / worldY are in metres from the camera's perspective projection
        // Map as OpenCV X → Three.js X, OpenCV Y (Forward) → Three.js -Z (Forward)
        // Map as OpenCV X → Three.js X, OpenCV Y (Forward) → Three.js -Z (Forward)
        const px = item.worldX;
        const pz = -item.worldY;

        const bw = Math.max(0.025, Math.min(0.35, item.sizeW));
        const bd = Math.max(0.025, Math.min(0.35, item.sizeH));

        function makeTextSprite(message, color) {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 512; canvas.height = 128;
          ctx.fillStyle = '#' + color.getHexString();
          ctx.font = 'bold 48px Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(message, 256, 64);
          const texture = new THREE.CanvasTexture(canvas);
          texture.minFilter = THREE.LinearFilter;
          const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
          const sprite = new THREE.Sprite(spriteMaterial);
          sprite.scale.set(0.15, 0.0375, 1);
          return sprite;
        }

        const labelSprite = makeTextSprite(item.label, col);

        function addSphere() {
          const radius = Math.min(bw, bd) / 2.5;
          const geo = new THREE.SphereGeometry(radius, 32, 16);
          const mat = new THREE.MeshStandardMaterial({
            color: col, roughness: 0.35, metalness: 0.15,
            emissive: col, emissiveIntensity: 0.08
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.castShadow = true; mesh.receiveShadow = true;
          mesh.position.set(px, radius, pz);

          if (item.angleRad !== undefined) {
            mesh.rotation.y = -item.angleRad;
          }

          const pivotAxes = new THREE.AxesHelper(0.08); // 8cm axes visual length
          mesh.add(pivotAxes);

          objGroup.add(mesh);

          labelSprite.position.set(px, radius * 2 + 0.03, pz);
          objGroup.add(labelSprite);
        }

        if (item.modelUrl && item.modelUrl.trim() !== '') {
          gltfLoader.load(item.modelUrl, (gltf) => {
            const model = gltf.scene;

            model.traverse((node) => {
              if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }
            });

            // Pivot to bottom center
            const box = new THREE.Box3().setFromObject(model);
            const cy = box.min.y;
            model.position.y = -cy; // shifts model up so its lowest point is at 0

            const wrapper = new THREE.Group();
            wrapper.add(model);

            // Real-world Scale based on BBox width (sizeW is in meters)
            const modelW = box.max.x - box.min.x;
            const targetW = Math.max(0.01, item.sizeW);
            const s = modelW > 0.0001 ? targetW / modelW : 1;
            wrapper.scale.set(s, s, s);

            if (item.angleRad !== undefined) {
              wrapper.rotation.y = -item.angleRad;
            }

            wrapper.position.set(px, 0, pz); // on the table surface

            const boxScaled = new THREE.Box3().setFromObject(wrapper);
            labelSprite.position.set(px, boxScaled.max.y + 0.03, pz);

            const pivotAxes = new THREE.AxesHelper(0.08 / s); // 8cm axes visual length
            wrapper.add(pivotAxes);

            objGroup.add(wrapper);
            objGroup.add(labelSprite);
          }, undefined, (e) => {
            console.warn('Failed to load model:', item.modelUrl, e);
            addSphere();
          });
        } else {
          addSphere();
        }

        // Legend
        const d = document.createElement('div');
        d.className = 'li';
        d.innerHTML = `<div class="ld" style="background:#${col.getHexString()}"></div><span>${item.label}</span>`;
        legendEl.appendChild(d);
      });
    }

    // ── Render loop ──
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
