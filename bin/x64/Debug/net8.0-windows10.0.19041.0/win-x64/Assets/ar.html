<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AR Overlay View</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #feed-container {
      position: relative;
      background: #000;
      overflow: hidden;
      z-index: 1;
      width: 100%;
      height: 100%;
      aspect-ratio: 16 / 9;
      max-width: 100vw;
      max-height: 100vh;
    }

    #camera-feed {
      position: absolute;
      width: 100%; height: 100%;
      object-fit: fill; /* Stretches safely because container is strictly 16:9 */
    }

    #threejs-canvas {
      position: absolute;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Hidden composite canvas used for getArFrame() */
    #composite-canvas { display: none; }
  </style>
</head>

<body>
  <div id="feed-container">
    <img id="camera-feed" alt="AR Feed" crossorigin="anonymous" />
    <canvas id="threejs-canvas"></canvas>
  </div>
  <canvas id="composite-canvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const params = new URLSearchParams(location.search);
    const camName = params.get('cam') || 'creative';

    // ── Three.js Scene ───────────────────────────────────────────────────────
    const canvas = document.getElementById('threejs-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 20);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(1, 5, 2);
    scene.add(dirLight);

    // ── Load Robots ──────────────────────────────────────────────────────────
    const gltfLoader = new GLTFLoader();
    window.robotJointRefs = [[], []];

    function collectJoints(root) {
      const joints = [];
      for (let i = 1; i <= 6; i++) {
        // Find exact matches for standard GLTF export or loose case-insensitive matching
        let found = root.getObjectByName('joint_' + i) || root.getObjectByName('Joint_' + i) || root.getObjectByName('Axis' + i);
        if (!found) {
          root.traverse(c => {
            if (!found && c.name && (c.name.toLowerCase() === `joint_${i}` || c.name.toLowerCase() === `axis${i}`)) found = c;
          });
        }
        if (found) joints.push(found);
      }
      return joints;
    }

    gltfLoader.load('./ned.glb', (gltf) => {
      const model = gltf.scene;
      model.rotation.x = Math.PI / 2;

      model.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshBasicMaterial({
            color: 0x00e5ff,
            transparent: true,
            opacity: 0.15,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
          });
        }
      });

      const r1 = new THREE.Group();
      const m1 = model.clone();
      r1.add(m1);
      r1.position.set(0.29, -0.53, 0);
      r1.rotation.z = Math.PI / 2;
      scene.add(r1);

      const r2 = new THREE.Group();
      const m2 = model.clone();
      r2.add(m2);
      r2.position.set(-0.29, -0.53, 0);
      r2.rotation.z = Math.PI / 2;
      scene.add(r2);

      // Collect joints using robust multi-strategy approach
      window.robotJointRefs[0] = collectJoints(m1);
      window.robotJointRefs[1] = collectJoints(m2);

      console.log('[AR] Robot 0 joints:', window.robotJointRefs[0].map(j => j?.name));
      console.log('[AR] Robot 1 joints:', window.robotJointRefs[1].map(j => j?.name));
    });

    // ── Composite frame export (called from C# via ExecuteScriptAsync) ───────
    const feedImg = document.getElementById('camera-feed');
    const compositeCanvas = document.getElementById('composite-canvas');

    window.extractAndSendArFrame = function() {
      try {
        const w = 640, h = 360; 
        compositeCanvas.width = w;
        compositeCanvas.height = h;
        const ctx = compositeCanvas.getContext('2d');
        ctx.drawImage(feedImg, 0, 0, w, h);
        ctx.drawImage(canvas, 0, 0, w, h);

        // Hardware-accelerated synchronous extraction at tiny 360p takes <3ms.
        // Bypassing toBlob removes the 1000ms worker thread locks that throttled Unity to 1 FPS!
        const frameData = compositeCanvas.toDataURL('image/jpeg', 0.25);
        if (frameData && window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(`ar_frame|${camName}|${frameData}`);
        }
      } catch (e) {
      }
    };

    setInterval(() => {
      if (window.chrome && window.chrome.webview) {
        window.extractAndSendArFrame();
      }
    }, 66); // 15 FPS Target

    // ── WebSocket Communication ──────────────────────────────────────────────
    const WS_URL = `ws://${location.hostname}:8181/scene3d-ws`;
    let ws;

    function connect() {
      ws = new WebSocket(WS_URL);
      ws.onmessage = (ev) => {
        let env;
        try { env = JSON.parse(ev.data); } catch { return; }

        if (env.type === 'setCameraPose') {
          const p = typeof env.payload === 'string' ? JSON.parse(env.payload) : env.payload;
          if (p.camType === camName) {
            camera.position.set(p.X, p.Y, p.Z);
            const R = new THREE.Matrix4().set(
              p.R11, p.R12, p.R13, 0,
              p.R21, p.R22, p.R23, 0,
              p.R31, p.R32, p.R33, 0,
              0, 0, 0, 1
            );
            camera.setRotationFromMatrix(R);
            camera.rotateX(Math.PI);
          }
        }
        else if (env.type === 'setRobotJoints') {
          const p = typeof env.payload === 'string' ? JSON.parse(env.payload) : env.payload;
          if (window.robotJointRefs && window.robotJointRefs[p.robotIdx]) {
            const j = window.robotJointRefs[p.robotIdx];
            // angles arrive in degrees, convert to radians
            for (let i = 0; i < 6; i++) {
              if (j[i]) j[i].rotation.z = p.angles[i] * Math.PI / 180.0;
            }
          }
        }
        else if (env.type === 'setArOpacity') {
          const v = parseFloat(env.payload);
          scene.traverse(c => {
            if (c.isMesh && c.material) c.material.opacity = v;
          });
        }
        else if ((env.type === 'updateCameraFeed' && camName === 'creative') ||
                 (env.type === 'updateCameraFeed2' && camName === 'intel')) {
          try {
            let data = env.payload;
            if (typeof data === 'string') {
              if (data.startsWith('"') && data.endsWith('"')) data = data.substring(1, data.length - 1);
              else if (data.includes('"')) data = data.replace(/"/g, '');
              if (data.includes('data:image')) feedImg.src = data;
            }
          } catch { }
        }
      };
      ws.onclose = () => setTimeout(connect, 2000);
    }
    connect();

    function resize() {
      const w = 1280, h = 720;
      renderer.setSize(w, h, false); // Fix WebGL internal buffer resolving to HD 16:9
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    (function loop() {
      requestAnimationFrame(loop);
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
