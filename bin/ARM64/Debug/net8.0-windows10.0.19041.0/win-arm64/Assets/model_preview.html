<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>3D Model Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d12;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
        }

        #loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d0d12;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            gap: 12px;
            transition: opacity 0.4s;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ff6a00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 4px 14px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
            pointer-events: none;
            white-space: nowrap;
        }

        #error {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: rgba(255, 80, 80, 0.8);
            font-size: 13px;
            text-align: center;
            padding: 24px;
        }
    </style>
    <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  } }
  </script>
</head>

<body>
    <div id="loader">
        <div class="spinner"></div><span>Loading model…</span>
    </div>
    <div id="error"></div>
    <div id="hint">Drag to rotate · Scroll to zoom</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // ── Renderer ──────────────────────────────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // ── Scene ────────────────────────────────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d12);

        // ── Camera ───────────────────────────────────────────────────────────────
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 50);
        camera.position.set(0, 0.15, 0.45);

        // ── Controls ─────────────────────────────────────────────────────────────
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.minDistance = 0.05;
        controls.maxDistance = 6;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.8;

        // ── Lighting ─────────────────────────────────────────────────────────────
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const key = new THREE.DirectionalLight(0xfff4e0, 2.2);
        key.position.set(2, 3, 2);
        key.castShadow = true;
        key.shadow.mapSize.set(1024, 1024);
        key.shadow.camera.near = 0.1;
        key.shadow.camera.far = 10;
        key.shadow.camera.left = key.shadow.camera.bottom = -1;
        key.shadow.camera.right = key.shadow.camera.top = 1;
        scene.add(key);

        const fill = new THREE.DirectionalLight(0x8ab4f8, 0.8);
        fill.position.set(-2, 1, -1);
        scene.add(fill);

        const rim = new THREE.DirectionalLight(0xffffff, 0.5);
        rim.position.set(0, -1, -2);
        scene.add(rim);

        // ── Ground plane with shadow ──────────────────────────────────────────────
        const groundGeo = new THREE.CircleGeometry(0.9, 64);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x141420, roughness: 0.9, metalness: 0.05
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Subtle ring glow under model
        const ringGeo = new THREE.RingGeometry(0.0, 0.3, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0xff6a00, transparent: true, opacity: 0.12, side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.001;
        scene.add(ring);

        // ── Load model from URL param ─────────────────────────────────────────────
        const params = new URLSearchParams(location.search);
        const modelUrl = params.get('url');

        const loaderEl = document.getElementById('loader');
        const errorEl = document.getElementById('error');

        if (!modelUrl) {
            loaderEl.classList.add('hidden');
            errorEl.style.display = 'flex';
            errorEl.textContent = 'No model URL provided.';
        } else {
            const loader = new GLTFLoader();
            loader.load(
                modelUrl,
                (gltf) => {
                    const model = gltf.scene;

                    // Centre + fit model to view
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 0.28 / maxDim;

                    model.scale.setScalar(scale);
                    model.position.sub(center.multiplyScalar(scale));
                    // Sit on ground
                    const box2 = new THREE.Box3().setFromObject(model);
                    model.position.y -= box2.min.y;

                    model.traverse(n => {
                        if (n.isMesh) {
                            n.castShadow = true;
                            n.receiveShadow = true;
                        }
                    });

                    scene.add(model);

                    // Scale ring to model footprint
                    const footprint = Math.max(size.x, size.z) * scale * 1.4;
                    ring.scale.setScalar(footprint / 0.3);

                    // Adjust camera distance to model size
                    const dist = maxDim * scale * 2.6;
                    camera.position.set(0, dist * 0.5, dist);
                    controls.minDistance = dist * 0.3;
                    controls.maxDistance = dist * 6;

                    loaderEl.classList.add('hidden');
                },
                (xhr) => {
                    const pct = (xhr.loaded / (xhr.total || 1) * 100).toFixed(0);
                    loaderEl.querySelector('span').textContent = `Loading… ${pct}%`;
                },
                (err) => {
                    loaderEl.classList.add('hidden');
                    errorEl.style.display = 'flex';
                    errorEl.textContent = `Failed to load model:\n${err.message ?? err}`;
                    console.error(err);
                }
            );
        }

        // ── Pause auto-rotate when user interacts ────────────────────────────────
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        // ── Render loop ──────────────────────────────────────────────────────────
        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
