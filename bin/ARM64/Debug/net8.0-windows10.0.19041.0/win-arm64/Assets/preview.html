      }
      _resetRafId = requestAnimationFrame(tick);
    };

    function applyFk() {
      const targets = [FK_ROBOTS[fkTarget]];
      for (const robot of targets) {
        if (!robot) continue;
        robot.joints.forEach((joint, i) => {
          if (!joint) return;
          joint.quaternion.copy(joint.userData.restQ);
          let renderAngle = FK_ANGLES[i]; if (i === 1) renderAngle -= 33; if (i === 2) renderAngle += 75;
          joint.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(JOINT_AXES[i], THREE.MathUtils.degToRad(renderAngle)));
        });
      }
    }

    function buildFkSliders() {
      const container = document.getElementById('fk-sliders'); container.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const [mn, mx] = JOINT_LIMITS[i], sym = JOINT_SYMM[i];
        const row = document.createElement('div'); row.className = 'fk-axis-row';
        const lPct = Math.round((sym + mn) / (2 * sym) * 100), rPct = Math.round((sym + mx) / (2 * sym) * 100);
        const reachStyle = `background: linear-gradient(to right, rgba(85,153,255,0.07) 0%, rgba(85,153,255,0.07) ${lPct}%, rgba(85,153,255,0.22) ${lPct}%, rgba(85,153,255,0.22) ${rPct}%, rgba(85,153,255,0.07) ${rPct}%, rgba(85,153,255,0.07) 100%);`;
        row.innerHTML = `<span class="fk-axis-label">Axis ${i + 1}</span><div class="fk-slider-wrap"><input class="fk-slider" type="range" style="${reachStyle}" id="fk-s-${i}" min="-${sym}" max="${sym}" step="1" value="0" data-min="${mn}" data-max="${mx}" oninput="window.onFkSlider(${i}, this.value)"></div><span class="fk-val" id="fk-val-${i}">0°</span>`;
        container.appendChild(row);
      }
    }

    window.onFkSlider = function (idx, rawVal) {
      const val = Math.max(JOINT_LIMITS[idx][0], Math.min(JOINT_LIMITS[idx][1], parseFloat(rawVal)));
      FK_ANGLES[idx] = val; document.getElementById(`fk-val-${idx}`).textContent = Math.round(val) + '°'; applyFk();
    };

    // ── Real robot joint sync ─────────────────────────────────────────────────
    // Called by the WebSocket 'setRobotJoints' handler whenever the physical robot
    // sends a joint_states update via the Relay server.  Drives the 3D FK model
    // so it mirrors the real arm in real time.
    window.setRobotJoints = function (jsonStr, robotIdx) {
      try {
        const angles = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
        if (!Array.isArray(angles) || angles.length < 6) return;

        // Clamp to joint limits and store per-robot
        const clamped = angles.map((a, i) => Math.max(JOINT_LIMITS[i][0], Math.min(JOINT_LIMITS[i][1], a ?? 0)));
        FK_ANGLES_R[robotIdx] = clamped;

        // Also keep IK ghost angles in sync so they start from the real pose
        if (IK_ANGLES_R[robotIdx]) IK_ANGLES_R[robotIdx] = [...clamped];

        // Apply to the 3D model for this robot directly (works for both robots)
        const robot = FK_ROBOTS[robotIdx];
        if (robot) {
          robot.joints.forEach((joint, i) => {
            if (!joint) return;
            joint.quaternion.copy(joint.userData.restQ);
            let renderAngle = clamped[i];
            if (i === 1) renderAngle -= 33;
            if (i === 2) renderAngle += 75;
            joint.quaternion.multiply(
              new THREE.Quaternion().setFromAxisAngle(JOINT_AXES[i], THREE.MathUtils.degToRad(renderAngle))
            );
          });
        }

        // If this robot is selected in the panel, sync sliders too
        if (robotIdx === fkTarget) {
          for (let i = 0; i < 6; i++) FK_ANGLES[i] = clamped[i];
          syncSlidersFromAngles(clamped);
        }
      } catch (e) { console.warn('[setRobotJoints] parse error', e); }
    };


    // =========================================================================================
    // ── WebXR Mixed Reality (Safely Overlaid Without Breaking 2D Logic) ──────────────────────
    // =========================================================================================
    let _xrSession = null, _xrMode = null, _savedBg = null, _savedFog = null;

    // Attach controllers securely to the XR Rig so the player can be translated safely
    const _xrCtrls = [renderer.xr.getController(0), renderer.xr.getController(1)];
    const _xrGrips = [renderer.xr.getControllerGrip(0), renderer.xr.getControllerGrip(1)];
    xrRig.add(_xrCtrls[0], _xrCtrls[1], _xrGrips[0], _xrGrips[1]);

    const _ctrlModelFactory = new XRControllerModelFactory();
    _xrGrips[0].add(_ctrlModelFactory.createControllerModel(_xrGrips[0]));
    _xrGrips[1].add(_ctrlModelFactory.createControllerModel(_xrGrips[1]));

    // Controller ray pointer lines (visual targeting beam)
    const _rayGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)
    ]);
    const _rayMat = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.6, transparent: true });

    // VR FIX: Adding laser pointer trigger-dragging logic
    const _raycaster = new THREE.Raycaster();
    const _tempMatrix = new THREE.Matrix4();
    const _ctrlState = [{ attached: null, dist: 0 }, { attached: null, dist: 0 }];

    function onSelectStart(event) {
      const ctrl = event.target, idx = _xrCtrls.indexOf(ctrl);
      _tempMatrix.identity().extractRotation(ctrl.matrixWorld);
      _raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
      _raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_tempMatrix);

      // Prevent IK grabbing if pointing at the VR UI panel
      if (window._vrPanelGroup && _raycaster.intersectObjects(window._vrPanelGroup.children, true).length > 0) return;

      const hits = _raycaster.intersectObjects(IK_HANDLES, true);
      if (hits.length > 0) {
        let handle = hits[0].object;
        while (handle.parent && !IK_HANDLES.includes(handle)) handle = handle.parent;
        if (IK_HANDLES.includes(handle)) {
          const handleIdx = IK_HANDLES.indexOf(handle);
          if (!IK_ENABLED[handleIdx]) window.enableIk(handleIdx);
          _ctrlState[idx].attached = handle;
          _ctrlState[idx].dist = hits[0].distance;
          const r = ctrl.children.find(c => c.name === 'ctrl-ray');
          if (r) r.material.color.setHex(0x00ff00);
        }
      }
    }

    function onSelectEnd(event) {
      const ctrl = event.target, idx = _xrCtrls.indexOf(ctrl);
      if (_ctrlState[idx].attached) {
        const handleIdx = IK_HANDLES.indexOf(_ctrlState[idx].attached);
        // Correctly save local scene coordinates on release
        IK_TARGET_POS[handleIdx].copy(scene.worldToLocal(_ctrlState[idx].attached.getWorldPosition(new THREE.Vector3())));
        _ctrlState[idx].attached = null;
        const r = ctrl.children.find(c => c.name === 'ctrl-ray');
        if (r) r.material.color.setHex(0xffffff);
      }
    }

    _xrCtrls.forEach(ctrl => {
      const ray = new THREE.Line(_rayGeo, _rayMat.clone());
      ray.name = 'ctrl-ray'; ray.scale.z = 5;
      ctrl.add(ray);
      ctrl.addEventListener('selectstart', onSelectStart);
      ctrl.addEventListener('selectend', onSelectEnd);
    });

    // ── VR floating HTMLMesh panels – one per DOM panel ─────────
    // Each panel is independently grabbable with a single grip button.
    // Data tracked per VR panel:
    //   { domId, group (InteractiveGroup), mesh (HTMLMesh), grabbed: false, grabCtrl: null, grabOffset: Vector3 }
    const _vrPanels = [];
    window._vrPanelGroup = null; // kept for compat (points to first group)
    window._vrPanelMesh  = null; // kept for compat
    // Legacy gui null (lil-gui removed)
    let _vrGui = null;
    let _vrCtxStatusCtrl = null;
    let _vrVoiceStatusCtrl = null;

    // Config: which panels to show in VR and where to spawn them
    // EXACT SAME SCALE applied to all so physical 3D dimensions match the CSS precisely width-per-pixel!
    const VR_PANEL_CFG = [
      { domId: 'fk-panel',    pos: [-0.65, 1.35, -0.60], rotY:  Math.PI / 8,  scale: 0.82 },
      { domId: 'ctx-panel',   pos: [ 0.00, 1.35, -0.65], rotY:  0,            scale: 0.82 },
      { domId: 'voice-panel', pos: [ 0.65, 1.45, -0.60], rotY: -Math.PI / 8,  scale: 0.82 },
    ];

    function buildVrPanel() {
      if (_vrPanels.length > 0) return;
      document.body.classList.add('vr-mode');

      // CRITICAL: Force synchronous layout reflow so HTMLMesh gets the correct 
      // width/height bounds for drawing textures and UI hit-testing.
      // Failing to do this causes hit tests to miss and UI canvas to clip.
      void document.body.offsetHeight;

      VR_PANEL_CFG.forEach((cfg) => {
        const domEl = document.getElementById(cfg.domId);
        if (!domEl) return;

        // Keep the panel visible so an external 2D observer (second screen / mirror)
        // can read all state changes in real time. We let it keep pointer events
        // so HTMLMesh event dispatching doesn't fail internally in the browser.
        domEl.dataset.vrHidden = '1';

        // Ensure it isn't collapsed so the mesh looks full
        domEl.classList.remove('collapsed');

        const group = new InteractiveGroup();
        group.listenToPointerEvents(renderer, camera);
        group.listenToXRControllerEvents(_xrCtrls[0]);
        group.listenToXRControllerEvents(_xrCtrls[1]);
        xrRig.add(group);

        const mesh = new HTMLMesh(domEl);
        mesh.position.set(...cfg.pos);
        mesh.rotation.y = cfg.rotY;
        mesh.scale.setScalar(cfg.scale);
        mesh.userData.baseScale = mesh.scale.clone(); // MUST preserve to avoid matrix decomposition shrink bugs
        group.add(mesh);

        _vrPanels.push({ domId: cfg.domId, domEl, group, mesh, grabbed: false, grabCtrl: null, localOffsetMatrix: new THREE.Matrix4() });
      });

      // Convenience aliases for compat
      if (_vrPanels.length > 0) {
        window._vrPanelGroup = _vrPanels[0].group;
        window._vrPanelMesh  = _vrPanels[0].mesh;
      }

      // Hide IK ghost robots + target handles in VR — not needed in passthrough
      IK_GHOSTS.forEach(g => {
        if (g?.root) { g.root.userData._vrWasVisible = g.root.visible; g.root.visible = false; }
      });
      IK_HANDLES.forEach(h => {
        if (h) { h.userData._vrWasVisible = h.visible; h.visible = false; }
      });
    }

    function destroyVrPanel() {
      document.body.classList.remove('vr-mode');
      _vrPanels.forEach(vp => {
        vp.group.remove(vp.mesh);
        vp.mesh.material?.map?.dispose();
        vp.mesh.geometry?.dispose();
        xrRig.remove(vp.group);
        // Restore 2D panel
        if (vp.domEl && vp.domEl.dataset.vrHidden) {
          delete vp.domEl.dataset.vrHidden;
        }
      });
      _vrPanels.length = 0;
      window._vrPanelGroup = null;
      window._vrPanelMesh  = null;
      if (_vrGui) { _vrGui.destroy(); _vrGui = null; }

      // Restore IK visuals to their pre-VR state
      IK_GHOSTS.forEach(g => {
        if (g?.root) g.root.visible = g.root.userData._vrWasVisible ?? false;
      });
      IK_HANDLES.forEach(h => {
        if (h) h.visible = h.userData._vrWasVisible ?? false;
      });
    }

    // ── Hand tracking: OculusHandModel + OculusHandPointerModel ───────────
    const _xrHands = [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    const _handPtrs = [];
    xrRig.add(_xrHands[0], _xrHands[1]);

    _xrHands.forEach((hand, i) => {
      hand.add(new OculusHandModel(hand));
      const ptr = new OculusHandPointerModel(hand, _xrCtrls[i]);
      hand.add(ptr);
      _handPtrs.push(ptr);
    });

    // ── Single-grip: grab/move a VR panel ────────────────────────
    // Per-controller state for panel grabbing
    const _panelGrabState = [
      { panelIdx: -1 },
      { panelIdx: -1 }
    ];

    function _tryGrabPanel(ctrlIdx) {
      if (_vrPanels.length === 0) return false;
      const ctrl = _xrCtrls[ctrlIdx];
      _tempMatrix.identity().extractRotation(ctrl.matrixWorld);
      _raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
      _raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_tempMatrix);

      let bestDist = Infinity, bestIdx = -1;
      _vrPanels.forEach((vp, idx) => {
        const hits = _raycaster.intersectObject(vp.mesh, false);
        // Only allow grab on the top ~15-20% (header) of the panel (v > 0.82)
        if (hits.length > 0 && hits[0].distance < bestDist) { 
          if (hits[0].uv && hits[0].uv.y > 0.82) {
            bestDist = hits[0].distance; bestIdx = idx; 
          }
        }
      });

      if (bestIdx < 0) return false;

      const vp = _vrPanels[bestIdx];
      const gs = _panelGrabState[ctrlIdx];
      gs.panelIdx = bestIdx;
      
      // Rigid 6-DOF attach: compute panel's matrix in controller space
      const ctrlInv = new THREE.Matrix4().copy(ctrl.matrixWorld).invert();
      vp.localOffsetMatrix.multiplyMatrices(ctrlInv, vp.mesh.matrixWorld);

      vp.grabbed = true;
      vp.grabCtrl = ctrlIdx;
      return true;
    }

    function _releasePanel(ctrlIdx) {
      const gs = _panelGrabState[ctrlIdx];
      if (gs.panelIdx >= 0 && gs.panelIdx < _vrPanels.length) {
        _vrPanels[gs.panelIdx].grabbed = false;
        _vrPanels[gs.panelIdx].grabCtrl = null;
      }
      gs.panelIdx = -1;
    }

    function _tickPanelGrabs() {
      if (_vrPanels.length === 0) return;
      [0, 1].forEach(ctrlIdx => {
        const gs = _panelGrabState[ctrlIdx];
        if (gs.panelIdx < 0) return;
        const vp = _vrPanels[gs.panelIdx];
        const ctrl = _xrCtrls[ctrlIdx];

        // Apply controller matrix + local offset rigidly
        const newWorldMat = new THREE.Matrix4().multiplyMatrices(ctrl.matrixWorld, vp.localOffsetMatrix);
        const parentInv = new THREE.Matrix4().copy(vp.mesh.parent.matrixWorld).invert();
        const newLocalMat = new THREE.Matrix4().multiplyMatrices(parentInv, newWorldMat);
        newLocalMat.decompose(vp.mesh.position, vp.mesh.quaternion, new THREE.Vector3());
        vp.mesh.scale.copy(vp.mesh.userData.baseScale); // RESTORE SCALE rigidly!
      });
    }

    // ── Two-grip: translate + rotate + LIFT (squeeze both grips, no panel grabbed) ─
    const _gripState = [false, false];
    let _grabbing = false;
    const _grabStartMid = new THREE.Vector3();
    let _grabStartAngle = 0;
    let _grabStartMidY = 0;   // NEW: track vertical midpoint at grab start

    // VR FIX: We offset the user's Rig position instead of shifting the Scene
    const _grabRigPos = new THREE.Vector3();
    let _grabRigRot = 0;

    _xrCtrls.forEach((ctrl, i) => {
      ctrl.addEventListener('squeezestart', () => {
        _gripState[i] = true;

        // Single-grip: try to grab a VR panel first
        if (!_grabbing) {
          _tryGrabPanel(i);
        }

        // Two-grip: world navigation only if neither grip is panel-grabbing
        if (_gripState[0] && _gripState[1] &&
            _panelGrabState[0].panelIdx < 0 && _panelGrabState[1].panelIdx < 0) {
          const p0 = _xrGrips[0].position;
          const p1 = _xrGrips[1].position;
          _grabStartMid.addVectors(p0, p1).multiplyScalar(0.5);
          _grabStartAngle = Math.atan2(p1.x - p0.x, p1.z - p0.z);
          _grabStartMidY = _grabStartMid.y;  // capture Y for lift

          _grabRigPos.copy(xrRig.position);
          _grabRigRot = xrRig.rotation.y;
          _grabbing = true;
        }
      });
      ctrl.addEventListener('squeezeend', () => {
        _releasePanel(i);
        _gripState[i] = false;
        if (_grabbing) { _grabbing = false; }
      });
    });

    function tickWorldGrab() {
      if (!_grabbing || !_gripState[0] || !_gripState[1]) return;
      // Don't world-navigate while a panel is being grabbed
      if (_panelGrabState[0].panelIdx >= 0 || _panelGrabState[1].panelIdx >= 0) return;

      const p0 = _xrGrips[0].position;
      const p1 = _xrGrips[1].position;
      const currentMid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
      const currentAngle = Math.atan2(p1.x - p0.x, p1.z - p0.z);

      const angleDelta = currentAngle - _grabStartAngle;
      xrRig.rotation.y = _grabRigRot - angleDelta;

      const delta = currentMid.clone().sub(_grabStartMid);

      // Horizontal movement (XZ plane)
      const deltaXZ = new THREE.Vector3(delta.x, 0, delta.z);
      deltaXZ.applyAxisAngle(new THREE.Vector3(0, 1, 0), _grabRigRot);

      // Vertical lift: moving both grips up/down raises/lowers the virtual scene
      const deltaY = delta.y;

      // Moving the VR user in the opposite direction moves the scene
      xrRig.position.set(
        _grabRigPos.x - deltaXZ.x,
        _grabRigPos.y - deltaY,   // lift: rig goes down when grips go up (scene goes up)
        _grabRigPos.z - deltaXZ.z
      );
    }

    // ── Bimanual hand-tracking scene grab ─────────────────────────────────────
    // When both hands pinch simultaneously and NEITHER is dragging an IK handle,
    // treat the midpoint + angle between them as a two-grip world-nav gesture
    // (rotate, translate XZ, lift Y) — same physics as controller squeezestart /
    // tickWorldGrab but sourced from OculusHandPointerModel local space.
    const _handGrab = {
      active: false,
      startMid: new THREE.Vector3(),
      startAngle: 0,
      rigPos: new THREE.Vector3(),
      rigRot: 0,
    };

    function getPinchLocalPos(hp) {
      // hp.children[0] is pointerObject. Its pos is updated to pinch location.
      // Convert world pos to rig-local space to prevent feedback loops when rig moves
      const pointerTarget = hp.children.length > 0 ? hp.children[0] : hp;
      const wp = pointerTarget.getWorldPosition(new THREE.Vector3());
      return xrRig.worldToLocal(wp);
    }

    function tickHandSceneGrab() {
      if (!_xrSession || _handPtrs.length < 2) return;
      const [hp0, hp1] = _handPtrs;

      const h0Pinched = hp0.isPinched();
      const h1Pinched = hp1.isPinched();
      const h0IkBusy  = _pinchDrag[0].handleIdx >= 0;
      const h1IkBusy  = _pinchDrag[1].handleIdx >= 0;

      if (h0Pinched && h1Pinched && !h0IkBusy && !h1IkBusy) {
        const p0 = getPinchLocalPos(hp0);
        const p1 = getPinchLocalPos(hp1);
        if (isNaN(p0.x) || isNaN(p1.x)) return;

        if (!_handGrab.active) {
          // ── Grab start ────────────────────────────────────────────────────────
          _handGrab.active = true;
          _handGrab.startMid.addVectors(p0, p1).multiplyScalar(0.5);
          _handGrab.startAngle = Math.atan2(p1.x - p0.x, p1.z - p0.z);
          _handGrab.rigPos.copy(xrRig.position);
          _handGrab.rigRot = xrRig.rotation.y;
        } else {
          // ── Drag frame ────────────────────────────────────────────────────────
          const currentMid   = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
          const currentAngle = Math.atan2(p1.x - p0.x, p1.z - p0.z);
          const angleDelta   = currentAngle - _handGrab.startAngle;
          xrRig.rotation.y   = _handGrab.rigRot - angleDelta;

          const delta   = currentMid.clone().sub(_handGrab.startMid);
          const deltaXZ = new THREE.Vector3(delta.x, 0, delta.z)
            .applyAxisAngle(new THREE.Vector3(0, 1, 0), _handGrab.rigRot);
          // Lift: moving both hands up raises the scene (rig goes down)
          xrRig.position.set(
            _handGrab.rigPos.x - deltaXZ.x,
            _handGrab.rigPos.y - delta.y,
            _handGrab.rigPos.z - deltaXZ.z
          );
        }
      } else {
        _handGrab.active = false; // release when either hand opens or goes to IK
      }
    }

    // ── VR Pinch IK Dragging — offset-based, NO re-parenting ──────────────
    // Root cause of fly-away: the old code called `children[0].attach(handle)`
    // which re-parents the IK sphere to an internal child of OculusHandPointerModel.
    // When hand tracking loses confidence, that child matrix goes NaN/infinite
    // and the sphere teleports away, feeding garbage into the IK solver.
    //
    // New approach: never re-parent anything.  On pinch-start we record the
    // world-space offset (handlePos – pointerPos) and each frame we compute
    // the new handle world position as (currentPointerPos + offset), validate
    // it, clamp it, and write directly to IK_TARGET_POS.  Clean and robust.

    // Per hand-pointer drag state (indexed by hand)
    const _pinchDrag = _handPtrs.map(() => ({
      handleIdx: -1,
      panelIdx: -1,
      grabOffset: new THREE.Vector3()
    }));

    // Helper to get exact pinch point rather than the wrist
    function getPinchWorldPos(hp) {
      const target = hp.children.length > 0 ? hp.children[0] : hp;
      return target.getWorldPosition(new THREE.Vector3());
    }

    function tickVrIk() {
      if (!_xrSession) return;
      IK_HANDLES.forEach(h => h.scale.setScalar(1.0)); // hover-size reset

      // ── Controller ray-cast dragging (unchanged) ──────────────────────────
      _xrCtrls.forEach((ctrl, idx) => {
        if (_ctrlState[idx].attached) {
          _ctrlState[idx].attached.scale.setScalar(1.2);
          const handleIdx = IK_HANDLES.indexOf(_ctrlState[idx].attached);

          _tempMatrix.identity().extractRotation(ctrl.matrixWorld);
          const dir = new THREE.Vector3(0, 0, -1).applyMatrix4(_tempMatrix);
          const wp = new THREE.Vector3().setFromMatrixPosition(ctrl.matrixWorld);
          wp.add(dir.multiplyScalar(_ctrlState[idx].dist));

          _ctrlState[idx].attached.position.copy(scene.worldToLocal(wp.clone()));
          IK_TARGET_POS[handleIdx].copy(_ctrlState[idx].attached.position);
        }
      });

      // ── Hand pointer update + offset-based pinch dragging ─────────────────
      _handPtrs.forEach((hp, hpIdx) => {
        if (typeof hp.update === 'function') hp.update();

        const drag = _pinchDrag[hpIdx];

        if (hp.isPinched()) {
          if (drag.handleIdx < 0 && drag.panelIdx < 0) {
            // ── Grab start: find closest visible IK handle OR VR Panel ────────────────
            const pointerWp = getPinchWorldPos(hp);
            if (isNaN(pointerWp.x)) return;

            let bestDist = Infinity, bestIdx = -1;
            IK_HANDLES.forEach((handle, idx) => {
              if (!handle.visible) return;
              const hits = hp.intersectObject(handle, true);
              if (hits && hits.length > 0 && hits[0].distance < bestDist) {
                bestDist = hits[0].distance; bestIdx = idx;
              }
            });

            if (bestIdx >= 0) {
              if (!IK_ENABLED[bestIdx]) window.enableIk(bestIdx);
              const handleWp = IK_HANDLES[bestIdx].getWorldPosition(new THREE.Vector3());
              drag.grabOffset.subVectors(handleWp, pointerWp);
              drag.handleIdx = bestIdx;
            } else {
              // Try grabbing a VR Panel if no IK handle hit
              let bestPnlDist = Infinity, bestPnlIdx = -1;
              _vrPanels.forEach((vp, idx) => {
                const hits = hp.intersectObject(vp.mesh, false);
                if (hits && hits.length > 0 && hits[0].distance < bestPnlDist) {
                  // Hand grab: Only header area (uv.y > 0.82) to avoid grabbing when tapping buttons!
                  if (hits[0].uv && hits[0].uv.y > 0.82) {
                    bestPnlDist = hits[0].distance; bestPnlIdx = idx;
                  }
                }
              });
              if (bestPnlIdx >= 0) {
                const vp = _vrPanels[bestPnlIdx];
                drag.panelIdx = bestPnlIdx;
                
                // Get rigid lock relative to pinch pointer tip (6-DOF)
                const pObj = hp.children.length > 0 ? hp.children[0] : hp;
                const pObjInv = new THREE.Matrix4().copy(pObj.matrixWorld).invert();
                vp.localOffsetMatrix.multiplyMatrices(pObjInv, vp.mesh.matrixWorld);
                vp.grabbed = true;
              }
            }
          } else if (drag.handleIdx >= 0) {
            // ── Drag frame: follow pointer + stored offset (IK Handle) ────────────────
            const pointerWp = getPinchWorldPos(hp);
            if (isNaN(pointerWp.x) || pointerWp.length() > 8) return;

            const newHandleWp = pointerWp.clone().add(drag.grabOffset);
            const localPos = scene.worldToLocal(newHandleWp);
            localPos.x = Math.max(-1.5, Math.min(1.5, localPos.x));
            localPos.y = Math.max(-0.1, Math.min(1.5, localPos.y));
            localPos.z = Math.max(-1.5, Math.min(1.5, localPos.z));

            IK_HANDLES[drag.handleIdx].position.copy(localPos);
            IK_TARGET_POS[drag.handleIdx].copy(localPos);
            IK_HANDLES[drag.handleIdx].scale.setScalar(1.2);

            const handleWp2 = IK_HANDLES[drag.handleIdx].getWorldPosition(new THREE.Vector3());
            hp.setCursor(pointerWp.distanceTo(handleWp2));
          } else if (drag.panelIdx >= 0) {
            // ── Drag frame: VR Panel Hand Grab ────────────────
            const vp = _vrPanels[drag.panelIdx];
            const pObj = hp.children.length > 0 ? hp.children[0] : hp;
            if (isNaN(pObj.matrixWorld.elements[0])) return;

            const newWorldMat = new THREE.Matrix4().multiplyMatrices(pObj.matrixWorld, vp.localOffsetMatrix);
            const parentInv = new THREE.Matrix4().copy(vp.mesh.parent.matrixWorld).invert();
            const newLocalMat = new THREE.Matrix4().multiplyMatrices(parentInv, newWorldMat);
            
            newLocalMat.decompose(vp.mesh.position, vp.mesh.quaternion, new THREE.Vector3());
            vp.mesh.scale.copy(vp.mesh.userData.baseScale); // RESTORE SCALE rigidly!
            hp.setCursor(0.01);
          }
        } else {
          // ── Release ───────────────────────────────────────────────────────
          if (drag.handleIdx >= 0) {
            IK_HANDLES[drag.handleIdx].scale.setScalar(1.0);
            drag.handleIdx = -1;
          }
          if (drag.panelIdx >= 0) {
            if (_vrPanels[drag.panelIdx]) _vrPanels[drag.panelIdx].grabbed = false;
            drag.panelIdx = -1;
          }
          hp.setCursor(1.5);
        }

        // Highlight hovered handles even when not dragging
        if (!hp.isPinched() && drag.handleIdx < 0 && drag.panelIdx < 0) {
          IK_HANDLES.forEach((handle, idx) => {
            const hits = hp.intersectObject(handle, true);
            if (hits && hits.length > 0 && hits[0].distance < 2.0) {
              handle.scale.setScalar(1.15);
              hp.setCursor(hits[0].distance);
            }
          });
        }
      });
    }

    function showXrToast(msg, ms) {
      const t = document.getElementById('xr-toast'); if (!t) return;
      t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), ms || 6000);
    }

    window.toggleVR = async function () {
      if (_xrSession) { await _xrSession.end(); return; }
      if (!window.isSecureContext) { showXrToast('WebXR needs HTTPS.'); return; }
      if (!navigator.xr) { showXrToast('navigator.xr not available.'); return; }

      const arOk = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      const vrOk = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
      if (!arOk && !vrOk) { showXrToast('Neither AR nor VR is supported on this device.'); return; }
      _xrMode = arOk ? 'immersive-ar' : 'immersive-vr';

      try {
        const session = await navigator.xr.requestSession(_xrMode, {
          optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'],
        });
        _xrSession = session;

        const btn = document.getElementById('sb-vr-btn');
        const icon = document.getElementById('sb-vr-icon');
        const lbl = document.getElementById('sb-vr-label');
        if (btn) btn.classList.add('active');
        if (icon) icon.textContent = '⏹️';
        if (lbl) lbl.textContent = arOk ? '\u00a0Exit MR' : '\u00a0Exit VR';

        _savedBg = scene.background; _savedFog = scene.fog;
        if (_xrMode === 'immersive-ar') { scene.background = null; scene.fog = null; renderer.setClearColor(0x000000, 0); }

        renderer.shadowMap.enabled = false;
        renderer.toneMapping = THREE.NoToneMapping;
        scene.scale.setScalar(1);
        renderer.xr.setFramebufferScaleFactor(1.8); // 80% higher resolution in headset
        await renderer.xr.setSession(session);
        renderer.xr.setReferenceSpaceType('local-floor');

        // Force panel layout recalculation to remove cutting/max-height issues
        if (window.renderObjects) setTimeout(() => renderCtxPhotos(window._lastSceneItems || []), 100);

        // VR FIX: Spawns the user safely 0.8m backward from the table, preserving global Scene coordinates
        xrRig.position.set(TABLE_CX, 0, TABLE_CZ + 0.8);
        xrRig.rotation.set(0, 0, 0);

        buildVrPanel();

        session.addEventListener('end', () => {
          _xrSession = null;
          destroyVrPanel();
          renderer.shadowMap.enabled = false;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          scene.background = _savedBg || new THREE.Color(0x0a0a0c);
          scene.fog = _savedFog || null;

          xrRig.position.set(0, 0, 0); xrRig.rotation.set(0, 0, 0); // Restore original 2D layout framing

          renderer.setClearColor(0x000000, 1);
          _gripState[0] = _gripState[1] = false; _grabbing = false;
          if (btn) btn.classList.remove('active');
          if (icon) icon.textContent = '🥽';
          if (lbl) lbl.textContent = arOk ? '\u00a0Enter MR' : '\u00a0Enter VR';
        });
      } catch (err) { showXrToast('XR failed: ' + (err.message || err)); }
    };

    (async () => {
      const btn = document.getElementById('sb-vr-btn'), lbl = document.getElementById('sb-vr-label');
      if (!navigator.xr) { if (btn) { btn.classList.add('unsupported'); btn.title = 'WebXR not available'; } return; }
      const arOk = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      const vrOk = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
      if (!arOk && !vrOk && btn) { btn.classList.add('unsupported'); btn.title = 'XR not supported — HTTPS required?'; }
      else if (lbl) lbl.textContent = arOk ? '\u00a0Enter MR' : '\u00a0Enter VR';
    })();

    // ── Render loop ──
    let _xrFrameCount = 0;
    // IK perf: track last solved handle position to skip idle frames
    const _ikLastSolvedPos = [new THREE.Vector3(Infinity, 0, 0), new THREE.Vector3(Infinity, 0, 0)];
    const IK_MOVE_THRESH = 0.001; // 1 mm — skip solve if handle hasn't moved more than this

    renderer.setAnimationLoop(() => {
      if (_xrSession) {
        renderer.xr.updateCamera(camera);
        tickWorldGrab();
        tickHandSceneGrab();   // bimanual hand-tracking scene rotate/lift/translate
        _tickPanelGrabs();
        tickVrIk();
      }

      // Adaptive HTMLMesh refresh: faster when IK is dragging (every 3 frames),
      // slower at rest (every 9 frames) to save GPU bandwidth.
      const _ikAnyActive = _xrSession && (IK_ENABLED[0] || IK_ENABLED[1]);
      const _vrRefreshEvery = _ikAnyActive ? 3 : 9;
      if (_xrSession && _xrFrameCount % _vrRefreshEvery === 0) {
        _vrPanels.forEach(vp => {
          if (vp.mesh && vp.mesh.material.map) vp.mesh.material.map.update();
        });
        if (window._vrPanelMesh && window._vrPanelMesh.material.map) window._vrPanelMesh.material.map.update();
      }

      // Sync IK angles → FK sliders so the 2D panel mirrors what VR is commanding.
      // Runs every 6 frames — cheap enough to not impact performance.
      if (_xrFrameCount % 6 === 0) {
        for (let i = 0; i < 2; i++) {
          if (IK_ENABLED[i] && IK_ANGLES_R[i]) {
            FK_ANGLES_R[i] = [...IK_ANGLES_R[i]];
            if (fkTarget === i) {
              for (let j = 0; j < 6; j++) FK_ANGLES[j] = IK_ANGLES_R[i][j];
              syncSlidersFromAngles(IK_ANGLES_R[i]);
            }
          }
        }
      }
      _xrFrameCount++;

      for (let i = 0; i < 2; i++) {
        if (!IK_ENABLED[i]) continue;
        // IK visuals are hidden in VR — skip solving entirely
        if (_xrSession) continue;

        // ── Perf: in VR only solve every 2 frames (36 Hz vs 72 Hz) ──
        if (_xrSession && (_xrFrameCount & 1)) continue;

        // ── Perf: skip if handle hasn't moved ──
        const handlePos = IK_HANDLES[i]?.position;
        if (handlePos && _ikLastSolvedPos[i].distanceTo(handlePos) < IK_MOVE_THRESH) continue;
        if (handlePos) _ikLastSolvedPos[i].copy(handlePos);

        if (window.solveIkStep) window.solveIkStep(i);
        if (window._ikSendContinuous) window._ikSendContinuous(i);
      }
      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Remote WebSocket client (100% UNTOUCHED) ──────────────
    (function initRemoteWS() {
      const badge = document.getElementById('ws-badge'), label = document.getElementById('ws-label');
      const latEl = document.getElementById('ws-latency');
      // Determine the hub host: inside the WebView2 (app.local / blank) use localhost:8181,
      // otherwise use the page's own origin (LAN IP, Cloudflare tunnel, etc.)
      const isLocalApp = location.hostname === 'app.local' || location.hostname === '';
      const hubOrigin = isLocalApp ? 'http://localhost:8181' : location.origin;
      const hubHost   = isLocalApp ? 'localhost:8181'        : location.host;
      const wsProtoBase = isLocalApp ? 'ws' : (location.protocol === 'https:' ? 'wss' : 'ws');
      if (badge) badge.style.display = '';

      let retryDelay = 1500, ws = null;
      let _pingTs = 0, _pingInterval = null;
      const _rttHistory = [];

      // ── Ping / RTT measurement ─────────────────────────────────────────────
      function startPing() {
        if (_pingInterval) clearInterval(_pingInterval);
        // 1 Hz ping — keeps RTT display fresh and catches degradation quickly
        _pingInterval = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            _pingTs = Date.now();
            ws.send(JSON.stringify({ type: 'ping', payload: _pingTs }));
          }
        }, 1000);
        // Fire first ping immediately after connection
        if (ws && ws.readyState === WebSocket.OPEN) {
          _pingTs = Date.now();
          ws.send(JSON.stringify({ type: 'ping', payload: _pingTs }));
        }
      }

      function stopPing() {
        if (_pingInterval) { clearInterval(_pingInterval); _pingInterval = null; }
        if (latEl) { latEl.style.display = 'none'; latEl.textContent = ''; }
      }

      function onPong(sentTs) {
        const rtt = Date.now() - sentTs;
        _rttHistory.push(rtt);
        // Keep only last 3 samples — stale readings age out in 3 s instead of 25 s
        if (_rttHistory.length > 3) _rttHistory.shift();
        const avg = Math.round(_rttHistory.reduce((a, b) => a + b, 0) / _rttHistory.length);
        if (latEl) {
          latEl.style.display = '';
          latEl.textContent = `${avg} ms`;
          latEl.className = avg < 80 ? 'lat-good' : avg < 150 ? 'lat-warn' : 'lat-bad';
        }
      }

      async function connect() {
        if (label) label.textContent = 'Connecting…'; if (badge) badge.classList.remove('live', 'error');

        // ── Connect directly — skip the HTTP pre-check which added 50-150 ms overhead.
        // If the WS handshake fails (onerror/onclose), we retry with back-off as before.
        ws = new WebSocket(`${wsProtoBase}://${hubHost}/scene3d-ws`); window._remoteWs = ws;

        ws.onopen = () => {
          retryDelay = 1500;
          if (badge) badge.classList.add('live');
          if (label) label.textContent = 'Live';
          startPing();
        };

        ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            switch (msg.type) {
              case 'pong': {
                // msg.payload is the timestamp we sent
                const sentTs = typeof msg.payload === 'number' ? msg.payload : parseInt(msg.payload, 10);
                if (sentTs > 0) onPong(sentTs);
                break;
              }
              case 'setCameraPose': if (window.setCameraPose) window.setCameraPose(JSON.stringify(msg.payload)); break;
              case 'setDetectedObjects': if (window.setDetectedObjects) window.setDetectedObjects(JSON.stringify(msg.payload)); break;
              case 'updateCameraFeed': if (window.updateCameraFeed) window.updateCameraFeed(msg.payload); break;
              case 'setGen3DProgress': {
                if (window.setGen3DProgress) window.setGen3DProgress(JSON.stringify(msg.payload));
                break;
              }
              case 'setModelGlb': {
                const { label: glbLabel, glbUrl } = msg.payload;
                const absUrl = glbUrl.startsWith('http') ? glbUrl : `${hubOrigin}${glbUrl.startsWith('/') ? '' : '/'}${glbUrl}`;
                console.log('[setModelGlb] Loading GLB from:', absUrl);
                if (window.setModelGlb) window.setModelGlb(JSON.stringify({ label: glbLabel, glbUrl: absUrl }));
                break;
              }
              case 'setBananaImage': {
                const { label: lbl, imageUrl } = msg.payload;
                const absImgUrl = imageUrl.startsWith('http') ? imageUrl : `${hubOrigin}${imageUrl.startsWith('/') ? '' : '/'}${imageUrl}`;
                document.querySelectorAll('.ctx-photo-card').forEach(card => {
                  if (card.querySelector('.ctx-photo-label')?.textContent === lbl) {
                    const img = card.querySelector('img');
                    if (img) { img.src = absImgUrl; img.title = '🍌 Banana enhanced'; }
                  }
                });
                break;
              }
              case 'refreshLibrary': {
                if (window.loadLibrary) window.loadLibrary();
                break;
              }
              case 'setRobotJoints': {
                const { angles, robotIdx } = msg.payload;
                if (Array.isArray(angles) && window.setRobotJoints) {
                  window.setRobotJoints(JSON.stringify(angles), robotIdx ?? 0);
                  const panel = document.getElementById('fk-panel');
                  if (panel && panel.classList.contains('collapsed') && angles.some(a => Math.abs(a) > 0.5)) panel.classList.remove('collapsed');
                }
                break;
              }
              case 'voiceTranscription': {
                const text = typeof msg.payload === 'string' ? msg.payload : JSON.stringify(msg.payload);
                const voiceOut = document.getElementById('voice-output'), voiceStatus = document.getElementById('voice-status');
                const alreadyComplete = voiceStatus && voiceStatus.textContent === 'Transcription complete';
                if (voiceOut && !alreadyComplete) { voiceOut.textContent = text; voiceOut.classList.add('has-text'); }
                if (voiceStatus && !alreadyComplete) { voiceStatus.textContent = 'Transcription received'; voiceStatus.className = 'success'; }
                document.getElementById('voice-panel')?.classList.remove('collapsed');
                break;
              }
              case 'glbData': {
                // Server sent the GLB binary as base64 — decode, create Blob URL, cache & re-render
                const { label: glbLabel, data: b64 } = msg.payload;
                try {
                  const binary = atob(b64);
                  const bytes  = new Uint8Array(binary.length);
                  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                  const blob = new Blob([bytes], { type: 'model/gltf-binary' });
                  // Keep the OLD blob URL alive until we've confirmed the new one works
                  // (revoking immediately caused ERR_FILE_NOT_FOUND on in-flight retries)
                  const oldBlobUrl = window._wsGlbCache[glbLabel];
                  const newBlobUrl = URL.createObjectURL(blob);
                  window._wsGlbCache[glbLabel] = newBlobUrl;
                  // Revoke old URL after a brief delay so any ongoing retries can finish
                  if (oldBlobUrl) setTimeout(() => URL.revokeObjectURL(oldBlobUrl), 5000);
                  console.log(`[GLB-WS] ✅ Received '${glbLabel}' (${Math.round(binary.length / 1024)} KB) via WebSocket`);
                  // Re-render: replaces the sphere placeholder with the real model
                  if (window._lastSceneItems && window._lastSceneItems.length > 0) {
                    if (window.renderObjects) renderObjects(window._lastSceneItems);
                  }
                } catch (e) { console.error('[GLB-WS] glbData decode error', e); }
                break;
              }
            }
          } catch (e) { console.warn('WS parse error', e); }
        };

        ws.onerror = () => { if (badge) badge.classList.remove('live', 'error'); if (badge) badge.classList.add('error'); if (label) label.textContent = 'Error'; stopPing(); };
        ws.onclose = () => { if (badge) badge.classList.remove('live'); if (label) label.textContent = 'Reconnecting…'; stopPing(); setTimeout(connect, retryDelay); retryDelay = Math.min(retryDelay * 1.5, 15000); };
      }
      connect();
    })();

    // ── Voice-to-Text Panel (100% UNTOUCHED) ───────────────────────────────────────────────────
    (function initVoicePanel() {
      let _mediaRecorder = null, _audioChunks = [], _isRecording = false;
      const pttBtn = document.getElementById('ptt-btn'), pttLabel = document.getElementById('ptt-label'), voiceOutput = document.getElementById('voice-output'), voiceStatus = document.getElementById('voice-status');

      window.toggleVoicePanel = function () {
        const p = document.getElementById('voice-panel'); if (p && p.dataset.dragged !== 'true') p.classList.toggle('collapsed');
      };

      // Toggle record on click or spacebar
      window.toggleRecord = async function (e) { if (e && e.preventDefault) e.preventDefault(); if (_isRecording) { stopRecording(); } else { await startRecording(); } };

      // Legacy hold-API kept as no-op aliases (VR or external code may still call them)
      window.startHoldRecord = async function (e) { if (e && e.preventDefault) e.preventDefault(); if (_isRecording) return; await startRecording(); };
      window.stopHoldRecord = function (e) { if (e && e.preventDefault) e.preventDefault(); if (!_isRecording) return; stopRecording(); };

      // ── Spacebar shortcut ──────────────────────────────────────────────────
      let _spaceActive = false; // guard against key-repeat
      document.addEventListener('keydown', function (e) {
        if (e.code !== 'Space') return;
        // Don't steal space from text inputs
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        e.preventDefault();
        if (_spaceActive) return; // ignore key-repeat
        _spaceActive = true;
        if (!_isRecording) startRecording();
      });
      document.addEventListener('keyup', function (e) {
        if (e.code !== 'Space') return;
        _spaceActive = false;
        if (_isRecording) stopRecording();
      });
      // ────────────────────────────────────────────────────────────────────────

      async function startRecording() {
        try {
          const micSelect = document.getElementById('mic-select'), deviceId = micSelect ? micSelect.value : '';
          const stream = await navigator.mediaDevices.getUserMedia({ audio: deviceId ? { deviceId: { exact: deviceId } } : true, video: false });
          const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
          _mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
          _audioChunks = []; _isRecording = true;
          _mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) _audioChunks.push(e.data); };
          _mediaRecorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); uploadAudio(); };
          _mediaRecorder.start();
          pttBtn.classList.add('recording'); pttLabel.textContent = 'Recording… (Space or click to stop)'; setStatus('Recording — press Space or click to stop', '');
        } catch (err) { setStatus('Microphone access denied: ' + err.message, 'error'); _isRecording = false; }
      }

      function stopRecording() {
        if (_mediaRecorder && _mediaRecorder.state !== 'inactive') _mediaRecorder.stop();
        _isRecording = false; pttBtn.classList.remove('recording'); pttBtn.classList.add('loading'); pttLabel.textContent = 'Processing…'; setStatus('Sending to Whisper…', '');
      }

      async function uploadAudio() {
        if (_audioChunks.length === 0) { resetBtn(); setStatus('No audio captured.', 'error'); return; }
        const blob = new Blob(_audioChunks, { type: _mediaRecorder.mimeType || 'audio/webm' }), formData = new FormData(); formData.append('file', blob, 'voice.webm');
        const baseUrl = (location.hostname === 'app.local' || location.hostname === '') ? 'http://localhost:8181' : `${location.protocol}//${location.host}`;
        try {
          const resp = await fetch(`${baseUrl}/transcribe`, { method: 'POST', body: formData });
          if (!resp.ok) {
            const raw = await resp.text();
            // Strip HTML tags so a Cloudflare error page doesn't flood the UI
            const plain = raw.replace(/<[^>]+>/g, ' ').replace(/\s{2,}/g, ' ').trim().slice(0, 120);
            setStatus(`Error ${resp.status}${plain ? ': ' + plain : ''}`, 'error');
          }
          else {
            const data = await resp.json(), text = data.text || '';
            if (text.trim()) { voiceOutput.textContent = text.trim(); voiceOutput.classList.add('has-text'); setStatus('Transcription complete', 'success'); if (window.sendCommandToHost) window.sendCommandToHost('voiceTranscription', text.trim()); }
            else { setStatus('No speech detected.', 'error'); }
          }
        } catch (err) { setStatus('Network error: ' + err.message, 'error'); } finally { resetBtn(); }
      }

      function setStatus(msg, cls) { if (voiceStatus) { voiceStatus.textContent = msg; voiceStatus.className = cls ? `${cls}` : ''; } }
      function resetBtn() { pttBtn.classList.remove('loading', 'recording'); pttLabel.textContent = 'Press Space to Record'; _isRecording = false; }

      setTimeout(async () => {
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true }); tempStream.getTracks().forEach(t => t.stop());
          const devices = await navigator.mediaDevices.enumerateDevices(), select = document.getElementById('mic-select');
          if (select) {
            select.innerHTML = '<option value="">Default Microphone</option>';
            devices.filter(d => d.kind === 'audioinput').forEach(device => {
              const option = document.createElement('option'); option.value = device.deviceId; option.text = device.label || `Microphone ${select.options.length}`; select.appendChild(option);
            });
            const intelOption = Array.from(select.options).find(o => o.text.toLowerCase().includes('intel')); if (intelOption) select.value = intelOption.value;
          }
        } catch (e) { console.error("Failed to list microphones", e); }
      }, 1000);
    })();
  </script>
