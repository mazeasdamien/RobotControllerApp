<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Camera Calibration — Remote Assist Hub</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0a0d;
      --card:    #12131a;
      --border:  rgba(255,255,255,0.08);
      --primary: #00e5ff;
      --green:   #00cc6a;
      --red:     #ff4444;
      --text:    #e0e0e0;
      --muted:   #666;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif;
           display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Header ── */
    header { display:flex; align-items:center; gap:12px; padding:10px 20px;
             background:var(--card); border-bottom:1px solid var(--border); flex-shrink:0; }
    header h1 { font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--primary); }
    #cam-badge { font-size:11px; background:rgba(0,229,255,.1); border:1px solid rgba(0,229,255,.25);
                 border-radius:5px; padding:3px 10px; color:var(--primary); }
    #status-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
    #status-dot.connected { background:var(--green); }
    #status-dot.error     { background:var(--red); }
    #status-text { font-size:11px; color:var(--muted); }
    #freeze-btn  { margin-left:auto; padding:6px 18px; border:none; border-radius:6px; cursor:pointer;
                   font-size:12px; font-weight:600; background:#1a3a4a; color:var(--primary);
                   border:1px solid rgba(0,229,255,.3); transition:background .2s; }
    #freeze-btn:hover  { background:#1f4c63; }
    #freeze-btn.frozen { background:rgba(0,204,106,.15); color:var(--green); border-color:rgba(0,204,106,.4); }

    /* ── Main split ── */
    main { display:flex; flex:1; gap:0; overflow:hidden; }

    /* Left: camera feed */
    .cam-panel { display:flex; flex-direction:column; width:480px; flex-shrink:0;
                 border-right:1px solid var(--border); background:var(--card); }
    .panel-header { padding:8px 14px; font-size:10px; font-weight:700; letter-spacing:.1em;
                    color:var(--muted); border-bottom:1px solid var(--border); text-transform:uppercase; }
    #cam-feed-wrap { flex:1; display:flex; align-items:center; justify-content:center;
                     background:#050507; overflow:hidden; position:relative; }
    #cam-img { width:100%; height:100%; object-fit:contain; display:block; }
    #no-feed  { position:absolute; text-align:center; color:var(--muted); font-size:12px;
                pointer-events:none; }
    #no-feed span { display:block; font-size:28px; margin-bottom:8px; }

    /* Pose info panel below feed */
    .pose-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px;
                 background:var(--border); border-top:1px solid var(--border); }
    .pose-cell { background:var(--card); padding:8px 12px; }
    .pose-cell label { display:block; font-size:9px; color:var(--muted); letter-spacing:.08em; margin-bottom:2px; }
    .pose-cell span  { font-size:13px; font-weight:600; font-family:Consolas,monospace; color:var(--primary); }
    #detect-row { padding:8px 14px; font-size:11px; border-top:1px solid var(--border);
                  display:flex; align-items:center; gap:8px; }
    #detect-icon { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
    #detect-icon.ok  { background:var(--green); }
    #detect-icon.bad { background:var(--red); }
    #detect-msg { color:var(--muted); font-size:11px; }

    /* Right: Three.js */
    .threejs-panel { flex:1; position:relative; overflow:hidden; }
    #threejs-canvas { width:100%; height:100%; display:block; }

    /* Overlay legend */
    #legend { position:absolute; top:12px; right:14px; background:rgba(10,10,13,.8);
              border:1px solid var(--border); border-radius:6px; padding:8px 12px;
              font-size:10px; line-height:1.8; }
    .leg { display:flex; align-items:center; gap:6px; }
    .leg-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }

    /* Camera label tag */
    #cam-tag { position:absolute; bottom:14px; left:14px;
               background:rgba(0,229,255,.1); border:1px solid rgba(0,229,255,.25);
               border-radius:5px; padding:4px 10px; font-size:10px; color:var(--primary); }
  </style>
</head>
<body>

<header>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2">
    <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
  </svg>
  <h1>CAMERA CALIBRATION</h1>
  <div id="cam-badge">—</div>
  <div id="status-dot"></div>
  <span id="status-text">Connecting…</span>
  <button id="freeze-btn" onclick="sendFreeze()">❄ Freeze &amp; Save</button>
</header>

<main>
  <!-- Left: camera feed + pose -->
  <div class="cam-panel">
    <div class="panel-header">Live Camera — ArUco Overlay</div>
    <div id="cam-feed-wrap">
      <img id="cam-img" style="display:none"/>
      <div id="no-feed"><span>📷</span>Waiting for camera feed…</div>
    </div>
    <div id="detect-row">
      <div id="detect-icon"></div>
      <span id="detect-msg">No pose detected</span>
    </div>
    <div class="pose-grid">
      <div class="pose-cell"><label>X (m)</label><span id="px">—</span></div>
      <div class="pose-cell"><label>Y (m)</label><span id="py">—</span></div>
      <div class="pose-cell"><label>Z / Height (m)</label><span id="pz">—</span></div>
      <div class="pose-cell"><label>Rx (rad)</label><span id="rx">—</span></div>
      <div class="pose-cell"><label>Ry (rad)</label><span id="ry">—</span></div>
      <div class="pose-cell"><label>Rz (rad)</label><span id="rz">—</span></div>
    </div>
  </div>

  <!-- Right: Three.js 3D view -->
  <div class="threejs-panel">
    <canvas id="threejs-canvas"></canvas>
    <div id="legend">
      <div class="leg"><div class="leg-dot" style="background:#00e5ff"></div> Camera frustum</div>
      <div class="leg"><div class="leg-dot" style="background:#00cc6a"></div> Workspace grid</div>
      <div class="leg"><div class="leg-dot" style="background:#ff8800"></div> ArUco markers</div>
      <div class="leg"><div class="leg-dot" style="background:#888"></div> Robot base</div>
    </div>
    <div id="cam-tag">3D Workspace View</div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── URL params ──────────────────────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const camName = params.get('cam') || 'Camera';
document.getElementById('cam-badge').textContent = camName;
document.getElementById('cam-tag').textContent   =
  camName.toLowerCase().includes('intel') ? '3D View — Intel RealSense (behind robots)'
                                          : '3D View — Creative GestureCam';
document.title = `Calibration — ${camName}`;

// ── WebSocket ────────────────────────────────────────────────────────────────
const WS_URL = `ws://${location.hostname}:8181/scene3d-ws`;
let ws;

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setStatus('connected', 'Connected');
  };

  ws.onclose = () => {
    setStatus('', 'Reconnecting…');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => setStatus('error', 'Connection error');

  ws.onmessage = (ev) => {
    let env;
    try { env = JSON.parse(ev.data); } catch { return; }
    if (env.type === 'calibFrame' || env.type === 'updateCameraFeed') {
      const dataUrl = typeof env.payload === 'string'
        ? (env.payload.startsWith('"') ? JSON.parse(env.payload) : env.payload)
        : env.payload;
      showFrame(dataUrl);
    } else if (env.type === 'setCameraPose') {
      try {
        const p = typeof env.payload === 'string' ? JSON.parse(env.payload) : env.payload;
        updatePose(p);
      } catch {}
    }
  };
}
connect();

function setStatus(cls, txt) {
  const dot = document.getElementById('status-dot');
  dot.className = cls;
  document.getElementById('status-text').textContent = txt;
}

// ── Camera feed ──────────────────────────────────────────────────────────────
const camImg  = document.getElementById('cam-img');
const noFeed  = document.getElementById('no-feed');
let feedActive = false;

function showFrame(dataUrl) {
  if (!feedActive) { feedActive = true; camImg.style.display = 'block'; noFeed.style.display = 'none'; }
  camImg.src = dataUrl;
}

// ── Freeze / Save ────────────────────────────────────────────────────────────
let frozen = false;
window.sendFreeze = function() {
  frozen = !frozen;
  const btn = document.getElementById('freeze-btn');
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: frozen ? 'freezeCalib' : 'unfreezeCalib', value: frozen }));
  }
  btn.textContent = frozen ? '▶ Resume Detection' : '❄ Freeze & Save';
  btn.className   = frozen ? 'frozen' : '';
};

// ── Pose display ─────────────────────────────────────────────────────────────
let lastPose = null;

function updatePose(p) {
  lastPose = p;
  const fmt = v => (v !== undefined ? v.toFixed(4) : '—');
  document.getElementById('px').textContent = fmt(p.X);
  document.getElementById('py').textContent = fmt(p.Y);
  document.getElementById('pz').textContent = fmt(p.Z);
  document.getElementById('rx').textContent = fmt(p.Rx);
  document.getElementById('ry').textContent = fmt(p.Ry);
  document.getElementById('rz').textContent = fmt(p.Rz);
  updateDetectBadge(true);
  updateFrustum(p);
}

function updateDetectBadge(ok) {
  const icon = document.getElementById('detect-icon');
  const msg  = document.getElementById('detect-msg');
  icon.className = ok ? 'ok' : 'bad';
  msg.textContent = ok ? 'Grid detected — pose estimated ✓' : 'No grid detected';
}

// ── Three.js scene ───────────────────────────────────────────────────────────
const canvas   = document.getElementById('threejs-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x080810);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 20);
camera.position.set(0.5, -0.8, 0.7);
camera.up.set(0, 0, 1);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0, 0);
controls.enableDamping = true;

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0x88ccff, 0.8);
dirLight.position.set(1, 1, 2);
scene.add(dirLight);

// Grid (Niryo workspace) — 7×5 ArUco grid, square=3.75cm
// Cols: u ∈ {-3,-2,-1,0,1,2,3}  Rows: v ∈ {-2,-1,0,1,2}
const SQ = 0.0375; // 3.75 cm
const ML = 0.0275; // 2.75 cm

// Workspace boundary rectangle
const workW = 6 * SQ; // 6 squares wide
const workH = 4 * SQ; // 4 squares tall
const workGeo = new THREE.PlaneGeometry(workW, workH);
const workMat = new THREE.MeshBasicMaterial({ color: 0x001a10, side: THREE.DoubleSide });
const workPlane = new THREE.Mesh(workGeo, workMat);
scene.add(workPlane);

// Grid lines
const gridHelper = new THREE.GridHelper(0.3, 6, 0x00cc6a, 0x003322);
gridHelper.rotation.x = Math.PI / 2;
scene.add(gridHelper);

// ArUco marker positions (ids 0-16, 7×5 layout)
const markerLayout = [
  [0,-2,2],[1,0,2],[2,2,2],
  [3,-3,1],[4,-1,1],[5,1,1],[6,3,1],
  [7,-2,0],[8,0,0],[9,2,0],
  [10,-3,-1],[11,-1,-1],[12,1,-1],[13,3,-1],
  [14,-2,-2],[15,0,-2],[16,2,-2]
];
const markerGeo = new THREE.PlaneGeometry(ML, ML);
const markerMat = new THREE.MeshBasicMaterial({ color: 0xff8800, side: THREE.DoubleSide });
markerLayout.forEach(([id,u,v]) => {
  const m = new THREE.Mesh(markerGeo, markerMat.clone());
  m.position.set(u * SQ, v * SQ, 0.001);
  scene.add(m);

  // ID label approximation: small cross
  const geoCross = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-ML*0.3, 0, 0), new THREE.Vector3(ML*0.3, 0, 0),
    new THREE.Vector3(0, -ML*0.3, 0), new THREE.Vector3(0, ML*0.3, 0)
  ]);
  const cross = new THREE.LineSegments(geoCross, new THREE.LineBasicMaterial({ color: 0x000000 }));
  cross.position.copy(m.position);
  scene.add(cross);
});

// World axes
const axesHelper = new THREE.AxesHelper(0.1);
scene.add(axesHelper);

// Robot base cylinder (placeholder)
const robotGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.12, 16);
const robotMat = new THREE.MeshStandardMaterial({ color: 0x395a8c });
const robotMesh = new THREE.Mesh(robotGeo, robotMat);
robotMesh.rotation.x = Math.PI / 2;
robotMesh.position.set(0, 0, 0.06);
scene.add(robotMesh);

// Camera frustum group (updated on pose)
let frustumGroup = new THREE.Group();
scene.add(frustumGroup);

function buildFrustum(color) {
  frustumGroup.clear();

  const fovH = 60 * Math.PI / 180;
  const fovV = 45 * Math.PI / 180;
  const near = 0.02, far = 0.45;

  const hw = Math.tan(fovH / 2);
  const hv = Math.tan(fovV / 2);

  const pts = [
    // near rectangle
    new THREE.Vector3(-near*hw, -near*hv, near), new THREE.Vector3( near*hw, -near*hv, near),
    new THREE.Vector3( near*hw,  near*hv, near), new THREE.Vector3(-near*hw,  near*hv, near),
    // far rectangle
    new THREE.Vector3(-far*hw, -far*hv, far),   new THREE.Vector3( far*hw, -far*hv, far),
    new THREE.Vector3( far*hw,  far*hv, far),   new THREE.Vector3(-far*hw,  far*hv, far),
  ];

  const indices = [
    0,1, 1,2, 2,3, 3,0,     // near rect
    4,5, 5,6, 6,7, 7,4,     // far rect
    0,4, 1,5, 2,6, 3,7      // edges
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  geo.setIndex(indices);
  const mat = new THREE.LineBasicMaterial({ color });
  frustumGroup.add(new THREE.LineSegments(geo, mat));

  // Dot at camera origin
  const dotGeo = new THREE.SphereGeometry(0.01, 8, 8);
  const dotMat = new THREE.MeshBasicMaterial({ color });
  frustumGroup.add(new THREE.Mesh(dotGeo, dotMat));
}

function updateFrustum(pose) {
  const color = camName.toLowerCase().includes('intel') ? 0x5599ff : 0x00e5ff;
  buildFrustum(color);

  // Position: camera world position in board frame
  frustumGroup.position.set(pose.X, pose.Y, pose.Z);

  // Orientation: rotation matrix columns
  const R = new THREE.Matrix4().set(
    pose.R11, pose.R12, pose.R13, 0,
    pose.R21, pose.R22, pose.R23, 0,
    pose.R31, pose.R32, pose.R33, 0,
    0,        0,        0,        1
  );
  frustumGroup.setRotationFromMatrix(R);
}

// ── Resize ───────────────────────────────────────────────────────────────────
function resize() {
  const { clientWidth: w, clientHeight: h } = canvas.parentElement;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
resize();

// ── Render loop ──────────────────────────────────────────────────────────────
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
