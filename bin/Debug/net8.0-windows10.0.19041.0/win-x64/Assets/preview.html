<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Scene Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: rgb(10, 10, 12);
      overflow: hidden;
      font-family: -apple-system, 'Segoe UI Variable', 'Segoe UI', system-ui, BlinkMacSystemFont, sans-serif;
    }


    canvas {
      display: block;
    }

    /* ── Design Tokens ─────────────────────────────────── */
    :root {
      --glass-bg: rgba(12, 12, 22, 0.82);
      --glass-border: rgba(255, 255, 255, 0.07);
      --blur: blur(18px);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --accent: #5599ff;
      --accent-glow: rgba(85, 153, 255, 0.25);
      --accent2: #ff8c42;
      --green: #00cc6a;
      --red-soft: rgba(255, 80, 80, 0.85);
      --text-muted: rgba(255, 255, 255, 0.38);
      --text-dim: rgba(255, 255, 255, 0.62);
      --text: rgba(255, 255, 255, 0.92);
    }

    /* ── HUD (top-left) ───────────────────────────────── */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: var(--text);
      font-size: 12px;
      pointer-events: none;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 12px 16px 10px;
      backdrop-filter: var(--blur);
      width: 200px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    #hud .hud-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    #hud .hud-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1a2a4a 0%, #0d1a35 100%);
      border: 1px solid rgba(85, 153, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    #hud .hud-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    #hud .hud-subtitle {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    #hud .hud-stats {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    #hud .hud-stat {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 5px 10px;
      flex: 1;
      text-align: center;
    }

    #hud .hud-stat-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 2px;
    }

    #hud .hud-stat-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #hud .hint {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #hud .hint::before {
      content: '·';
      font-size: 14px;
      color: rgba(255, 255, 255, 0.25);
      line-height: 1;
    }


    #legend-items {
      margin-top: 0;
    }

    #legend .lt {
      color: var(--text-muted);
      font-weight: 600;
      margin: 6px 0 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .li {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .ld {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px currentColor;
    }

    /* ── Empty state ──────────────────────────────────── */
    #no-objects {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.18);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    #no-objects svg {
      display: block;
      margin: 0 auto 12px;
      opacity: 0.15;
    }

    /* ── WS Badge ────────────────────────────────────── */
    /* WS badge — bottom-right, away from FK panel */
    #ws-badge {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      backdrop-filter: var(--blur);
      pointer-events: none;
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    #ws-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #444;
      transition: background 0.4s, box-shadow 0.4s;
      flex-shrink: 0;
    }

    #ws-badge.live .dot {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 204, 106, 0.2);
      animation: pulse-dot 2s infinite;
    }

    #ws-badge.live {
      border-color: rgba(0, 204, 106, 0.3);
      box-shadow: 0 0 20px rgba(0, 204, 106, 0.08);
      color: var(--text-dim);
    }

    #ws-badge.error .dot {
      background: #ff4444;
      box-shadow: 0 0 0 3px rgba(255, 68, 68, 0.2);
    }

    @keyframes pulse-dot {

      0%,
      100% {
        box-shadow: 0 0 0 3px rgba(0, 204, 106, 0.2);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(0, 204, 106, 0.08);
      }
    }

    /* FK Panel — bottom-center, wider to use the space naturally */
    #fk-panel {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-bg);
      border: 1px solid rgba(85, 153, 255, 0.18);
      border-radius: var(--radius-lg);
      backdrop-filter: var(--blur);
      color: var(--text);
      font-size: 12px;
      width: 520px;
      max-width: calc(100vw - 340px);
      /* stay clear of right-side panel */
      overflow: hidden;
      resize: both;
      min-width: 300px;
      min-height: 100px;
      transition: max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 600px;
      /* large enough to show all content */
      opacity: 1;
      user-select: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(85, 153, 255, 0.06);
    }

    /* Collapsed state — only shows the header bar */
    #fk-panel.collapsed {
      max-height: 44px;
    }

    #fk-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      cursor: pointer;
      background: linear-gradient(90deg, rgba(85, 153, 255, 0.08) 0%, transparent 100%);
      border-bottom: 1px solid rgba(85, 153, 255, 0.10);
      gap: 8px;
      transition: background 0.2s;
    }

    #fk-header:hover {
      background: linear-gradient(90deg, rgba(85, 153, 255, 0.14) 0%, rgba(85, 153, 255, 0.03) 100%);
    }

    #fk-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #fk-header-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, rgba(85, 153, 255, 0.25), rgba(85, 153, 255, 0.08));
      border: 1px solid rgba(85, 153, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    #fk-header-text {
      font-size: 12px;
      font-weight: 600;
      color: #88bbff;
      letter-spacing: 0.02em;
    }

    #fk-live-pill {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0, 204, 106, 0.12);
      border: 1px solid rgba(0, 204, 106, 0.3);
      color: #00cc6a;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: none;
    }

    #fk-live-pill.visible {
      display: block;
    }

    #fk-toggle-icon {
      font-size: 9px;
      color: rgba(85, 153, 255, 0.5);
      transition: transform 0.3s;
    }

    #fk-panel.collapsed #fk-collapse-btn {
      transform: rotate(-90deg);
    }

    #fk-body {
      padding: 12px 14px 14px;
    }

    /* Robot selector pills */
    .fk-robot-selector {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 3px;
    }

    .fk-robot-btn {
      flex: 1;
      padding: 5px 0;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fk-robot-btn.active {
      background: linear-gradient(135deg, rgba(85, 153, 255, 0.28), rgba(85, 153, 255, 0.12));
      color: #aaccff;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* 2-column axis grid to use the wider bottom-center panel */
    #fk-sliders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 20px;
    }

    .fk-axis-row {
      display: grid;
      grid-template-columns: 38px 1fr 46px;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
    }

    .fk-axis-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .fk-slider-wrap {
      position: relative;
    }

    .fk-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: rgba(85, 153, 255, 0.12);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .fk-slider:hover {
      background: rgba(85, 153, 255, 0.2);
    }

    .fk-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #88bbff, #3366cc);
      box-shadow: 0 0 6px rgba(85, 153, 255, 0.55), 0 2px 4px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.15);
      transition: box-shadow 0.15s, transform 0.15s;
    }

    .fk-slider:active::-webkit-slider-thumb {
      box-shadow: 0 0 12px rgba(85, 153, 255, 0.8);
      transform: scale(1.15);
    }

    .fk-val {
      font-size: 11px;
      font-weight: 600;
      color: #aaccff;
      text-align: right;
      font-variant-numeric: tabular-nums;
      background: rgba(85, 153, 255, 0.08);
      border: 1px solid rgba(85, 153, 255, 0.14);
      border-radius: 5px;
      padding: 2px 6px;
    }

    /* Divider between sections */
    .fk-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
      margin: 8px 0;
    }

    #fk-reset-btn {
      width: 100%;
      margin-top: 8px;
      padding: 7px 0;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 100, 100, 0.2);
      background: rgba(255, 60, 60, 0.06);
      color: rgba(255, 150, 150, 0.75);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      letter-spacing: 0.03em;
    }

    #fk-reset-btn:hover {
      background: rgba(255, 60, 60, 0.14);
      border-color: rgba(255, 100, 100, 0.35);
      color: rgba(255, 180, 180, 0.9);
    }


    /* ── Control Panel: quick action row ─────────────────────────── */
    #cp-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .cp-action-btn {
      flex: 1;
      min-width: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      white-space: nowrap;
    }

    .cp-action-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--text);
    }

    #sb-vr-btn {
      border-color: rgba(120, 80, 255, 0.35);
      background: rgba(90, 50, 220, 0.10);
      color: rgba(200, 180, 255, 0.85);
    }

    #sb-vr-btn:hover {
      background: rgba(90, 50, 220, 0.22);
    }

    #sb-vr-btn.active {
      background: rgba(80, 40, 200, 0.3);
      border-color: rgba(150, 110, 255, 0.8);
    }

    #sb-vr-btn.unsupported {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .cp-action-btn--reset {
      border-color: rgba(255, 160, 50, 0.3);
      background: rgba(255, 140, 30, 0.07);
      color: rgba(255, 200, 120, 0.85);
    }

    .cp-action-btn--reset:hover {
      background: rgba(255, 140, 30, 0.16);
    }

    /* ── Control Panel: calibration sliders row ───────────────────── */
    #cp-sliders {
      display: flex;
      gap: 14px;
      margin-bottom: 10px;
    }

    .cp-slider-row {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
    }

    .cp-slider-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .cp-slider-val {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .cp-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1 1 100%;
      height: 3px;
      border-radius: 999px;
      background: rgba(85, 153, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .cp-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #88bbff, #3366cc);
      cursor: pointer;
      box-shadow: 0 0 5px rgba(85, 153, 255, 0.4);
    }

    /* ── (Sidebar CSS kept for reference / white-bg overrides) ──── */
    #sidebar {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 175px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 8px 6px;
      backdrop-filter: var(--blur);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      user-select: none;
      z-index: 10;
    }

    .sb-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      text-align: left;
      width: 100%;
    }

    .sb-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
    }

    .sb-sep {
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
      margin: 2px 4px;
    }

    .sb-icon {
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
    }

    .sb-label {
      flex: 1;
    }

    #sb-vr-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(120, 80, 255, 0.3);
      background: rgba(90, 50, 220, 0.10);
      color: rgba(200, 180, 255, 0.85);
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      width: 100%;
    }

    #sb-vr-btn:hover {
      background: rgba(90, 50, 220, 0.22);
      border-color: rgba(150, 110, 255, 0.6);
    }

    #sb-vr-btn.active {
      background: rgba(80, 40, 200, 0.3);
      border-color: rgba(150, 110, 255, 0.8);
      color: #ccbbff;
    }

    #sb-vr-btn.unsupported {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .sb-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 5px 10px 7px;
    }

    .sb-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .sb-row-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      white-space: nowrap;
      flex: 1;
      text-transform: uppercase;
      white-space: nowrap;
      flex: 1;
    }

    .sb-row-val {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .sb-reset-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      color: var(--text-muted);
      font-size: 12px;
      padding: 1px 5px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1.6;
    }

    .sb-reset-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
    }

    .sb-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: rgba(85, 153, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .sb-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #88bbff, #3366cc);
      cursor: pointer;
      box-shadow: 0 0 5px rgba(85, 153, 255, 0.4);
    }

    /* XR Toast */
    #xr-toast {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(20, 20, 35, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 18px;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
      max-width: 380px;
      text-align: center;
      white-space: pre-line;
    }

    #xr-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Draggable panel handles ──────────────────────────────────────── */
    .drag-handle {
      cursor: grab;
      touch-action: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    /* Subtle 3-dot grip icon shown in a thin strip */
    .drag-grip {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 0 2px;
      opacity: 0.35;
      font-size: 11px;
      letter-spacing: 3px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: opacity 0.15s;
    }

    .drag-grip:hover {
      opacity: 0.7;
    }

    .drag-grip:active {
      cursor: grabbing;
      opacity: 0.9;
    }

    /* White-BG mode: panels stay readable, WinUI title buttons visible */
    body.white-bg #hud,
    body.white-bg #sidebar {
      background: rgba(240, 240, 245, 0.9);
      border-color: rgba(0, 0, 0, 0.1);
    }

    body.white-bg #fk-panel {
      background: rgba(232, 232, 238, 0.95);
      border-color: rgba(0, 0, 0, 0.1);
    }

    /* ── Voice Panel ──────────────────────────────────────── */
    #voice-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--glass-bg);
      border: 1px solid rgba(200, 80, 255, 0.18);
      border-radius: var(--radius-lg);
      backdrop-filter: var(--blur);
      color: var(--text);
      font-size: 12px;
      width: 260px;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 600px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(180, 80, 255, 0.05);
      user-select: none;
      z-index: 20;
    }

    #voice-panel.collapsed {
      max-height: 46px;
    }

    #voice-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      cursor: pointer;
      background: linear-gradient(90deg, rgba(200, 80, 255, 0.08) 0%, transparent 100%);
      border-bottom: 1px solid rgba(200, 80, 255, 0.10);
      gap: 8px;

  <script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ── Renderer ──
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    renderer.xr.enabled = true;

    document.body.appendChild(renderer.domElement);

    // ── Scene ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);
    scene.fog = new THREE.Fog(0x0a0a0a, 5, 16);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 50);
    camera.position.set(0.33 + 1.2, 1.2, 0.35 + 0.3); // Camera naturally on the right
    camera.lookAt(0.33, 0.05, 0.35);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.target.set(0.33, 0.05, 0.35);
    controls.maxPolarAngle = Math.PI / 2 + 0.15;
    controls.minDistance = 0.3; controls.maxDistance = 10;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.PAN,
      RIGHT: THREE.MOUSE.DOLLY
    };

    // ── Lighting ──
    // Balanced setup: high ambient to fill shadows, overhead key to avoid
    // grazing-angle normal-map streaks (the "wood grain" effect).
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));

    // Key light — overhead angle prevents raking across the bump map
    const dir = new THREE.DirectionalLight(0xffffff, 1.4);
    dir.position.set(2, 5, 2); dir.castShadow = true;
    dir.shadow.mapSize.set(2048, 2048);
    dir.shadow.camera.left = -2; dir.shadow.camera.right = 2;
    dir.shadow.camera.top = 2; dir.shadow.camera.bottom = -2;
    dir.shadow.bias = -0.0005;
    scene.add(dir);

    // Soft neutral fill from the opposite side
    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-2, 2, -1.5);
    scene.add(fill);

    // ── Table (Real world size 80cm x 80cm) ──
    const TABLE_W = 0.80, TABLE_D = 0.80;

    // We want the laptop screen target (30cm x 18.9cm) to rest on the NEAR edge (-X direction) and centered horizontally (Z direction).
    // The target's center is at OpenCV's (0,0).
    // In Three.js space, origin (0,0,0) is therefore the center of the target.
    // To align the Table's near edge with the target's near edge:
    // Target Near edge from center is: (-0.15 in X)
    // Table Near edge from center is: (-TABLE_W/2)
    // So Table Center X = (TABLE_W/2) - 0.15;
    // For Z (horizontal), since we want it centered, Table Center Z = 0;

    const TABLE_CX = (TABLE_W / 2) - 0.15;
    const TABLE_CZ = 0;

    const tableMat = new THREE.MeshStandardMaterial({ color: 0x14142a, roughness: 0.55, metalness: 0.1 });
    const tableMesh = new THREE.Mesh(new THREE.BoxGeometry(TABLE_W, 0.012, TABLE_D), tableMat);
    tableMesh.receiveShadow = true;
    tableMesh.position.set(TABLE_CX, -0.006, TABLE_CZ);
    scene.add(tableMesh);

    const grid = new THREE.GridHelper(TABLE_W, 12, 0x252560, 0x252560);
    grid.position.set(TABLE_CX, 0.001, TABLE_CZ);
    scene.add(grid);

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(TABLE_W, 0.012, TABLE_D)),
      new THREE.LineBasicMaterial({ color: 0x3a3a8a })
    );
    edges.position.copy(tableMesh.position); scene.add(edges);

    // ── Load Niryo Ned 3D Models ──
    const gltfLoader = new GLTFLoader();

    // FK state
    const FK_ROBOTS = [];          // [{root, joints:[node|null x6]}]
    let fkTarget = 0;              // 0=R1, 1=R2, 2=Both
    const FK_ANGLES = [0, 0, 0, 0, 0, 0]; // current angles in DEGREES

    // Preferred joint names to search for, in priority order per axis.
    // The Niryo Ned GLB typically uses: joint_1 … joint_6
    // Fallback patterns cover other common URDFs.
    const JOINT_PATTERNS = [
      ['joint_1', 'Joint1', 'Axis1', 'axis_1', 'shoulder_link'],
      ['joint_2', 'Joint2', 'Axis2', 'axis_2', 'arm_link'],
      ['joint_3', 'Joint3', 'Axis3', 'axis_3', 'elbow_link'],
      ['joint_4', 'Joint4', 'Axis4', 'axis_4', 'forearm_link', 'forearm'],
      ['joint_5', 'Joint5', 'Axis5', 'axis_5', 'wrist_link', 'wrist'],
      ['joint_6', 'Joint6', 'Axis6', 'axis_6', 'end_effector', 'tool_link'],
    ];

    // Axis of rotation per joint (local, matching Niryo URDF conventions)
    const JOINT_AXES = [
      new THREE.Vector3(0, 1, 0),   // J1: yaw  (Y)
      new THREE.Vector3(0, 0, 1),   // J2: pitch (Z)
      new THREE.Vector3(0, 0, 1),   // J3: pitch (Z)
      new THREE.Vector3(1, 0, 0),   // J4: roll  (X)
      new THREE.Vector3(0, 0, 1),   // J5: pitch (Z)
      new THREE.Vector3(1, 0, 0),   // J6: roll  (X)
    ];

    // Angle limits in degrees [min, max] per axis
    const JOINT_LIMITS = [
      [-180, 180],
      [-115, 115],
      [-225, 45],
      [-230, 230],
      [-115, 115],
      [-180, 180],
    ];

    function findJoints(root) {
      const joints = [];
      for (let i = 0; i < 6; i++) {
        let found = null;
        root.traverse((node) => {
          if (found) return;
          const n = node.name.toLowerCase();
          for (const pat of JOINT_PATTERNS[i]) {
            if (n === pat.toLowerCase() || n.startsWith(pat.toLowerCase())) {
              found = node; return;
            }
          }
        });
        // Fallback: pick nth non-leaf Object3D in depth-first traversal
        if (!found) {
          let count = 0;
          root.traverse((node) => {
            if (found) return;
            if (node !== root && node.isObject3D && !(node.isMesh)) {
              if (count++ === i) found = node;
            }
          });
        }
        joints.push(found);
        console.log(`[FK] Robot joint ${i + 1}: ${found ? found.name : 'NOT FOUND'}`);
      }
      return joints;
    }

    // Store original quaternions so we can apply FK on top cleanly
    function storeRestPose(root) {
      root.traverse((node) => {
        node.userData.restQ = node.quaternion.clone();
      });
    }

    // ── Material polish for the Niryo Ned GLB ──────────────────────────────────
    // The GLB's embedded normal maps are baked at high intensity for CAD renders.
    // In a real-time scene with directional lighting they produce a "wood grain"
    // effect. We soften them here and improve texture filtering.
    function polishNedMaterials(root) {
      const maxAniso = renderer.capabilities.getMaxAnisotropy();
      root.traverse((node) => {
        if (!node.isMesh) return;
        node.castShadow = true;
        node.receiveShadow = true;

        const mats = Array.isArray(node.material) ? node.material : [node.material];
        mats.forEach((mat) => {
          if (!mat || !mat.isMeshStandardMaterial) return;

          // ── Moderate bump softening ──
          // 0.55 removes the "wood grain" raking artifact while preserving
          // surface micro-detail that makes the plastic look real.
          if (mat.normalMap) {
            mat.normalScale.set(0.55, 0.55);
          }

          // ── Plastic appearance tweak ──
          // Only soften parts that look like the blue ABS body.
          // Detect by checking the map tint vs a threshold colour.
          const col = mat.color;
          const isBlueBody = col.r < 0.35 && col.g > 0.3 && col.b > 0.55;
          if (isBlueBody) {
            mat.roughness = Math.min(mat.roughness, 0.55); // slightly glossy plastic
            mat.metalness = Math.max(mat.metalness, 0.0);
          }

          // ── Max anisotropy on every texture channel ──
          const textures = [mat.map, mat.normalMap, mat.roughnessMap, mat.metalnessMap, mat.aoMap];
          textures.forEach((t) => {
            if (t) {
              t.anisotropy = maxAniso;
              t.needsUpdate = true;
            }
          });

          mat.needsUpdate = true;
        });
      });
    }

    gltfLoader.load('ned.glb', (gltf) => {
      const nedModel = gltf.scene;

      // Apply material polish before cloning so both robots inherit it
      polishNedMaterials(nedModel);

      const BASE_OFFSET = 0.095;
      const MARGIN = 0.017;
      const FORWARD_SHIFT = 0.05;
      const OFFSET = BASE_OFFSET + MARGIN;

      // Robot 1: Top-Right corner
      const r1 = nedModel.clone();
      r1.position.set(TABLE_CX + 0.40 - OFFSET - FORWARD_SHIFT, 0, TABLE_CZ - 0.40 + OFFSET);
      r1.rotation.y = Math.PI;
      scene.add(r1);
      storeRestPose(r1);
      FK_ROBOTS.push({ root: r1, joints: findJoints(r1) });

      // Robot 2: Bottom-Right corner
      const r2 = nedModel.clone();
      r2.position.set(TABLE_CX + 0.40 - OFFSET - FORWARD_SHIFT, 0, TABLE_CZ + 0.40 - OFFSET);
      r2.rotation.y = Math.PI;
      scene.add(r2);
      storeRestPose(r2);
      FK_ROBOTS.push({ root: r2, joints: findJoints(r2) });

      buildFkSliders();
    }, undefined, (e) => console.error("Could not load ned.glb:", e));

    // Helper to draw text labels
    function makeTextSprite(message) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = 'Bold 32px "Segoe UI", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(message, 128, 64);
      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(0.15, 0.075, 1);
      return sprite;
    }

    // Add 80cm labels for width and length
    const labelX = makeTextSprite("X: 80 cm");
    labelX.position.set(TABLE_CX, 0.02, TABLE_CZ + TABLE_D / 2 + 0.02);
    // scene.add(labelX);

    const labelZ = makeTextSprite("Y: 80 cm");
    labelZ.position.set(TABLE_CX + TABLE_W / 2 + 0.03, 0.02, TABLE_CZ);
    // scene.add(labelZ);

    // ── Marker Board Representation (Real scale ~ 30cm x 18.9cm) ──
    const boardMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const boardMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.30, 0.189), boardMat);
    boardMesh.rotation.x = -Math.PI / 2;
    boardMesh.position.set(0, 0.002, 0);
    scene.add(boardMesh);

    // World axes precisely at the center of the Niryo paper
    const axesHelper = new THREE.AxesHelper(0.10);
    axesHelper.position.y = 0.005; scene.add(axesHelper);

    // Toggle for calibration guides
    window._guidesVisible = true;
    window.toggleCalibrationPlane = function () {
      window._guidesVisible = !window._guidesVisible;

      const btn = document.getElementById('sb-calib-guides-btn');
      const lbl = document.getElementById('sb-calib-guides-label');
      if (btn) btn.style.opacity = window._guidesVisible ? '1' : '0.55';
      if (lbl) lbl.textContent = window._guidesVisible ? '\u00a0Hide Target' : '\u00a0Show Target';

      boardMesh.visible = window._guidesVisible;
      axesHelper.visible = window._guidesVisible;

      if (camCone) camCone.visible = window._guidesVisible;
      if (camFrustumLines) camFrustumLines.visible = window._guidesVisible;
    };

    // ── Object group ──
    const objGroup = new THREE.Group();
    scene.add(objGroup);

    // ── Camera Cone (virtual camera visualisation) ──
    let camCone = null;
    let camFrustumLines = null;
    let camVideoPlane = null;
    let camVideoTexture = null;

    function buildCameraViz(tx, ty, tz, poseObj) {
      try {
        // Remove previous
        if (camCone) { scene.remove(camCone); camCone.geometry.dispose(); camCone.material.dispose(); }
        if (camFrustumLines) { scene.remove(camFrustumLines); camFrustumLines.geometry.dispose(); camFrustumLines.material.dispose(); }
        if (camVideoPlane) { scene.remove(camVideoPlane); camVideoPlane.geometry.dispose(); camVideoPlane.material.dispose(); camVideoPlane = null; }

        // Body of camera - use a 4 sided pyramid to match a camera body
        const coneGeo = new THREE.ConeGeometry(0.06, 0.14, 4, 1, false, Math.PI / 4);
        coneGeo.translate(0, -0.07, 0); // Shift origin to the tip (apex)
        coneGeo.rotateX(Math.PI / 2);   // Align cone's 'forward' (+Y) with OpenCV's 'forward' (+Z)

        const coneMat = new THREE.MeshStandardMaterial({ color: 0xffc300, emissive: 0xffc300, emissiveIntensity: 0.12, roughness: 0.4 });
        camCone = new THREE.Mesh(coneGeo, coneMat);

        // 2. Map OpenCV Object Space -> Three.js Space
        // OpenCV Space: X is Right, Y is Forward on table, Z is Up from table
        // Three Space: X is Right, Y is Up, Z is Backward
        const camX = tx;
        const camY = Math.max(0.05, Math.abs(tz)); // Guard minimum height
        const camZ = -ty;

        camCone.position.set(camX, camY, camZ);

        if (poseObj && poseObj.R11 !== undefined) {
          // Mathematical conversion to Three.js basis vectors.
          // In OpenCV, rvec is an axis-angle representing World -> Camera.
          // The inverse rotation is -angle, going Camera -> World.
          const ax = poseObj.Rx, ay = poseObj.Ry, az = poseObj.Rz;
          const angle = Math.sqrt(ax * ax + ay * ay + az * az);
          const qCv = new THREE.Quaternion();
          if (angle > 0.0001) {
            // OpenCV axis
            const axisCv = new THREE.Vector3(ax / angle, ay / angle, az / angle);
            // We want Camera -> World in OpenCV space, so inverse rotation
            qCv.setFromAxisAngle(axisCv, -angle);
          }

          // OpenCV World to ThreeJS World conversion
          // OpenCV World: X=right, Y=forward, Z=up
          // ThreeJS World: X=right, Y=up, Z=backward (-Z is forward)
          // Mapping: (x, y, z) -> (x, z, -y) is a -90 deg rotation around X
          const qWorld = new THREE.Quaternion();
          qWorld.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);

          // The camera requires a 180-degree rotation around its own axis to flip upside down
          const qRot180 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI);
          const qFinal = new THREE.Quaternion().copy(qWorld).multiply(qCv).multiply(qRot180);

          camCone.quaternion.copy(qFinal);

          camCone.castShadow = false;
          camCone.visible = window._guidesVisible !== false;
          scene.add(camCone);

          // True Frustum lines
          const apex = new THREE.Vector3(camX, camY, camZ);

          // By mapping with qFinal, we extract the transformed axes directly:
          // OpenCV camera's local forward is +Z
          const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(qFinal);
          // OpenCV camera's local up is -Y (since +Y is visually down)
          const trueUp = new THREE.Vector3(0, -1, 0).applyQuaternion(qFinal);
          // OpenCV camera's local right is +X
          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(qFinal);

          // Project the rays exactly onto the table plane (Y=0)
          let dist = 2.0; // fallback
          if (forward.y < -0.05) {
            dist = Math.abs(camY / forward.y);
          }

          const aspect = (camVideoTexture && camVideoTexture.image && camVideoTexture.image.width > 0)
            ? (camVideoTexture.image.width / camVideoTexture.image.height)
            : (16 / 9); // Default HD webcam ratio

          const fovScale = window.currentFovScale !== undefined ? window.currentFovScale : 0.45;
          const halfH = dist * fovScale;
          const halfW = halfH * aspect;

          const centerFocus = apex.clone().addScaledVector(forward, dist);

          const virtualCorners = [
            centerFocus.clone().addScaledVector(right, -halfW).addScaledVector(trueUp, halfH),
            centerFocus.clone().addScaledVector(right, halfW).addScaledVector(trueUp, halfH),
            centerFocus.clone().addScaledVector(right, halfW).addScaledVector(trueUp, -halfH),
            centerFocus.clone().addScaledVector(right, -halfW).addScaledVector(trueUp, -halfH)
          ];

          // Math: Where do the 4 corner rays hit the physical table?
          function getIntercept(point) {
            const ray = point.clone().sub(apex);
            // If the camera is looking parallel or upward, prevent infinity by drawing far away
            if (ray.y >= -0.001) {
              ray.normalize();
              return apex.clone().add(ray.multiplyScalar(15));
            }
            const t = (0.002 - apex.y) / ray.y;
            return apex.clone().add(ray.multiplyScalar(t));
          }

          const corners = [
            getIntercept(virtualCorners[0]), // Top-Left
            getIntercept(virtualCorners[1]), // Top-Right
            getIntercept(virtualCorners[2]), // Bottom-Right
            getIntercept(virtualCorners[3])  // Bottom-Left
          ];

          // Render video projection perfectly flattened mathematically onto the table mesh
          if (camVideoTexture) {
            // Create a subdivided grid to fix WebGL affine texture distortion
            const rectGeo = new THREE.PlaneGeometry(1, 1, 32, 32);
            const posAttr = rectGeo.attributes.position;
            const uvAttr = rectGeo.attributes.uv;

            for (let i = 0; i < posAttr.count; i++) {
              const u = uvAttr.getX(i);
              const v = uvAttr.getY(i);

              // Optical pinhole inversion (flip UV mathematically before raycasting)
              const wX = ((1.0 - u) - 0.5) * 2.0 * halfW;
              const wY = ((1.0 - v) - 0.5) * 2.0 * halfH;

              const pt = centerFocus.clone()
                .addScaledVector(right, wX)
                .addScaledVector(trueUp, wY);

              const intercept = getIntercept(pt);
              posAttr.setXYZ(i, intercept.x, intercept.y, intercept.z);
            }
            rectGeo.computeVertexNormals();

            const pMat = new THREE.MeshBasicMaterial({
              map: camVideoTexture,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: window.currentCamOpacity !== undefined ? window.currentCamOpacity : 0.85
            });
            camVideoPlane = new THREE.Mesh(rectGeo, pMat);
            scene.add(camVideoPlane);
          }

          const lines = [];
          corners.forEach(c => { lines.push(apex); lines.push(c); });
          for (let i = 0; i < 4; i++) { lines.push(corners[i]); lines.push(corners[(i + 1) % 4]); }

          const fGeo = new THREE.BufferGeometry().setFromPoints(lines);
          const fMat = new THREE.LineBasicMaterial({ color: 0xffc300, opacity: 0.45, transparent: true });
          camFrustumLines = new THREE.LineSegments(fGeo, fMat);
          camFrustumLines.visible = window._guidesVisible !== false;
          scene.add(camFrustumLines);
        }

      } catch (err) {
        document.getElementById('legend-items').innerHTML = `<div style="color:red; font-size:10px;">${err.message}<br/>${err.stack}</div>`;
      }
    }

    // ── Helpers ──
    function colorFromLabel(label) {
      const map = {
        red: 0xff3333, blue: 0x3366ff, green: 0x33cc66, yellow: 0xffdd00,
        orange: 0xff7700, purple: 0xaa44ff, pink: 0xff66aa, white: 0xeeeeff,
        black: 0x222233, grey: 0x778899, gray: 0x778899, brown: 0xaa6633,
        cyan: 0x00ddff, magenta: 0xff00aa,
      };
      const lo = label.toLowerCase();
      for (const [k, v] of Object.entries(map)) if (lo.includes(k)) return v;
      let h = 0; for (const c of label) h = (c.charCodeAt(0) + ((h << 5) - h)) | 0;
      return Math.abs(h) % 0xffffff;
    }

    // ── Draggable panels ──────────────────────────────────────────────────
    // makeDraggable(panel, handle) — drag via mouse or touch.
    // Saves position to localStorage. On first drag removes FK centering transform.
    const PANEL_POS_KEY = 'scene3d_panel_pos';

    function savePanelPositions() {
      const data = {};
      ['fk-panel', 'sidebar'].forEach(id => {
        const el = document.getElementById(id);
        if (el) data[id] = {
          left: el.style.left, top: el.style.top, right: el.style.right, bottom: el.style.bottom,
          width: el.style.width, height: el.style.height
        };
      });
      localStorage.setItem(PANEL_POS_KEY, JSON.stringify(data));
    }

    function restorePanelPositions() {
      try {
        const data = JSON.parse(localStorage.getItem(PANEL_POS_KEY));
        if (!data) return;
        ['hud', 'fk-panel', 'sidebar'].forEach(id => {
          const el = document.getElementById(id);
          const d = data[id];
          if (!el || !d) return;
          if (d.left) { el.style.left = d.left; if (id === 'fk-panel') { el.style.transform = 'none'; el.style.right = ''; el.style.bottom = d.bottom || ''; } }
          if (d.top) el.style.top = d.top;
          if (d.right && !d.left) el.style.right = d.right;
          if (d.bottom && !d.top) el.style.bottom = d.bottom;
          if (d.width && id === 'fk-panel') el.style.width = d.width;
          if (d.height && id === 'fk-panel') el.style.height = d.height;
        });
      } catch (_) { }
    }

    function makeDraggable(panel, handle) {
      if (!panel || !handle) return; // element was removed from DOM
      let startX = 0, startY = 0, startLeft = 0, startTop = 0, dragging = false;

      function getXY(e) {
        return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
          : { x: e.clientX, y: e.clientY };
      }

      function onStart(e) {
        // Ignore clicks on interactive children (buttons, inputs, select)
        if (e.target.closest('button,input,select,a')) return;
        e.preventDefault();
        dragging = true;

        // Compute absolute panel position (handles transforms like translateX(-50%))
        const rect = panel.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;

        // Clear CSS positioning shortcuts and lock to absolute px
        panel.style.right = '';
        panel.style.bottom = '';

        // Preserve any size CSS that was active before dragging cleared transform constraints
        const currentWidth = panel.offsetWidth;
        const currentHeight = panel.offsetHeight;

        panel.style.transform = 'none';
        panel.style.left = startLeft + 'px';
        panel.style.top = startTop + 'px';
        panel.style.width = currentWidth + 'px';

        // Don't fix height if it's gracefully resizing by content unless user actually resized height
        if (panel.style.height) panel.style.height = currentHeight + 'px';

        const { x, y } = getXY(e);
        startX = x - startLeft;
        startY = y - startTop;

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      }

      function onMove(e) {
        if (!dragging) return;
        e.preventDefault();
        const { x, y } = getXY(e);
        const nx = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, x - startX));
        const ny = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, y - startY));
        panel.style.left = nx + 'px';
        panel.style.top = ny + 'px';
      }

      function onEnd() {
        dragging = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
        savePanelPositions();
      }

      handle.addEventListener('mousedown', onStart);
      handle.addEventListener('touchstart', onStart, { passive: false });
    }

    // Init draggable after DOM is ready (already in module scope)
    (function initDraggable() {
      restorePanelPositions();
      const fkPanel = document.getElementById('fk-panel');
      makeDraggable(fkPanel, document.getElementById('fk-header'));

      // Auto-save size when the user manually resizes the panel
      const resizeObserver = new ResizeObserver(() => savePanelPositions());
      if (fkPanel) resizeObserver.observe(fkPanel);
    })();

    const legendEl = document.getElementById('legend-items');

    function clearObjects() {
      while (objGroup.children.length) {
        const c = objGroup.children[0];
        c.geometry?.dispose();
        (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m?.dispose());

    function renderObjects(items) {
      clearObjects();
      noObjEl.style.display = items.length ? 'none' : 'block';
      countEl.textContent = items.length;

      items.forEach(item => {
        const raw = colorFromLabel(item.label);
        const col = new THREE.Color(raw);

        // worldX / worldY are in metres from the camera's perspective projection
        // Map as OpenCV X → Three.js X, OpenCV Y (Forward) → Three.js -Z (Forward)
        // Map as OpenCV X → Three.js X, OpenCV Y (Forward) → Three.js -Z (Forward)
        const px = item.worldX;
        const pz = -item.worldY;

        const bw = Math.max(0.025, Math.min(0.35, item.sizeW));
        const bd = Math.max(0.025, Math.min(0.35, item.sizeH));

        function makeTextSprite(message, color) {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 512; canvas.height = 128;
          ctx.fillStyle = '#' + color.getHexString();
          ctx.font = 'bold 48px Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(message, 256, 64);
          const texture = new THREE.CanvasTexture(canvas);
          texture.minFilter = THREE.LinearFilter;
          const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
          const sprite = new THREE.Sprite(spriteMaterial);
          sprite.scale.set(0.15, 0.0375, 1);
          return sprite;
        }

        const labelSprite = makeTextSprite(item.label, col);

        function addSphere() {
          const radius = Math.min(bw, bd) / 2.5;
          const geo = new THREE.SphereGeometry(radius, 32, 16);
          const mat = new THREE.MeshStandardMaterial({
            color: col, roughness: 0.35, metalness: 0.15,
            emissive: col, emissiveIntensity: 0.08
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.castShadow = true; mesh.receiveShadow = true;
          mesh.position.set(px, radius, pz);

          if (item.angleRad !== undefined) {
            mesh.rotation.y = -item.angleRad;
          }

          const pivotAxes = new THREE.AxesHelper(0.08); // 8cm axes visual length
          mesh.add(pivotAxes);

          objGroup.add(mesh);

          labelSprite.position.set(px, radius * 2 + 0.03, pz);
          objGroup.add(labelSprite);
        }

        if (item.modelUrl && item.modelUrl.trim() !== '') {
          // Prefer the remote-friendly URL when available (Quest browser via LAN)
          const resolvedUrl = (item.modelUrlRemote && item.modelUrlRemote.trim() !== '')
            ? item.modelUrlRemote
            : item.modelUrl;
          gltfLoader.load(resolvedUrl, (gltf) => {
            const model = gltf.scene;

            model.traverse((node) => {
              if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }
            });

            // Pivot to bottom center
            const box = new THREE.Box3().setFromObject(model);
            const cy = box.min.y;
            model.position.y = -cy; // shifts model up so its lowest point is at 0

            const wrapper = new THREE.Group();
            wrapper.add(model);

            // Real-world Scale based on BBox width (sizeW is in meters)
            const modelW = box.max.x - box.min.x;
            const targetW = Math.max(0.01, item.sizeW);
            const s = modelW > 0.0001 ? targetW / modelW : 1;
            wrapper.scale.set(s, s, s);

            if (item.angleRad !== undefined) {
              wrapper.rotation.y = -item.angleRad;
            }

            wrapper.position.set(px, 0, pz); // on the table surface

            const boxScaled = new THREE.Box3().setFromObject(wrapper);
            labelSprite.position.set(px, boxScaled.max.y + 0.03, pz);

            const pivotAxes = new THREE.AxesHelper(0.08 / s); // 8cm axes visual length
            wrapper.add(pivotAxes);

            objGroup.add(wrapper);
            objGroup.add(labelSprite);
          }, undefined, (e) => {
            console.warn('Failed to load model:', item.modelUrl, e);
            addSphere();
          });
        } else {
          addSphere();
        }

        // Legend
        const d = document.createElement('div');
        d.className = 'li';
        d.innerHTML = `<div class="ld" style="background:#${col.getHexString()}"></div><span>${item.label}</span>`;
        legendEl.appendChild(d);
      });
    }

    function applyFk() {
      const targets = fkTarget === 2 ? FK_ROBOTS : [FK_ROBOTS[fkTarget]];
      for (const robot of targets) {
        if (!robot) continue;
        robot.joints.forEach((joint, i) => {
          if (!joint) return;
          // Reset to rest quaternion first, then apply rotation
          joint.quaternion.copy(joint.userData.restQ);
          const q = new THREE.Quaternion();

          let renderAngle = FK_ANGLES[i];
          if (i === 1) renderAngle -= 40; // J2
          if (i === 2) renderAngle += 75; // J3

          q.setFromAxisAngle(JOINT_AXES[i], THREE.MathUtils.degToRad(renderAngle));
          joint.quaternion.multiply(q);
        });
      }
    }

    // ─────────────────────────────────────────────────────────────────────

    let _xrSession = null;

    // Controller groups  ─ kept at scene origin to cancel parent offset
    // (Three.js sets ctrl position in parent-local space; if scene.position.y = 0.75
    //  the controllers would appear 0.75 m too high.  We negate that each frame.)
    const _ctrlRoot = new THREE.Group(); // target-ray space (rays)
    const _gripRoot = new THREE.Group(); // grip space (body meshes)
    scene.add(_ctrlRoot, _gripRoot);

    const _xrCtrls = [renderer.xr.getController(0), renderer.xr.getController(1)];

    let _grabbing = false;

    let _grabScaleBase = 1;
    const ANCHOR_KEY = 'xr_table_anchor';
    let _xrAnchor = null;
    let _xrRefSpace = null;

    (function initControllers() {
      const rayGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -3)
      ]);
      const rayMat = new THREE.LineBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.65, depthTest: false });
      const bodyGeo = new THREE.CylinderGeometry(0.018, 0.022, 0.10, 10);
      const capGeo = new THREE.SphereGeometry(0.022, 10, 6, 0, Math.PI * 2, 0, Math.PI * 0.5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.7, metalness: 0.3 });

      _xrCtrls.forEach((ctrl, i) => {
        ctrl.add(new THREE.Line(rayGeo, rayMat));
        _ctrlRoot.add(ctrl);
        ctrl.addEventListener('squeezestart', () => {
          _gripState[i] = true;
          // Single right grip (index 1) for grab-and-move
          if (i === 1 && _gripState[1]) {
            const p0 = new THREE.Vector3().setFromMatrixPosition(_xrCtrls[0].matrixWorld);
            const p1 = new THREE.Vector3().setFromMatrixPosition(_xrCtrls[1].matrixWorld);
            _grabMid.addVectors(p0, p1).multiplyScalar(0.5);
            _grabDist = Math.max(p0.distanceTo(p1), 0.12);
            _grabScenePos.copy(scene.position);
            _grabScaleBase = scene.scale.x;
            _grabbing = true;
          }
        });
        ctrl.addEventListener('squeezeend', () => {
          _gripState[i] = false;
          const was = _grabbing;
          _grabbing = false;
          if (was) saveAnchorPosition();
        });
      });

      _xrGrips.forEach(grip => {
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.rotation.x = -Math.PI / 8;
        const cap = new THREE.Mesh(capGeo, bodyMat);
        cap.position.y = 0.05;
        grip.add(body, cap);
        _gripRoot.add(grip);
      });
    })();

    function syncCtrlRoots() {
      // Counteract scene.position so controllers stay at true XR world positions
      _ctrlRoot.position.copy(scene.position).negate();
      _gripRoot.position.copy(scene.position).negate();
    }

    function tickWorldGrab() {
      syncCtrlRoots();
      if (!_grabbing || !_gripState[0] || !_gripState[1]) return;
      const p0 = new THREE.Vector3().setFromMatrixPosition(_xrCtrls[0].matrixWorld);
      const p1 = new THREE.Vector3().setFromMatrixPosition(_xrCtrls[1].matrixWorld);
      const mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
      const rawDelta = mid.clone().sub(_grabMid);
      if (rawDelta.length() > 0.5) rawDelta.setLength(0.5); // safety clamp
      scene.position.copy(_grabScenePos).add(rawDelta);
      const dist = p0.distanceTo(p1);
      if (_grabDist > 0.01)
        scene.scale.setScalar(THREE.MathUtils.clamp(_grabScaleBase * (dist / _grabDist), 0.05, 6));
    }

    function saveAnchorPosition() {
      const { x, y, z } = scene.position; const s = scene.scale.x;
      localStorage.setItem(ANCHOR_KEY, JSON.stringify({ x, y, z, s }));
      if (_xrSession && _xrRefSpace) {
        try {
          renderer.xr.getFrame()?.createAnchor(
            new XRRigidTransform({ x, y, z, w: 1 }, { x: 0, y: 0, z: 0, w: 1 }), _xrRefSpace
          ).then(a => {
            _xrAnchor = a;
            a.requestPersistentHandle?.()
              .then(uuid => localStorage.setItem(ANCHOR_KEY + '_uuid', uuid))
              .catch(() => { });
          }).catch(() => { });
        } catch (_) { }
      }
    }

    async function restoreAnchorPosition(session) {
      const uuid = localStorage.getItem(ANCHOR_KEY + '_uuid');
      if (uuid && session.restorePersistentAnchor) {
        try { _xrAnchor = await session.restorePersistentAnchor(uuid); return; } catch (e) { }
      }
      try {
        const s = JSON.parse(localStorage.getItem(ANCHOR_KEY));
        if (s) { scene.position.set(s.x ?? 0, s.y ?? 0.75, s.z ?? -0.5); scene.scale.setScalar(s.s ?? 1); return; }
      } catch (_) { }
      scene.position.set(0, 0.75, -0.5); // default: robots at table height in front of user
    }

    function showXrToast(msg, ms) {
      const t = document.getElementById('xr-toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms || 6000);
    }

    window.toggleVR = async function () {
      if (_xrSession) { await _xrSession.end(); return; }
      if (!window.isSecureContext) { showXrToast('WebXR needs HTTPS.'); return; }
      if (!navigator.xr) { showXrToast('navigator.xr not available.'); return; }

      const arOk = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      _xrMode = arOk ? 'immersive-ar' : 'immersive-vr';
      try {
        const session = await navigator.xr.requestSession(_xrMode, {
          optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'dom-overlay', 'layers', 'anchors'],
          domOverlay: { root: document.getElementById('sidebar') }
        });
        _xrSession = session;

        const btn = document.getElementById('sb-vr-btn');
        const icon = document.getElementById('sb-vr-icon');
        const label = document.getElementById('sb-vr-label');
        if (btn) btn.classList.add('active');
        if (icon) icon.textContent = '\u23f9\ufe0f';
        if (label) label.textContent = _xrMode === 'immersive-ar' ? '\u00a0Exit MR' : '\u00a0Exit VR';

        _savedBg = scene.background;
        _savedFog = scene.fog;
        if (_xrMode === 'immersive-ar') {
          scene.background = null;
          scene.fog = null;
          renderer.setClearColor(0x000000, 0);
        }

        scene.scale.setScalar(1);
        renderer.xr.setFramebufferScaleFactor(1.5); // XRProjectionLayer: 1.5x sharper rendering
        await renderer.xr.setSession(session);
        renderer.xr.setReferenceSpaceType('local-floor');
        _xrRefSpace = renderer.xr.getReferenceSpace();
        try { const l = session.renderState.layers?.[0]; if (l && 'fixedFoveation' in l) l.fixedFoveation = 0; } catch (_) { }

        await restoreAnchorPosition(session);

        session.addEventListener('end', () => {
          _xrSession = null;
          scene.background = _savedBg;
          scene.fog = _savedFog;
          scene.position.set(0, 0, 0);
          scene.scale.setScalar(1);
          renderer.setClearColor(0x000000, 1);
          _gripState[0] = _gripState[1] = false;
          _grabbing = false;
          if (btn) btn.classList.remove('active');
          if (icon) icon.textContent = '\ud83e\udd7d';
          if (label) label.textContent = _xrMode === 'immersive-ar' ? '\u00a0Enter MR' : '\u00a0Enter VR';
        });
      } catch (err) {
        console.warn('[XR]', err);
        showXrToast('XR failed: ' + (err.message || err));
      }
    };

    (async () => {
      const btn = document.getElementById('sb-vr-btn');
      const lbl = document.getElementById('sb-vr-label');
      if (!navigator.xr) { if (btn) { btn.classList.add('unsupported'); btn.title = 'WebXR not available'; } return; }
      const arOk = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      const vrOk = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
      if (!arOk && !vrOk && btn) { btn.classList.add('unsupported'); btn.title = 'XR not supported - HTTPS required?'; }
      else if (lbl) lbl.textContent = arOk ? '\u00a0Enter MR' : '\u00a0Enter VR';
    })();

    // ── Render loop (setAnimationLoop required for WebXR) ──
    renderer.setAnimationLoop(() => {
      tickWorldGrab();
      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    // ── Remote WebSocket client (Quest / LAN browser live feed) ──────────────
    // Only active when the page is opened from a real HTTP server (not app.local).
    // When loaded inside WebView2 via app.local, this block is skipped silently.
    (function initRemoteWS() {
      const badge = document.getElementById('ws-badge');
      const label = document.getElementById('ws-label');

      // Detect whether we are served from the broadcast Kestrel server
      // (any real host:port) vs the virtual WebView2 host (app.local).
      const isRemote = location.hostname !== 'app.local' && location.hostname !== '';
      if (!isRemote) {
        badge.style.display = 'none'; // Hidden inside the WinUI app
        return;
      }

      let retryDelay = 1500;
      let ws = null;

      function connect() {
        // Use wss:// on HTTPS (Cloudflare) to avoid mixed-content block; ws:// on plain HTTP (LAN)
        const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
        const wsUrl = `${wsProto}://${location.host}/scene3d-ws`;

        label.textContent = 'Connecting…';
        badge.classList.remove('live', 'error');

        ws = new WebSocket(wsUrl);
        window._remoteWs = ws;

        ws.onopen = () => {
          retryDelay = 1500;
          badge.classList.add('live');
          label.textContent = 'Live';
        };

        ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            switch (msg.type) {
              case 'setCameraPose':
                if (window.setCameraPose) setCameraPose(JSON.stringify(msg.payload));
                break;
              case 'setDetectedObjects':
                if (window.setDetectedObjects) setDetectedObjects(JSON.stringify(msg.payload));
                break;
              case 'updateCameraFeed':
                if (window.updateCameraFeed) updateCameraFeed(msg.payload);
                break;
              case 'setRobotJoints': {
                // payload: { angles: [deg x6], robotIdx: 0|1 }
                const { angles, robotIdx } = msg.payload;
                if (Array.isArray(angles) && window.setRobotJoints) {
                  window.setRobotJoints(JSON.stringify(angles), robotIdx ?? 0);
                  // Auto-expand FK panel on first live data so user sees it
                  const panel = document.getElementById('fk-panel');
                  if (panel && panel.classList.contains('collapsed') && angles.some(a => Math.abs(a) > 0.5)) {
                    panel.classList.remove('collapsed');
                  }
                }
                break;
              }
              case 'voiceTranscription': {
                // Show the transcription sent from another client in the voice panel
                const text = typeof msg.payload === 'string' ? msg.payload : JSON.stringify(msg.payload);
                const voiceOut = document.getElementById('voice-output');
                const voiceStatus = document.getElementById('voice-status');
                const copyBtn = document.getElementById('voice-copy-btn');
                if (voiceOut) { voiceOut.textContent = text; voiceOut.classList.add('has-text'); }
                if (voiceStatus) { voiceStatus.textContent = '✅ Transcription received'; voiceStatus.className = 'success'; }
                if (copyBtn) copyBtn.classList.add('visible');
                // Auto-expand voice panel so the user sees the result
                const vp = document.getElementById('voice-panel');
                if (vp) vp.classList.remove('collapsed');
                break;
              }
            }
          } catch (e) { console.warn('WS parse error', e); }
        };

        ws.onerror = () => {
          badge.classList.remove('live');
          badge.classList.add('error');
          label.textContent = 'Error';
        };

        ws.onclose = () => {
          badge.classList.remove('live');
          label.textContent = `Reconnecting in ${(retryDelay / 1000).toFixed(1)}s…`;
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 1.5, 15000); // Exponential back-off, max 15s
        };
      }

      connect();
    })();

    // ── Voice-to-Text Panel ───────────────────────────────────────────────────
    (function initVoicePanel() {
      let _mediaRecorder = null;
      let _audioChunks   = [];
      let _isRecording   = false;

      const pttBtn      = document.getElementById('ptt-btn');
      const pttLabel    = document.getElementById('ptt-label');
      const voiceOutput = document.getElementById('voice-output');
      const voiceStatus = document.getElementById('voice-status');
      const copyBtn     = document.getElementById('voice-copy-btn');

      window.toggleVoicePanel = function () {
        document.getElementById('voice-panel').classList.toggle('collapsed');
      };

      window.toggleRecording = async function () {
        if (_isRecording) {
          stopRecording();
        } else {
          await startRecording();
        }
      };

      async function startRecording() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

          // Pick the best supported format compatible with server-side Whisper
          const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus'
            : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';

          _mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
          _audioChunks = [];
          _isRecording = true;

          _mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) _audioChunks.push(e.data); };
          _mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            uploadAudio();
          };

          _mediaRecorder.start();

          pttBtn.classList.add('recording');
          pttLabel.textContent = 'Recording… tap to stop';
          setStatus('🔴 Recording — tap button to send', '');
        } catch (err) {
          setStatus('⚠️ Microphone access denied: ' + err.message, 'error');
          _isRecording = false;
        }
      }

      function stopRecording() {
        if (_mediaRecorder && _mediaRecorder.state !== 'inactive') {
          _mediaRecorder.stop();
        }
        _isRecording = false;
        pttBtn.classList.remove('recording');
        pttBtn.classList.add('loading');
        pttLabel.textContent = 'Processing…';
        setStatus('⏳ Sending to Whisper…', '');
      }

      async function uploadAudio() {
        if (_audioChunks.length === 0) {
          resetBtn();
          setStatus('⚠️ No audio captured.', 'error');
          return;
        }

        const blob = new Blob(_audioChunks, { type: _mediaRecorder.mimeType || 'audio/webm' });

        const formData = new FormData();
        formData.append('file', blob, 'voice.webm');

        // POST to the broadcast server's /transcribe endpoint.
        // When on the LAN/Quest (isRemote), use same host:port.
        // When inside WebView2 (app.local), the server still runs on localhost:8181.
        const baseUrl = (location.hostname === 'app.local' || location.hostname === '')
          ? 'http://localhost:8181'
          : `${location.protocol}//${location.host}`;

        try {
          const resp = await fetch(`${baseUrl}/transcribe`, {
            method: 'POST',
            body: formData
          });

          if (!resp.ok) {
            const errText = await resp.text();
            setStatus(`⚠️ API error ${resp.status}: ${errText}`, 'error');
          } else {
            const data = await resp.json();
            const text = data.text || '';
            if (text.trim()) {
              showTranscription(text.trim());
              // Send to C# host so it can process the command
              if (window.sendCommandToHost) window.sendCommandToHost('voiceTranscription', text.trim());
            } else {
              setStatus('⚠️ No speech detected.', 'error');
            }
          }
        } catch (err) {
          setStatus('⚠️ Network error: ' + err.message, 'error');
        } finally {
          resetBtn();
        }
      }

      function showTranscription(text) {
        voiceOutput.textContent = text;
        voiceOutput.classList.add('has-text');
        copyBtn.classList.add('visible');
        setStatus('✅ Transcription complete', 'success');
      }

      function setStatus(msg, cls) {
        voiceStatus.textContent = msg;
        voiceStatus.className = cls ? `${cls}` : '';
      }

      function resetBtn() {
        pttBtn.classList.remove('loading', 'recording');
        pttLabel.textContent = 'Hold to Record';
        _isRecording = false;
      }

      window.copyTranscription = function () {
        const text = voiceOutput.textContent;
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
          setStatus('📋 Copied!', 'success');
          setTimeout(() => setStatus('', ''), 2000);
        }).catch(() => setStatus('⚠️ Copy failed.', 'error'));
      };

      // Make voice panel draggable via its header
      makeDraggable(document.getElementById('voice-panel'), document.getElementById('voice-header'));
    })();

  </script>
</body>

</html>
