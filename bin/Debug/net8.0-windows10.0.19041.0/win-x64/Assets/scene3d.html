<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Scene Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
      min-width: 200px;
    }

    #hud .title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
    }

    #hud .hint {
      opacity: 0.45;
      font-size: 10px;
      margin-top: 6px;
    }

    #pose-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 195, 0, 0.25);
      border-radius: 8px;
      padding: 10px 14px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      backdrop-filter: blur(8px);
      min-width: 190px;
      font-family: 'Courier New', monospace;
    }

    #pose-panel .pt {
      font-size: 12px;
      font-weight: 600;
      color: #ffc300;
      margin-bottom: 6px;
      font-family: 'Segoe UI', sans-serif;
    }

    #pose-panel .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 2px;
    }

    #pose-panel .label {
      color: rgba(255, 255, 255, 0.45);
    }

    #pose-panel .val {
      color: #fff;
    }

    #pose-panel.hidden {
      display: none;
    }

    #legend {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 14px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      max-width: 220px;
      backdrop-filter: blur(8px);
    }

    #legend .lt {
      color: #fff;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .li {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }

    .ld {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #no-objects {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.2);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    #no-objects svg {
      display: block;
      margin: 0 auto 10px;
      opacity: 0.2;
    }
  </style>
</head>

<body>

  <div id="hud">
    <div class="title">🔬 3D Scene Preview</div>
    <div>Objects: <span id="obj-count">0</span></div>
    <div class="hint">Drag · Scroll to zoom</div>
  </div>

  <div id="pose-panel" class="hidden">
    <div class="pt">📷 Camera Pose</div>
    <div style="margin-bottom:6px; color:rgba(255,195,0,0.6); font-size:10px; font-family:'Segoe UI',sans-serif;">tvec
      (position)</div>
    <div class="row"><span class="label">X</span><span class="val" id="px">—</span></div>
    <div class="row"><span class="label">Y</span><span class="val" id="py">—</span></div>
    <div class="row"><span class="label">Z</span><span class="val" id="pz">—</span></div>
    <div style="margin:8px 0 4px; color:rgba(255,195,0,0.6); font-size:10px; font-family:'Segoe UI',sans-serif;">rvec
      (orientation)</div>
    <div class="row"><span class="label">Rx</span><span class="val" id="prx">—</span></div>
    <div class="row"><span class="label">Ry</span><span class="val" id="pry">—</span></div>
    <div class="row"><span class="label">Rz</span><span class="val" id="prz">—</span></div>
  </div>

  <div id="legend">
    <div class="lt">Detected Objects</div>
    <div id="legend-items"></div>
  </div>

  <div id="no-objects">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="white">
      <path
        d="M12 2l-5.5 9h11L12 2zm0 3.84L14.77 10H9.23L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5S15.01 22 17.5 22s4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zm0 7a2.5 2.5 0 010-5 2.5 2.5 0 010 5zM3 21.5h8v-8H3v8zm2-6h4v4H5v-4z" />
    </svg>
    Scan the scene to detect objects
  </div>

  <script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Renderer ──
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    document.body.appendChild(renderer.domElement);

    // ── Scene ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);
    scene.fog = new THREE.Fog(0x0a0a0f, 5, 16);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 50);
    camera.position.set(0.33 + 1.2, 1.2, 0.35 + 0.3); // Camera naturally on the right
    camera.lookAt(0.33, 0.05, 0.35);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.target.set(0.33, 0.05, 0.35);
    controls.maxPolarAngle = Math.PI / 2 + 0.15;
    controls.minDistance = 0.3; controls.maxDistance = 10;

    // ── Lighting ──
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dir = new THREE.DirectionalLight(0xffffff, 1.6);
    dir.position.set(1.5, 3, 2); dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    dir.shadow.camera.left = -2; dir.shadow.camera.right = 2;
    dir.shadow.camera.top = 2; dir.shadow.camera.bottom = -2;
    scene.add(dir);
    const fill = new THREE.PointLight(0x4444ff, 0.5, 5);
    fill.position.set(-1.5, 1.5, -1); scene.add(fill);

    // ── Table (Real world size 81cm x 81cm) ──
    const TABLE_W = 0.81, TABLE_D = 0.81;

    // The calibration grid is physically placed at the Top-Left of the table.
    // In OpenCV world space, the Grid Center is (0,0). X points Right, Y points Forward (Up).
    // In Three.js space, X points Right, -Z points Forward.
    // So the Table center is to the Right (+X) and Backwards (+Z in Three.js) from the origin!
    // Grid size ~15cm x 11cm. Its center is ~7.5cm from left, ~5.5cm from top.
    const TABLE_CX = (0.81 / 2) - 0.075;   // ~0.33m right of the grid
    const TABLE_CZ = (0.81 / 2) - 0.055;   // ~0.35m backward from grid (-Y -> +Z)

    const tableMat = new THREE.MeshStandardMaterial({ color: 0x14142a, roughness: 0.55, metalness: 0.1 });
    const tableMesh = new THREE.Mesh(new THREE.BoxGeometry(TABLE_W, 0.012, TABLE_D), tableMat);
    tableMesh.receiveShadow = true;
    tableMesh.position.set(TABLE_CX, -0.006, TABLE_CZ);
    scene.add(tableMesh);

    const grid = new THREE.GridHelper(TABLE_W, 12, 0x252560, 0x252560);
    grid.position.set(TABLE_CX, 0.001, TABLE_CZ);
    scene.add(grid);

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(TABLE_W, 0.012, TABLE_D)),
      new THREE.LineBasicMaterial({ color: 0x3a3a8a })
    );
    edges.position.copy(tableMesh.position); scene.add(edges);

    // World axes on the table at origin (top left grid center)
    const axesHelper = new THREE.AxesHelper(0.15);
    axesHelper.position.y = 0.002; scene.add(axesHelper);

    // ── Object group ──
    const objGroup = new THREE.Group();
    scene.add(objGroup);

    // ── Camera Cone (virtual camera visualisation) ──
    let camCone = null;
    let camFrustumLines = null;

    function buildCameraViz(tx, ty, tz, poseObj) {
      // Remove previous
      if (camCone) { scene.remove(camCone); camCone.geometry.dispose(); camCone.material.dispose(); }
      if (camFrustumLines) { scene.remove(camFrustumLines); camFrustumLines.geometry.dispose(); camFrustumLines.material.dispose(); }

      // Body of camera
      const coneGeo = new THREE.ConeGeometry(0.06, 0.14, 6);
      const coneMat = new THREE.MeshStandardMaterial({ color: 0xffc300, emissive: 0xffc300, emissiveIntensity: 0.12, roughness: 0.4 });
      camCone = new THREE.Mesh(coneGeo, coneMat);

      // 2. Map OpenCV Object Space -> Three.js Space
      // OpenCV Space: X is Right, Y is Down (forward along table), Z is Into Table
      // Three Space: X is Right, Y is Up, Z is Backward
      const camX = Math.max(TABLE_CX - TABLE_W, Math.min(TABLE_CX + TABLE_W, tx));
      
      // Guard height with Math.abs() in case SolvePnP ever fluctuates
      const camY = Math.max(0.1, Math.min(3.0, Math.abs(tz))); 
      
      const camZ = Math.max(TABLE_CZ - TABLE_D, Math.min(TABLE_CZ + TABLE_D, ty)); 

      camCone.position.set(camX, camY, camZ);

      if (poseObj && poseObj.R11 !== undefined) {
        const R11 = poseObj.R11, R12 = poseObj.R12, R13 = poseObj.R13;
        const R21 = poseObj.R21, R22 = poseObj.R22, R23 = poseObj.R23;
        const R31 = poseObj.R31, R32 = poseObj.R32, R33 = poseObj.R33;

        // Rigidly map the Local Camera Basis vectors (Right, Up, and Backward)
        const camMatrix = new THREE.Matrix4();
        camMatrix.makeBasis(
          new THREE.Vector3( R11, -R31,  R21),    // Local +X (Camera Right)
          new THREE.Vector3(-R12,  R32, -R22),    // Local +Y (Camera Up)
          new THREE.Vector3(-R13,  R33, -R23)     // Local +Z (Camera Backward)
        );

        camCone.quaternion.setFromRotationMatrix(camMatrix);
        camCone.rotateX(-Math.PI / 2); // Pivot cone to point tip at Look target
      } else {
        camCone.rotation.x = Math.PI; 
      }

      camCone.castShadow = false;
      scene.add(camCone);

      // Frustum lines to table corners
      const footW = camY * 0.85, footH = camY * 0.65;
      const corners = [
        new THREE.Vector3(camX - footW / 2, 0, camZ - footH / 2),
        new THREE.Vector3(camX + footW / 2, 0, camZ - footH / 2),
        new THREE.Vector3(camX + footW / 2, 0, camZ + footH / 2),
        new THREE.Vector3(camX - footW / 2, 0, camZ + footH / 2),
      ];
      const lines = [];
      const apex = new THREE.Vector3(camX, camY, camZ);
      corners.forEach(c => { lines.push(apex); lines.push(c); });
      // rectangle
      for (let i = 0; i < 4; i++) { lines.push(corners[i]); lines.push(corners[(i + 1) % 4]); }

      const fGeo = new THREE.BufferGeometry().setFromPoints(lines);
      const fMat = new THREE.LineBasicMaterial({ color: 0xffc300, opacity: 0.45, transparent: true });
      camFrustumLines = new THREE.LineSegments(fGeo, fMat);
      scene.add(camFrustumLines);
    }

    // ── Helpers ──
    function colorFromLabel(label) {
      const map = {
        red: 0xff3333, blue: 0x3366ff, green: 0x33cc66, yellow: 0xffdd00,
        orange: 0xff7700, purple: 0xaa44ff, pink: 0xff66aa, white: 0xeeeeff,
        black: 0x222233, grey: 0x778899, gray: 0x778899, brown: 0xaa6633,
        cyan: 0x00ddff, magenta: 0xff00aa,
      };
      const lo = label.toLowerCase();
      for (const [k, v] of Object.entries(map)) if (lo.includes(k)) return v;
      let h = 0; for (const c of label) h = (c.charCodeAt(0) + ((h << 5) - h)) | 0;
      return Math.abs(h) % 0xffffff;
    }

    // ── Public API (called from C#) ──
    window.setDetectedObjects = function (jsonStr) {
      try { renderObjects(JSON.parse(jsonStr)); } catch (e) { console.error(e); }
    };

    window.setCameraPose = function (jsonStr) {
      try {
        const p = JSON.parse(jsonStr);
        // Update UI panel
        const panel = document.getElementById('pose-panel');
        panel.classList.remove('hidden');
        document.getElementById('px').textContent = p.X.toFixed(4) + ' m';
        document.getElementById('py').textContent = p.Y.toFixed(4) + ' m';
        document.getElementById('pz').textContent = p.Z.toFixed(4) + ' m';
        document.getElementById('prx').textContent = p.Rx.toFixed(4);
        document.getElementById('pry').textContent = p.Ry.toFixed(4);
        document.getElementById('prz').textContent = p.Rz.toFixed(4);
        // Update 3D camera cone
        buildCameraViz(p.X, p.Y, p.Z, p);
      } catch (e) { console.error(e); }
    };

    const legendEl = document.getElementById('legend-items');
    const noObjEl = document.getElementById('no-objects');
    const countEl = document.getElementById('obj-count');

    function clearObjects() {
      while (objGroup.children.length) {
        const c = objGroup.children[0];
        c.geometry?.dispose();
        (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m?.dispose());
        objGroup.remove(c);
      }
      legendEl.innerHTML = '';
    }

    function renderObjects(items) {
      clearObjects();
      noObjEl.style.display = items.length ? 'none' : 'block';
      countEl.textContent = items.length;

      items.forEach(item => {
        const raw = colorFromLabel(item.label);
        const col = new THREE.Color(raw);

        // worldX / worldY are in metres from the camera's perspective projection
        // Map as OpenCV X → Three.js X, OpenCV Y (Forward) → Three.js -Z (Forward)
        // We clamp based on the real Table bounds!
        const px = Math.max(TABLE_CX - TABLE_W * 0.5, Math.min(TABLE_CX + TABLE_W * 0.5, item.worldX));
        const pz = Math.max(TABLE_CZ - TABLE_D * 0.5, Math.min(TABLE_CZ + TABLE_D * 0.5, item.worldY));

        const bw = Math.max(0.025, Math.min(0.35, item.sizeW));
        const bd = Math.max(0.025, Math.min(0.35, item.sizeH));
        const bh = (bw + bd) * 0.45;

        const geo = new THREE.BoxGeometry(bw, bh, bd);
        const mat = new THREE.MeshStandardMaterial({
          color: col, roughness: 0.35, metalness: 0.15,
          emissive: col, emissiveIntensity: 0.08
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true; mesh.receiveShadow = true;
        mesh.position.set(px, bh / 2, pz);
        objGroup.add(mesh);

        // Wireframe
        const wire = new THREE.LineSegments(
          new THREE.EdgesGeometry(geo),
          new THREE.LineBasicMaterial({ color: col })
        );
        wire.position.copy(mesh.position); objGroup.add(wire);

        // Footprint ring
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(bw * 0.45, bw * 0.62, 32),
          new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide, transparent: true, opacity: 0.3, depthWrite: false })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(px, 0.002, pz); objGroup.add(ring);

        // Legend
        const d = document.createElement('div');
        d.className = 'li';
        d.innerHTML = `<div class="ld" style="background:#${col.getHexString()}"></div><span>${item.label}</span>`;
        legendEl.appendChild(d);
      });
    }

    // ── Render loop ──
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
